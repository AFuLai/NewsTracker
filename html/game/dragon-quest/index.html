<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DRAGON QUEST JS: REALM OF THE BRAVE - 勇者鬥惡龍</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crt-scanlines"></div>

  <div class="dq-container">
    <!-- Top Stats Header -->
    <header class="dq-header">
      <div class="dq-stat-card">
        <span class="hero-name" id="hudName">勇者 (HERO)</span>
        <span class="hero-lvl">LV <span id="hudLvl" class="val-gold">1</span></span>
      </div>
      <div class="dq-stat-card">
        <span class="stat-lbl">HP:</span>
        <span class="stat-val" id="hudHP">35 / 35</span>
        <div class="stat-bar"><div id="hpFill" class="fill hp-fill" style="width: 100%"></div></div>
      </div>
      <div class="dq-stat-card">
        <span class="stat-lbl">MP:</span>
        <span class="stat-val" id="hudMP">15 / 15</span>
        <div class="stat-bar"><div id="mpFill" class="fill mp-fill" style="width: 100%"></div></div>
      </div>
      <div class="dq-stat-card">
        <span class="stat-lbl">GOLD:</span>
        <span class="val-gold" id="hudGold">50 G</span>
      </div>
      <div class="dq-stat-card">
        <span class="stat-lbl">EXP:</span>
        <span class="val-cyan" id="hudExp">0 / 20</span>
      </div>
    </header>

    <!-- Main Viewport Canvas -->
    <main class="canvas-box">
      <canvas id="dqCanvas" width="768" height="512"></canvas>

      <!-- DQ Retro Dialogue / Message Window -->
      <div id="dialogueBox" class="dq-window dialogue-window hidden">
        <div class="window-title" id="dialogueSpeaker">國王 (KING)</div>
        <p class="window-text" id="dialogueText">勇者啊！邪惡的巨龍掠奪了王國的寶物並威脅世界，請前往南方洞窟討伐惡龍！</p>
        <div class="dialogue-prompt">&#9660; [SPACE / ENTER]</div>
      </div>

      <!-- Turn-Based Battle Command Overlay -->
      <div id="battleOverlay" class="battle-overlay hidden">
        <div class="battle-enemy-card">
          <div class="enemy-name" id="enemyName">史萊姆 (SLIME)</div>
          <div class="enemy-hp-bar"><div id="enemyHpFill" class="fill enemy-fill" style="width: 100%"></div></div>
        </div>

        <div class="battle-log-window dq-window">
          <p id="battleLogText">一隻史萊姆出現了！勇者該如何行動？</p>
        </div>

        <div class="battle-menu dq-window">
          <button class="dq-cmd-btn" id="btnAttack">&#9876; 攻擊 (ATTACK)</button>
          <button class="dq-cmd-btn" id="btnMagic">&#10024; 咒文 (SPELL)</button>
          <button class="dq-cmd-btn" id="btnItem">&#129520; 道具 (ITEM)</button>
          <button class="dq-cmd-btn" id="btnRun">&#127939; 逃跑 (RUN)</button>
        </div>

        <!-- Magic Submenu Window -->
        <div id="magicMenu" class="magic-menu dq-window hidden">
          <button class="dq-cmd-btn" id="btnSpellHeal">&#10084; 霍伊米 (HEAL) - 3 MP</button>
          <button class="dq-cmd-btn" id="btnSpellFire">&#128293; 美拉 (FIREBALL) - 4 MP</button>
          <button class="dq-cmd-btn" id="btnSpellThunder">&#9889; 萊丁 (THUNDER) - 8 MP</button>
          <button class="dq-cmd-btn btn-back" id="btnSpellBack">&#8617; 返回 (BACK)</button>
        </div>
      </div>

      <!-- Start / Victory / Game Over Overlay -->
      <div id="gameModal" class="dq-modal">
        <div class="modal-content dq-window">
          <h1 id="modalTitle" class="dq-title">勇者鬥惡龍</h1>
          <div class="dq-sub">DRAGON QUEST: REALM OF THE HERO</div>
          <p id="modalDesc" class="modal-text">
            探索羅德王國、城堡與地下迷宮。擊敗史萊姆、骷髏戰士與巨龍，提升等級並解鎖強力咒文！
          </p>
          <button id="startBtn" class="dq-main-btn">踏上冒險旅程 (START)</button>
        </div>
      </div>
    </main>

    <!-- Mobile Virtual Gamepad -->
    <div class="mobile-gamepad">
      <div class="dpad-cross">
        <button class="pad-btn btn-up" id="mBtnUp">&uarr;</button>
        <div class="dpad-mid">
          <button class="pad-btn btn-left" id="mBtnLeft">&larr;</button>
          <button class="pad-btn btn-down" id="mBtnDown">&darr;</button>
          <button class="pad-btn btn-right" id="mBtnRight">&rarr;</button>
        </div>
      </div>
      <div class="action-buttons">
        <button class="action-round btn-b" id="mBtnCancel">B</button>
        <button class="action-round btn-a" id="mBtnAction">A</button>
      </div>
    </div>
  </div>

  <script src="dq.js"></script>
</body>
</html>
