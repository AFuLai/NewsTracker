[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracker"
version = "0.0.0"
description = "Security news tracker — WSL+Ollama local pipeline"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "feedparser>=6.0",
  "httpx>=0.27",
  "curl-cffi>=0.7",
  "trafilatura>=1.12",
  "selectolax>=0.3",
  "jinja2>=3.1",
  "typer>=0.12",
  "pydantic>=2.7",
  "rich>=13.7",
]

[project.scripts]
tracker = "tracker.cli:app"

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["prompts/*.txt", "templates/*.j2"]
