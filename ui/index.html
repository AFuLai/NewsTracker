  // official revision comes first, because our crawl dates cannot order the
  // sites' own updates and the pages' stated dates can.
  const groups = new Map();
  topics.forEach(t => {
    const k = libGroupKey(t, lib.sources);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  });
  const byDateDesc = (a, b) => (libWhen(b).date || '').localeCompare(libWhen(a).date || '');
  groups.forEach(g => g.sort(byDateDesc));
  // cluster/source read alphabetically; date reads newest month first
  const keys = [...groups.keys()].sort();
  if (state.libGroup === 'date') keys.reverse();
  const frag = document.createDocumentFragment();
  keys.forEach(k => {
    const div = document.createElement('div');
    div.className = 'date-divider';
    div.textContent = k + ' · ' + groups.get(k).length;
    frag.appendChild(div);
    const list = document.createElement('div');
    list.className = 'lib-list';
    groups.get(k).forEach(t =>
      list.appendChild(buildLibRow(t, lib.generated, lib.sources)));
    frag.appendChild(list);
  });
  main.appendChild(frag);
}
// The heading a topic files under, per the active arrangement.
function libGroupKey(t, sources) {
  if (state.libGroup === 'source') return (sources && sources[t.source]) || t.source;
  if (state.libGroup === 'date') {
    const d = libWhen(t).date;
    return d ? d.slice(0, 7) : (state.lang === 'en' ? 'Undated' : '未標日期');
  }
  return t.cluster || (state.lang === 'en' ? 'Other' : '其他');
}
function buildLibSortPills() {
  const el = document.getElementById('lib-sort');
  if (!el) return;
  el.innerHTML = '';
  const en = state.lang === 'en';
  el.setAttribute('aria-label', en ? 'Arrange library by' : '圖書庫排列方式');
  const lbl = document.createElement('span');
  lbl.className = 'lib-sort-label';
  lbl.textContent = en ? 'Arrange' : '排列';
  el.appendChild(lbl);
  [['cluster', '分類', 'Category'], ['date', '日期', 'Date'], ['source', '來源', 'Source']]
    .forEach(([key, zh, enLabel]) => {
      const btn = document.createElement('button');
      btn.className = 'pill sort-pill';
      btn.dataset.group = key;
      btn.textContent = en ? enLabel : zh;
      const on = state.libGroup === key;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', String(on));
      btn.onclick = () => {
        state.libGroup = key;
        try { prefSet('tracker_lib_group', key); } catch (e) {}
        buildLibSortPills();
        renderLibrary();
      };
      el.appendChild(btn);
    });
}
// Which date to show for a topic, and how much it is worth. `source_date` is
// what the page itself states (dateModified / datePublished, or the document's
// HTTP build stamp); only that can put the official updates in order. Our own
// crawl dates are the last resort — they say when *we* noticed, not when the
// site changed.
const LIB_DATE_LABEL = {
  modified:  { zh: '官方更新', en: 'official update' },
  published: { zh: '官方發佈', en: 'published' },
  site:      { zh: '站台部署', en: 'site build' },
  detected:  { zh: '偵測變更', en: 'change detected' },
  added:     { zh: '收錄',     en: 'catalogued' }
};
function libWhen(t) {
  if (t.source_date) return { date: t.source_date, kind: t.date_kind || 'modified' };
  if (t.last_changed) return { date: t.last_changed, kind: 'detected' };
  return { date: t.first_seen || '', kind: 'added' };
}
// A marker that fires on everything says nothing. A freshly seeded catalogue
// has every topic "first seen" on the same day, which put a NEW chip on all 94
// rows — pure noise. Below the threshold the chip is worth its ink again.
const LIB_NEW_MAX_SHARE = 0.5;
var LIB_SHOW_NEW = true;          // recomputed by renderLibrary()
function libNewChipUseful(topics, gen) {
  if (!gen || !topics.length) return false;
  const n = topics.filter(t => t.first_seen && daysBetween(t.first_seen, gen) <= 14).length;
  return n / topics.length <= LIB_NEW_MAX_SHARE;
}
function buildLibRow(t, gen, sources) {
  const a = document.createElement('a');
  a.className = 'lib-row';
  a.href = t.url; a.target = '_blank'; a.rel = 'noopener';
  const en = state.lang === 'en';
  const when = libWhen(t);
  const isNew = LIB_SHOW_NEW && t.first_seen && gen && daysBetween(t.first_seen, gen) <= 14;
  // "Updated" means the *page* says it was revised recently, or we detected its
  // body changing. A `site` build stamp is not evidence that this topic changed
  // — it moves for every page at once — so it never earns the chip.
  const isUpd = !isNew && when.date && gen
             && (when.kind === 'modified' || when.kind === 'published'
                 || (when.kind === 'detected' && t.last_changed !== t.first_seen))
             && daysBetween(when.date, gen) <= 14;
  const chip = isNew ? '<span class="lib-chip new">' + (en ? 'NEW' : '新') + '</span>'
             : isUpd ? '<span class="lib-chip upd">' + (en ? 'UPDATED' : '更新') + '</span>'
             : '';
  const lbl = (LIB_DATE_LABEL[when.kind] || LIB_DATE_LABEL.detected)[en ? 'en' : 'zh'];
  const weak = (when.kind === 'site' || when.kind === 'detected' || when.kind === 'added');
  // Never repeat what the group heading already says.
  const side = [];
  if (state.libGroup !== 'cluster' && t.cluster) side.push(t.cluster);
  if (state.libGroup !== 'source') side.push((sources && sources[t.source]) || t.source);
  a.innerHTML =
    '<span class="lib-date' + (weak ? ' weak' : '') + '" title="' + escHtml(lbl) + '">' +
      escHtml(when.date || '—') + '</span>' +
    '<span class="lib-name">' + escHtml(t.title) + chip + '</span>' +
    '<span class="lib-side">' + escHtml(side.join(' · ')) + '</span>';
  return a;
}

// ── Year selection ────────────────────────────────────
function selectYear(year) {
  state.currentYear = year;
  setActivePill('#year-pills', '[data-year="' + year + '"]');
  if (state.searchQuery && state.search) {
    // Search mode: show all matched articles in this year; menu reflects matches.
    buildMonthGrid(year);
    clearActiveMonthBtn();
    hideDateList();
    state.currentMode = 'search';
    state.currentMonth = null;
    state.currentDate = null;
    renderArticles(searchDatesInYear(year));
    return;
  }
  showMsg(L().ui.loadYear(year));
  loadYearManifest(year, () => {
    buildMonthGrid(year);
    const ym = getYearManifest(year);
    const months = (ym && ym.months) || [];
    if (pendingRestore && pendingRestore.fullYear) {
      pendingRestore = null; restoring = false; selectFullYear(); return;
    }
    const target = (pendingRestore && pendingRestore.month && months.includes(pendingRestore.month))
      ? pendingRestore.month : months[0];
    if (target) selectMonth(target);
    else { pendingRestore = null; restoring = false; }
  });
}

// ── Month selection ───────────────────────────────────
function selectMonth(month) {
  state.currentMode  = 'month';
  state.currentMonth = month;
  state.currentDate  = null;
  setActiveMonthBtn(month);
  showMsg(L().ui.loadMonth(month));

  loadMonthManifest(month, () => {
    buildDateList(month);
    const dates = getDatesForMonth(month);
    if (!dates.length) { renderArticles([]); pendingRestore = null; restoring = false; return; }
    // Renders the whole month, then (deep-link) jumps to a specific date once
    // its day file is present. In the normal flow jumpDate is null → no-op.
    const done = () => {
      const jumpDate = (pendingRestore && pendingRestore.date &&
        dates.some(x => x.date === pendingRestore.date)) ? pendingRestore.date : null;
      pendingRestore = null; restoring = false;
      renderArticles(dates.map(d2 => d2.date));
      if (jumpDate) selectDate(jumpDate);
    };
    const toLoad = dates.filter(d => !state.loadedFiles.has(d.file));
    if (!toLoad.length) { done(); return; }
    let pending = toLoad.length;
    toLoad.forEach(d => loadDayFile(d.file, () => { if (--pending === 0) done(); }));
  });
}

// ── Full-year ─────────────────────────────────────────
function selectFullYear() {
  state.currentMode  = 'full-year';
  state.currentMonth = null;
  state.currentDate  = null;
  clearActiveMonthBtn();
  hideDateList();
  if (state.searchQuery && state.search) {
    renderArticles(searchDatesInYear(state.currentYear));
    return;
  }
  showMsg(t('loadFullYear'));

  const ym = getYearManifest(state.currentYear);
  if (!ym || !ym.months || !ym.months.length) { renderArticles([]); return; }
  let pending = ym.months.length;
  ym.months.forEach(m => loadMonthManifest(m, () => {
    if (--pending > 0) return;
    // Use the tracker-aware helper instead of reading TRACKER_MONTH flat —
    // the new layout nests by tracker: window.TRACKER_MONTH[tracker][month].
    const allDates = ym.months.flatMap(m2 => getDatesForMonth(m2));
    const toLoad = allDates.filter(d => !state.loadedFiles.has(d.file));
    if (!toLoad.length) { renderArticles(allDates.map(d => d.date)); return; }
    let dp = toLoad.length;
    toLoad.forEach(d => loadDayFile(d.file, () => {
      if (--dp === 0) renderArticles(allDates.map(d2 => d2.date));
    }));
  }));
}

// ── Date selection ────────────────────────────────────
function selectDate(date) {
  state.currentMode = 'date';
  state.currentDate = date;
  document.querySelectorAll('.date-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
  const btn = document.querySelector('.date-btn[data-date="' + date + '"]');
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }
  renderArticles([date]);
  // On compact the drawer is modal — dismiss it after picking a date so the
  // results aren't hidden behind it. (Not during a deep-link restore.)
  if (!restoring && isCompact()) closeNav(false);
}

// ── Build UI helpers ──────────────────────────────────
function buildYearPills(years) {
  const el = document.getElementById('year-pills');
  el.innerHTML = '';
  years.forEach((y, i) => {
    const btn = document.createElement('button');
    btn.className = 'pill year-pill' + (i === 0 ? ' active' : '');
    btn.dataset.year = y;
    btn.textContent = y;
    btn.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    btn.onclick = () => selectYear(y);
    el.appendChild(btn);
  });
}

function buildCatPills(cats) {
  const el = document.getElementById('cat-pills');
  el.innerHTML = '';
  const all = ['全部', ...cats];
  const icons = { '全部':'', '法規與標準':'📋 ', '漏洞與威脅情報':'🔴 ', '供應鏈與開源安全':'🔗 ', '重大事件':'🚨 ', '前瞻技術':'🚀 ',
                  'Linux':'🐧 ', 'Windows':'🪟 ', 'Apple':'🍎 ', 'Android':'🤖 ', '重點關注':'⭐ ' };
  const mkPill = (c) => {
    const btn = document.createElement('button');
    btn.className = 'pill cat-pill';
    btn.dataset.cat = c;   // key stays Chinese; only the label is localized
    btn.dataset.icon = icons[c] || '';
    btn.onclick = () => setFilter(c);
    return btn;
  };
  all.forEach((c) => el.appendChild(mkPill(c)));
  const wp = document.createElement('button');   // 只看關注: not a category, so refreshCatPills skips it
  wp.className = 'pill watch-pill';
  wp.onclick = toggleWatchOnly;
  el.appendChild(wp);
  // Second row (rebuilt on every call, so a tracker switch removes it).
  // Skip any category already in the first row: never two pills per data-cat.
  const sec = SECONDARY_PILLS[state.currentTracker];
  const secCats = sec ? sec.cats.filter(c => !all.includes(c)) : [];
  if (secCats.length) {
    const row = document.createElement('div');
    row.className = 'cat-row-2';
    const lab = document.createElement('span');
    lab.className = 'cat-row-label';
    lab.textContent = sec.label;
    row.appendChild(lab);
    secCats.forEach((c) => row.appendChild(mkPill(c)));
    el.appendChild(row);
  }
  refreshCatPills();   // sets textContent (icon + label + selected-checkmark), active, aria-pressed
  refreshWatchPill();
}

// Multi-select: 全部 is active when nothing is picked; otherwise every picked
// category pill is highlighted (more than one can be on at once). Selected
// chips get a leading "✓ " per the MD3 filter-chip convention (background
// colour alone is not a reliable selected-state signal here, since the
// selected fill IS the category's own hue).
function refreshCatPills() {
  document.querySelectorAll('#cat-pills .cat-pill').forEach(btn => {
    const c = btn.dataset.cat;
    const on = c === '全部' ? state.filterCats.size === 0 : state.filterCats.has(c);
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    const check = (on && c !== '全部') ? '✓ ' : '';
    btn.textContent = check + (btn.dataset.icon || '') + catLabel(c);
  });
}

function buildMonthGrid(year) {
  let availMonths;
  if (state.searchQuery && state.search) {
    // Only months that contain matched dates are selectable.
    availMonths = new Set(Object.keys(state.search.countByDate)
      .filter(d => d.slice(0, 4) === year).map(d => d.slice(0, 7)));
  } else {
    const ym = getYearManifest(year);
    availMonths = new Set(ym?.months || []);
  }
  const grid = document.getElementById('month-grid');
  grid.innerHTML = '';
  const monthNames = L().months;
  for (let m = 1; m <= 12; m++) {
    const key = year + '-' + String(m).padStart(2, '0');
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (availMonths.has(key) ? '' : ' empty');
    btn.dataset.month = key;
    btn.textContent = monthNames[m - 1];
    if (availMonths.has(key)) {
      btn.setAttribute('aria-pressed', 'false');
      btn.onclick = () => selectMonth(key);
    } else {
      btn.setAttribute('aria-disabled', 'true');
    }
    grid.appendChild(btn);
  }
}

function setActiveMonthBtn(month) {
  document.querySelectorAll('.month-btn').forEach(b => { b.classList.remove('active'); if (!b.classList.contains('empty')) b.setAttribute('aria-pressed', 'false'); });
  const btn = document.querySelector('.month-btn[data-month="' + month + '"]');
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }
}
function clearActiveMonthBtn() {
  document.querySelectorAll('.month-btn').forEach(b => { b.classList.remove('active'); if (!b.classList.contains('empty')) b.setAttribute('aria-pressed', 'false'); });
}

function buildDateList(month) {
  const dates = getDatesForMonth(month);
  const section = document.getElementById('date-section');
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  if (!dates.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  dates.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'date-btn' + (i === 0 ? ' active' : '');
    btn.dataset.date = d.date;
    btn.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    btn.innerHTML = '<span>' + d.date.slice(5) + '</span><span class="badge">' + d.count + '</span>';
    btn.onclick = () => selectDate(d.date);
    list.appendChild(btn);
  });
}
function hideDateList() {
  document.getElementById('date-section').style.display = 'none';
}

// ── Filter ────────────────────────────────────────────
function setFilter(cat) {
  if (cat === '全部') {
    state.filterCats.clear();                 // 全部 resets the multi-select
  } else if (state.filterCats.has(cat)) {
    state.filterCats.delete(cat);             // toggle off
  } else {
    state.filterCats.add(cat);                // toggle on (multi-select)
  }
  refreshCatPills();
  if (state.searchQuery && state.search) {
    refreshSearchView();   // date menu + counts depend on the category too
  } else {
    renderArticles();
  }
}

// ── Render ────────────────────────────────────────────
function renderArticles(dateList) {
  if (state.hubActive || state.wsActive) return;   // a late tracker load must not draw over the 我的關注 hub or the news workspace
  if (pendingOpenId !== null) setTimeout(openPendingArticle, 0);   // `a=` permalink: open once this render has finished
  if (dateList !== undefined) state.pendingDates = dateList;
  const dates = state.pendingDates;

  const main = document.getElementById('main-content');
  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('no-data').classList.add('hidden');

  // Collect articles
  let articles = TrackerStore.collect(window.TRACKER_DAYS || {}, { dates: dates || [] });

  // Filter by current tracker (multi-belong: keep items whose `trackers`
  // includes the current tracker; legacy items default to security).
  if (state.currentTracker) {
    articles = articles.filter(a => itemBelongsToTracker(a, state.currentTracker));
  }

  if (state.filterCats.size) {
    articles = articles.filter(a =>
      state.filterCats.has(effectiveCat(a, state.currentTracker)));
  }

  // Site-wide search: keep only items matching the query (in either language).
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    articles = articles.filter(a => matchesQuery(a, q));
  }

  // 只看關注: only articles matching an active watch rule (counted below).
  if (watchOnly) articles = articles.filter(a => watchLabels(a).length);

  document.getElementById('article-count').textContent = articles.length;
  syncHash();   // keep the URL in step with the current view

  // Clear old cards (keep search row + loading/no-data divs)
  Array.from(main.children).forEach(c => {
    if (c.id !== 'loading-msg' && c.id !== 'no-data' && c.id !== 'search-row') c.remove();
  });

  if (!articles.length) {
    const noData = document.getElementById('no-data');
    noData.classList.remove('hidden');
    noData.textContent = state.searchQuery
      ? L().ui.noResults(state.searchQuery)
      : (watchOnly ? t('noWatch')
      : state.filterCats.size === 0
          ? t('noData')
          : L().ui.noCat([...state.filterCats].map(catLabel).join(' / ')));
    return;
  }

  // Layout dispatch (view preset). All layouts render the same `articles`
  // array, so #article-count (set above) is identical across layouts.
  const layout = resolvePreset(viewPrefs).layout;
  if (layout === 'hub') { renderHub(main, articles); return; }
  if (layout === 'timeline') { renderTimeline(main, articles); return; }

  // Group by date descending
  const grouped = {};
  articles.forEach(a => {
    const d = a._date;
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(a);
  });
  const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

  const frag = document.createDocumentFragment();
  sortedDates.forEach((date, di) => {
    const divider = document.createElement('div');
    divider.className = 'date-divider';
    divider.textContent = date;
    frag.appendChild(divider);

    if (layout === 'river') {
      const list = document.createElement('div');
      list.className = 'river-list';
      grouped[date].forEach(a => list.appendChild(buildRiverRow(a)));
      frag.appendChild(list);
      return;
    }
    // grid (default; also the stand-in for layouts not built yet) and hero
    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    grouped[date].forEach((a, i) => {
      const card = buildCard(a);
      if (layout === 'hero' && di === 0 && i === 0) card.classList.add('card-hero');
      grid.appendChild(card);
    });
    frag.appendChild(grid);
  });
  main.appendChild(frag);
}

// Wire click/keyboard activation of an article element to the overlay.
function bindOpen(el, a) {
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', artTitle(a));
  el.onclick = () => openOverlay(a, el);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); openOverlay(a, el); }
  });
}

// river: one compact row = title + a single meta line.
function buildRiverRow(a) {
  const row = document.createElement('div');
  row.className = 'river-row';
  const ecat = effectiveCat(a, state.currentTracker);
  const srcName = a.sources && a.sources[0] ? a.sources[0].name : '';
  const meta = [catLabel(ecat), srcName, a._date].filter(Boolean).join(' · ');
  const wBadge = watchBadgeHtml(a);
  if (wBadge) row.classList.add('watched');
  row.innerHTML = [
    '<h3 class="card-title">' + wBadge + linkifyCVE(escHtml(artTitle(a))) + '</h3>',
    '<div class="card-meta">' + escHtml(meta) + '</div>'
  ].join('');
  bindOpen(row, a);
  return row;
}

// timeline: one group per CVE id found in the tags (an article with several CVEs
// appears under each), groups by latest date desc, rows newest first; articles
// without a CVE follow under "其他"/"Other" in the normal river layout.
function renderTimeline(main, articles) {
  const byDate = (x, y) => (y._date || '').localeCompare(x._date || '');
  const groups = {}, other = [];
  articles.forEach(a => {
    const ids = [];
    artTags(a).forEach(tg => { if (/^CVE-\d{4}-\d{4,}$/.test(tg) && !ids.includes(tg)) ids.push(tg); });
    if (!ids.length) { other.push(a); return; }
    ids.forEach(id => (groups[id] = groups[id] || []).push(a));
  });
  const list = Object.keys(groups).map(id => {
    const arts = groups[id].slice().sort(byDate);
    return { id: id, arts: arts, latest: arts[0]._date || '', first: arts[arts.length - 1]._date || '' };
  }).sort((x, y) => y.latest.localeCompare(x.latest) || x.id.localeCompare(y.id));
  const frag = document.createDocumentFragment();
  list.forEach(g => {
    const head = document.createElement('div');
    head.className = 'date-divider timeline-head';
    const span = g.first === g.latest ? g.latest : g.first + ' ~ ' + g.latest;
    head.textContent = g.id + ' · ' + L().ui.tlCount(g.arts.length) + ' · ' + span;
    frag.appendChild(head);
    const rows = document.createElement('div');
    rows.className = 'river-list';
    g.arts.forEach(a => rows.appendChild(buildRiverRow(a)));
    frag.appendChild(rows);
  });
  if (other.length) {
    const head = document.createElement('div');
    head.className = 'date-divider timeline-head';
    head.textContent = L().ui.tlOther;
    frag.appendChild(head);
    const rows = document.createElement('div');
    rows.className = 'river-list';
    other.slice().sort(byDate).forEach(a => rows.appendChild(buildRiverRow(a)));
    frag.appendChild(rows);
  }
  main.appendChild(frag);
}

// hub: sections grouped by effective category (tracker's own order first).
function renderHub(main, articles) {
  const groups = {};
  articles.forEach(a => {
    const c = effectiveCat(a, state.currentTracker);
    (groups[c] = groups[c] || []).push(a);
  });
  const own = ((currentManifest() || {}).categories) || [];
  const keys = Object.keys(groups).sort((x, y) => {
    const ix = own.indexOf(x), iy = own.indexOf(y);
    return (ix < 0 ? 1e6 : ix) - (iy < 0 ? 1e6 : iy);
  });
  const frag = document.createDocumentFragment();
  keys.forEach(c => {
    const head = document.createElement('div');
    head.className = 'date-divider hub-title';
    head.textContent = catLabel(c) + ' (' + groups[c].length + ')';
    frag.appendChild(head);
    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    groups[c].forEach(a => grid.appendChild(buildCard(a)));
    frag.appendChild(grid);
  });
  main.appendChild(frag);
}

function buildCard(a) {
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', artTitle(a));
  const ecat = effectiveCat(a, state.currentTracker);
  const catClass = 'cat-' + ecat;   // colour class keyed on the viewing tracker's category
  const title = artTitle(a), summary = artSummary(a);
  const preview = summary;
  const srcName = a.sources && a.sources[0] ? escHtml(a.sources[0].name) : '';
  const srcCountHtml = resolvePreset(viewPrefs).showSrcCount
    ? ' · ' + escHtml(L().ui.srcCount((a.sources || []).length)) : '';
  const tagsHtml = artTags(a).map(tg => {
    if (/^CVE-\d{4}-\d{4,}$/.test(tg)) {
      return '<a class="card-tag" href="https://www.cve.org/CVERecord?id=' + tg + '" target="_blank" rel="noopener">' + escHtml(tg) + '</a>';
    }
    return '<span class="card-tag">' + escHtml(tg) + '</span>';
  }).join('');
  const wBadge = watchBadgeHtml(a);
  if (wBadge) card.classList.add('watched');
  card.innerHTML = [
    '<span class="cat-badge ' + catClass + '">' + escHtml(catLabel(ecat)) + '</span>' + wBadge,
    '<h3 class="card-title">' + linkifyCVE(escHtml(title)) + '</h3>',
    '<p class="card-summary-preview">' + escHtml(preview) + '</p>',
    '<div class="card-tags">' + tagsHtml + '</div>',
    '<div class="card-meta">' + srcName + (srcName ? ' · ' : '') + escHtml(a._date) + srcCountHtml + '</div>'
  ].join('');
  card.onclick = () => openOverlay(a, card);
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); openOverlay(a, card); }
    else if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); openOverlay(a, card); }  // prevent page scroll
  });
  return card;
}

// Focus that gets restored to the triggering card once the dialog closes.
let overlayReturnFocus = null;
function overlayTabTrap(e) {
  if (e.key !== 'Tab') return;
  const box = document.getElementById('overlay-box');
  const focusables = [...box.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
// Article id (String(id) or _key) shown in the overlay, or null; syncHash mirrors it as `a=`.
var overlayArticleId = null;
function openOverlay(a, triggerEl) {
  overlayReturnFocus = triggerEl || document.activeElement;
  const box = document.getElementById('overlay-box');
  const ecat = effectiveCat(a, state.currentTracker);
  const catClass = 'cat-' + ecat;
  const srcHtml = (a.sources || []).map(s =>
    '<li><a href="' + escHtml(safeHref(s.url)) + '" target="_blank" rel="noopener">[' + escHtml(s.lang) + '] ' + escHtml(s.name) + '</a></li>'
  ).join('');
  const tagsHtml = artTags(a).map(tg => {
    if (/^CVE-\d{4}-\d{4,}$/.test(tg)) {
      return '<a class="card-tag" href="https://www.cve.org/CVERecord?id=' + tg + '" target="_blank" rel="noopener">' + escHtml(tg) + '</a>';
    }
    return '<span class="card-tag">' + escHtml(tg) + '</span>';
  }).join('');
  box.innerHTML = [
    '<button id="overlay-close" onclick="closeOverlay()" aria-label="' + escHtml(t('close')) + '"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>',
    '<span class="cat-badge ' + catClass + '">' + escHtml(catLabel(ecat)) + '</span>',
    '<h2 id="overlay-title">' + linkifyCVE(escHtml(artTitle(a))) + '</h2>',
    '<p class="card-summary">' + linkifyCVE(escHtml(artSummary(a))) + '</p>',
    '<div class="card-tags">' + tagsHtml + '</div>',
    '<hr>',
    '<h4>' + escHtml(t('sources')) + '</h4>',
    '<ul>' + srcHtml + '</ul>'
  ].join('');
  document.getElementById('overlay').classList.remove('hidden');
  document.addEventListener('keydown', overlayTabTrap);
  const closeBtn = document.getElementById('overlay-close');
  if (closeBtn) closeBtn.focus();
  overlayArticleId = (a.id !== undefined && a.id !== null) ? String(a.id) : (a._key !== undefined && a._key !== null ? String(a._key) : null);
  if (overlayArticleId !== null) syncHash();
}
function closeOverlay() {
  const overlay = document.getElementById('overlay');
  const wasOpen = !overlay.classList.contains('hidden');
  overlay.classList.add('hidden');
  document.removeEventListener('keydown', overlayTabTrap);
  if (wasOpen && overlayReturnFocus && document.body.contains(overlayReturnFocus)) {
    overlayReturnFocus.focus();
  }
  overlayReturnFocus = null;
  if (overlayArticleId !== null) { overlayArticleId = null; syncHash(); }
}

// ── Load helpers ──────────────────────────────────────
function loadYearManifest(year, cb, tracker = state.currentTracker) {
  const key = tracker + '/' + year;
  if (state.loadedYears.has(key)) { cb(); return; }
  const mf = (getTrackers() || {})[tracker];
  const file = mf && mf.yearFiles && mf.yearFiles[year];
  if (!file) { state.loadedYears.add(key); cb(); return; }
  injectScript(file, () => { state.loadedYears.add(key); cb(); });
}

function loadMonthManifest(month, cb, tracker = state.currentTracker) {
  const key = tracker + '/' + month;
  if (state.loadedMonths.has(key)) { cb(); return; }
  const ym = getYearManifest(month.slice(0, 4), tracker);
  const monthFile = ym && ym.monthFiles && ym.monthFiles[month];
  if (!monthFile) { state.loadedMonths.add(key); cb(); return; }
  // monthFiles are relative to the year manifest's own dir (data/{tracker}/).
  const file = 'data/' + tracker + '/' + monthFile;
  injectScript(file, () => { state.loadedMonths.add(key); cb(); });
}

function loadDayFile(file, cb) {
  // `file` may be "../data-20260528.js" (from a tracker month manifest); resolve
  // relative to the per-tracker manifest's own dir.
  let resolved = file;
  if (file.startsWith('../')) {
    resolved = 'data/' + file.slice(3);  // -> data/data-YYYYMMDD.js
  }
  if (state.loadedFiles.has(resolved)) { cb(); return; }
  injectScript(resolved, () => { state.loadedFiles.add(resolved); cb(); });
}

function injectScript(src, cb) {
  const s = document.createElement('script');
  s.src = src;
  s.onload = cb;
  s.onerror = () => { console.warn('Failed to load:', src); cb(); };
  document.head.appendChild(s);
}

// ── Helpers ───────────────────────────────────────────
function getYearManifest(year, tk = state.currentTracker) {
  const byTracker = (window.TRACKER_YEAR || {})[tk];
  if (byTracker && byTracker[year]) return byTracker[year];
  // Legacy single-tracker structure: TRACKER_YEAR[year]
  return (window.TRACKER_YEAR || {})[year] || null;
}
function manifestDatesForMonth(month, tk = state.currentTracker) {
  const byTracker = (window.TRACKER_MONTH || {})[tk];
  const mm = (byTracker && byTracker[month]) || (window.TRACKER_MONTH || {})[month];
  return mm ? (mm.dates || []) : [];
}
function getDatesForMonth(month) {
  if (state.searchQuery && state.search) {
    // Search mode: keep only matched dates, override counts with match counts.
    const counts = state.search.countByDate;
    return manifestDatesForMonth(month)
      .filter(d => counts[d.date] > 0)
      .map(d => ({ date: d.date, file: d.file, count: counts[d.date] }));
  }
  return manifestDatesForMonth(month);
}
function setActivePill(containerSel, btnSel) {
  const container = document.querySelector(containerSel);
  if (!container) return;
  container.querySelectorAll('.pill').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
  const btn = container.querySelector(btnSel);
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }
  if (containerSel === '#tracker-pills') { syncSrcBtn(); syncTabs(); }   // 依來源瀏覽 button follows the current tracker; tabs follow the view
}
function showMsg(msg) {
  const el = document.getElementById('loading-msg');
  el.style.display = 'block';
  el.textContent = msg;
  document.getElementById('no-data').classList.add('hidden');
  Array.from(document.getElementById('main-content').children).forEach(c => {
    if (c.id !== 'loading-msg' && c.id !== 'no-data' && c.id !== 'search-row') c.remove();
  });
}
function linkifyCVE(html) {
  return html.replace(/CVE-(\d{4})-(\d{4,})/g, (m) =>
    '<a class="cve-link" href="https://www.cve.org/CVERecord?id=' + m +
    '" target="_blank" rel="noopener">' + m + '</a>'
  );
}
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
// Only http(s) may become a real href. Anything else (javascript:, data:)
// collapses to '#', so a hostile source URL that slipped past the pipeline
// filters still cannot execute on click. Defence in depth.
function safeHref(u) {
  return /^https?:\/\//i.test(String(u || '')) ? u : '#';
}
function toggleTheme() {
  if (document.documentElement.dataset.palette) return;   // a palette overrides the light/dark theme
  const isDark = document.documentElement.dataset.theme !== 'light';
  document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
  // Toggle SVG icons (light ↔ dark)
  const lightIcon = document.getElementById('theme-icon-light');
  const darkIcon = document.getElementById('theme-icon-dark');
  if (lightIcon && darkIcon) {
    lightIcon.style.display = isDark ? 'none' : 'inline-block';
    darkIcon.style.display = isDark ? 'inline-block' : 'none';
  }
  try { prefSet('tracker_theme', isDark ? 'light' : 'dark'); } catch (e) {}
}

function toggleSkin() {
  const isMd3 = document.documentElement.dataset.skin !== 'classic';
  document.documentElement.dataset.skin = isMd3 ? 'classic' : 'md3';
  try { prefSet('tracker_skin', isMd3 ? 'classic' : 'md3'); } catch (e) {}
  syncHash();   // skin is part of the shareable view
}

// ── Deep-linking (URL hash ⇄ view state) ──────────────
// The hash mirrors the current view so a link restores it: tracker / year /
// month (or * for full-year) / date / category filter / search query / skin.
// Writes go through history.replaceState (no history spam, no hashchange), so
// they never trigger the restore path below. `restoring` suppresses writes
// while a restore drills through the async select* chain; `pendingRestore`
// carries the month/date targets that the year/month load callbacks consume.
var restoring = false;
var pendingRestore = null;
var suppressHashChange = false;

function syncHash() {
  if (restoring) return;
  const skinOf = () => document.documentElement.dataset.skin;
  if (state.wsActive) {   // news workspace: ws=1, range (30d omitted), filters, search, article
    const wp = ['ws=1'];
    if (ws.range !== '30d') wp.push('r=' + ws.range);
    if (ws.src) wp.push('src=' + encodeURIComponent(ws.src));
    if (ws.ty) wp.push('ty=' + encodeURIComponent(ws.ty));
    if (ws.w) wp.push('w=' + encodeURIComponent(ws.w));
    if (ws.pl) wp.push('pl=' + encodeURIComponent(ws.pl));
    if (state.searchQuery) wp.push('q=' + encodeURIComponent(state.searchQuery));
    if (skinOf()) wp.push('s=' + skinOf());
    if (palettePref) wp.push('pal=' + palettePref);
    wp.push('p=' + encodeURIComponent(viewPrefs.preset));
    if (overlayArticleId !== null) wp.push('a=' + encodeURIComponent(overlayArticleId));
    const wh = '#' + wp.join('&');
    if (wh !== location.hash) {
      try { history.replaceState(null, '', wh); }
      catch (e) { suppressHashChange = true; location.hash = wh; }
    }
    return;
  }
  if (state.hubActive) {   // 我的關注 hub: hub=1, presentation, window
    const hp = ['hub=1', 'hv=' + hubPrefs.hv, 'hw=' + hubPrefs.hw];
    if (skinOf()) hp.push('s=' + skinOf());
    if (palettePref) hp.push('pal=' + palettePref);
    hp.push('p=' + encodeURIComponent(viewPrefs.preset));
    if (overlayArticleId !== null) hp.push('a=' + encodeURIComponent(overlayArticleId));
    const hh = '#' + hp.join('&');
    if (hh !== location.hash) {
      try { history.replaceState(null, '', hh); }
      catch (e) { suppressHashChange = true; location.hash = hh; }
    }
    return;
  }
  if (state.libActive) {   // CRA library mode has its own compact hash
    const lp = ['lib=1'];
    if (state.libCluster) lp.push('c=' + encodeURIComponent(state.libCluster));
    if (state.libGroup !== 'cluster') lp.push('g=' + state.libGroup);
    if (skinOf()) lp.push('s=' + skinOf());
    if (palettePref) lp.push('pal=' + palettePref);
    lp.push('p=' + encodeURIComponent(viewPrefs.preset));
    if (overlayArticleId !== null) lp.push('a=' + encodeURIComponent(overlayArticleId));
    const lh = '#' + lp.join('&');
    if (lh !== location.hash) {
      try { history.replaceState(null, '', lh); }
      catch (e) { suppressHashChange = true; location.hash = lh; }
    }
    return;
  }
  const p = [];
  if (state.currentTracker) p.push('t=' + state.currentTracker);
  if (state.currentYear) p.push('y=' + state.currentYear);
  if (state.currentMode === 'full-year') p.push('m=*');
  else if (state.currentMonth) p.push('m=' + state.currentMonth);
  if (state.currentDate) p.push('d=' + state.currentDate);
  if (state.filterCats.size) p.push('c=' + [...state.filterCats].map(encodeURIComponent).join(','));
  if (state.searchQuery) p.push('q=' + encodeURIComponent(state.searchQuery));
  const skin = document.documentElement.dataset.skin;
  if (skin) p.push('s=' + skin);
  if (palettePref) p.push('pal=' + palettePref);
  p.push('p=' + encodeURIComponent(viewPrefs.preset));
  if (overlayArticleId !== null) p.push('a=' + encodeURIComponent(overlayArticleId));
  const hash = '#' + p.join('&');
  if (hash === location.hash) return;
  try { history.replaceState(null, '', hash); }
  catch (e) { suppressHashChange = true; location.hash = hash; }
}

function parseHash() {
  const h = (location.hash || '').replace(/^#/, '');
  if (!h) return null;
  const o = {};
  h.split('&').forEach(kv => {
    const i = kv.indexOf('=');
    if (i < 0) return;
    o[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  return o;
}

// Article permalink (`a=`): id waiting to be opened, and the opener (no-op unless an id is pending).
var pendingOpenId = null;
function openPendingArticle() {
  if (pendingOpenId === null) return;
  const sid = pendingOpenId;
  const days = window.TRACKER_DAYS || {};
  let list = TrackerStore.collect(days, { dates: Object.keys(days) });
  if (state.currentTracker && !state.libActive && !state.hubActive) {
    list = list.filter(x => itemBelongsToTracker(x, state.currentTracker));
  }
  const art = list.find(x => x && (x._key === sid || String(x.id) === sid));
  if (!art) return;
  pendingOpenId = null;
  openOverlay(art, null);
}

// Restore the view named by the hash. Returns true if it handled the load.
function applyHashRestore() {
  const h = parseHash();
  pendingOpenId = (h && h.a) ? h.a : null;   // article permalink: opened once the view has rendered
  // View preset from the hash wins over localStorage; it is applied without
  // being persisted (the hash is a link, not a user choice).
  const presetChanged = !!(h && h.p && isPreset(h.p)) && applyHashPreset(h.p);
  // Palette from the hash wins over localStorage; applied without being persisted.
  if (h && parsePalette(h.pal) && h.pal !== palettePref) applyPalette(h.pal);
  if (h && h.ws) {           // news workspace deep-link (the filters come from the hash; not persisted)
    if (h.s === 'md3' || h.s === 'classic') document.documentElement.dataset.skin = h.s;
    selectWorkspace({ range: h.r, src: h.src, ty: h.ty, w: h.w, pl: h.pl, q: h.q });
    openPendingArticle();
    return true;
  }
  if (h && h.lib) {          // CRA library deep-link
    if (h.s === 'md3' || h.s === 'classic') document.documentElement.dataset.skin = h.s;
    state.libCluster = h.c || null;
    if (h.g === 'cluster' || h.g === 'date' || h.g === 'source') state.libGroup = h.g;
    selectLibrary();
    openPendingArticle();
    return true;
  }
  if (h && h.hub) {            // 我的關注 deep-link (hv / hw override the stored choice, not persisted)
    if (h.s === 'md3' || h.s === 'classic') document.documentElement.dataset.skin = h.s;
    if (h.hv === 'sections' || h.hv === 'tiles') hubPrefs = { ...hubPrefs, hv: h.hv };
    if (HUB_WINDOWS.includes(+h.hw)) hubPrefs = { ...hubPrefs, hw: +h.hw };
    selectHub();
    openPendingArticle();
    return true;
  }
  if (!h || !h.t) {
    // preset-only hash change on an already-rendered view: re-render in place
    if (presetChanged && state.currentTracker && !restoring) renderArticles();
    return false;
  }
  const all = getTrackers();
  if (!all || !all[h.t]) return false;
  if (h.s === 'md3' || h.s === 'classic') document.documentElement.dataset.skin = h.s;
  restoring = true;
  selectTracker(h.t);          // restoring=true makes it skip its default year auto-select
  // category filter
  if (h.c) {
    state.filterCats = new Set();
    h.c.split(',').filter(Boolean).forEach(c => state.filterCats.add(c));
    refreshCatPills();
  } else if (h.p) {
    // `p=` without `c=` (e.g. the console preview link): show the preset with its default filters.
    applyPresetFilters();
  }
  // search query takes its own (search-aware) path
  if (h.q) {
    state.searchQuery = h.q;
    const sb = document.getElementById('search-box'); if (sb) sb.value = h.q;
    const sc = document.getElementById('search-clear'); if (sc) sc.style.display = 'inline';
    restoring = false; pendingRestore = null;
    runSearch();
    return true;
  }
  const years = all[h.t].years || [];
  const year = (h.y && years.includes(h.y)) ? h.y : years[0];
  if (!year) { restoring = false; return true; }
  pendingRestore = { month: h.m === '*' ? null : h.m, date: h.d, fullYear: h.m === '*' };
  selectYear(year);            // async chain consumes pendingRestore for month/date
  return true;
}

// ── Events ────────────────────────────────────────────
window.addEventListener('hashchange', () => {
  if (suppressHashChange) { suppressHashChange = false; return; }
  if (!restoring) applyHashRestore();
});
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeOverlay();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!document.getElementById('overlay').classList.contains('hidden')) closeOverlay();
  else if (state.wsActive && ws.panelOpen) { wsToggleTimePanel(false); const c = document.getElementById('ws-time-chip'); if (c) c.focus(); }
  else if (document.getElementById('sidebar').classList.contains('nav-open')) closeNav(true);
});

// Floating nav drawer: hamburger toggles it, scrim (compact) click closes it.
(function wireDrawer() {
  const btn = document.getElementById('drawer-toggle');
  const scrim = document.getElementById('sidebar-scrim');
  if (btn) btn.addEventListener('click', toggleNav);
  if (scrim) scrim.addEventListener('click', () => closeNav(true));
})();

// Search box: debounced live search + Enter + Esc/clear.
(function wireSearch() {
  const box = document.getElementById('search-box');
  if (!box) return;
  let timer;
  box.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(runSearch, 300); });
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(timer); runSearch(); }
    else if (e.key === 'Escape') { box.value = ''; clearSearch(); box.blur(); }
  });
  document.getElementById('search-clear').addEventListener('click', () => {
    box.value = ''; clearSearch(); box.focus();
  });
  document.querySelectorAll('#search-scope .scope-pill').forEach(btn => {
    btn.addEventListener('click', () => toggleScope(btn.dataset.scope, btn));
  });
})();

document.addEventListener('DOMContentLoaded', init);
</script>
