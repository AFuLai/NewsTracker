// ── Site-wide search ──────────────────────────────────
// Matches across title/summary/tags in BOTH languages so a query works
// regardless of the display language. Space-separated terms are ANDed.
function searchHaystack(a) {
  // Search only what is DISPLAYED in the current language — artTitle/artSummary/
  // artTags return the en fields in EN mode, the zh fields in 中文 mode (with
  // fallback). So a 中文 search never matches a hidden English title, and vice-versa.
  const sc = state.searchScope;
  const parts = [];
  if (sc.title) parts.push(artTitle(a));
  if (sc.body)  parts.push(artSummary(a));
  if (sc.tags)  parts.push(artTags(a).join(' '));
  return parts.join(' ').toLowerCase();
}
// Match one term against the haystack on a WORD boundary (alphanumeric edges),
// so a short acronym like "CRA" matches "EU CRA"/"(CRA)" but NOT a fragment
// inside a word like "crash". CJK has no a-z0-9 neighbours, so CJK terms still
// match as substrings (e.g. 資安 inside 網路資安). Boundary chars are [a-z0-9];
// the haystack is already lower-cased.
function termMatches(hay, term) {
  const esc = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(?:^|[^a-z0-9])' + esc + '(?:[^a-z0-9]|$)');
  return re.test(hay);
}
function matchesQuery(a, q) {
  if (!q) return true;
  const hay = searchHaystack(a);
  return q.toLowerCase().split(/\s+/).filter(Boolean)
          .every(term => termMatches(hay, term));
}

// Toggle a search-scope field (標題/內文/標籤). Keeps at least one active.
function toggleScope(name, btn) {
  const sc = state.searchScope;
  const activeCount = Object.values(sc).filter(Boolean).length;
  if (sc[name] && activeCount === 1) return;   // never leave all scopes off
  sc[name] = !sc[name];
  btn.classList.toggle('active', sc[name]);
  btn.setAttribute('aria-pressed', sc[name] ? 'true' : 'false');
  if (state.searchQuery && state.search) refreshSearchView();
  else if (state.wsActive && state.searchQuery) renderWorkspace();
}

// Promise wrappers around the cb-style loaders so we can await the full set.
function pLoadYear(y)  { return new Promise(r => loadYearManifest(y, r)); }
function pLoadMonth(m) { return new Promise(r => loadMonthManifest(m, r)); }
function pLoadDay(f)   { return new Promise(r => loadDayFile(f, r)); }

// Load every year/month manifest + every day file for the current tracker, so
// search can see the whole site. Cached via the loaded* sets → instant after 1st.
async function ensureAllLoaded() {
  const mf = currentManifest();
  if (!mf) return;
  for (const y of (mf.years || [])) {
    await pLoadYear(y);
    const ym = getYearManifest(y);
    for (const m of ((ym && ym.months) || [])) await pLoadMonth(m);
  }
  const files = new Set();
  for (const y of (mf.years || [])) {
    const ym = getYearManifest(y);
    for (const m of ((ym && ym.months) || []))
      for (const d of manifestDatesForMonth(m)) files.add(d.file);
  }
  await Promise.all([...files].map(f => pLoadDay(f)));
}

/* TRACKER-STORE:BEGIN */
// Pure data layer over the TRACKER_DAYS shape ({ 'YYYY-MM-DD': [article, ...] }). No DOM, no
// storage, no globals: anything it needs (e.g. a type function) is passed in as an argument.
const TrackerStore = (() => {
  const CVE_RE = /CVE-\d{4}-\d{4,}/ig;
  function keyOf(a, date) {
    return (a.id !== undefined && a.id !== null) ? String(a.id) : date + '|' + a.title;
  }
  function newestDate(daysMap) {
    let newest = '';
    for (const d in (daysMap || {})) if (d > newest && Array.isArray(daysMap[d]) && daysMap[d].length) newest = d;
    return newest;
  }
  // 'YYYY-MM-DD' + n days -> 'YYYY-MM-DD' (UTC arithmetic, no clock, no timezone).
  function shiftDate(iso, n) {
    const t = Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) + n * 86400000;
    return new Date(t).toISOString().slice(0, 10);
  }
  function collect(daysMap, opts) {
    const data = daysMap || {};
    const o = opts || {};
    const dates = Array.isArray(o.dates)
      ? o.dates
      : Object.keys(data).filter(d => d >= o.fromDate && d <= o.toDate).sort();
    const seen = new Set();
    const out = [];
    for (const date of dates) {
      const day = data[date];
      if (!Array.isArray(day)) continue;
      for (const a of day) {
        if (!a) continue;
        const key = keyOf(a, date);
        if (seen.has(key)) continue;
        seen.add(key);
        out.push({ ...a, _date: date, _key: key });
      }
    }
    return out;
  }
  function sortNewest(list) {
    return list.slice().sort((x, y) => (y._date < x._date ? -1 : y._date > x._date ? 1 : 0) ||
      (String(y.id) < String(x.id) ? -1 : String(y.id) > String(x.id) ? 1 : 0));
  }
  function extractCves(a) {
    const out = [];
    const seen = new Set();
    if (!a) return out;
    const parts = [a.title, a.title_en, a.summary, a.summary_en];
    if (Array.isArray(a.tags)) parts.push(...a.tags);
    for (const part of parts) {
      if (part === undefined || part === null) continue;
      for (const m of String(part).match(CVE_RE) || []) {
        const id = m.toUpperCase();
        if (!seen.has(id)) { seen.add(id); out.push(id); }
      }
    }
    return out;
  }
  function getReaderContext(id, list, opts) {
    const o = opts || {};
    const items = list || [];
    const pool = Array.isArray(o.pool) ? o.pool : items;
    const typeOf = typeof o.typeOf === 'function' ? o.typeOf : null;
    const sid = String(id);
    const index = items.findIndex(x => x && (x._key === sid || String(x.id) === sid));
    if (index < 0) {
      return { article: null, index: -1, total: items.length, prevArticle: null, nextArticle: null,
               nextInType: null, sameCveArticles: [] };
    }
    const article = items[index];
    let nextInType = null;
    if (typeOf) {
      const t = typeOf(article);
      for (let i = index + 1; i < items.length; i++) {
        if (items[i] && typeOf(items[i]) === t) { nextInType = items[i]; break; }
      }
    }
    const mine = extractCves(article);
    const same = [];
    if (mine.length) {
      const aKey = article._key !== undefined ? article._key : keyOf(article, article._date);
      const seen = new Set([aKey]);
      for (const x of pool) {
        if (!x) continue;
        const k = x._key !== undefined ? x._key : keyOf(x, x._date);
        if (seen.has(k)) continue;
        seen.add(k);
        if (extractCves(x).some(c => mine.includes(c))) same.push(x);
      }
      same.sort((x, y) => (x._date < y._date ? -1 : x._date > y._date ? 1 : 0));
    }
    return { article, index, total: items.length,
             prevArticle: index > 0 ? items[index - 1] : null,
             nextArticle: index < items.length - 1 ? items[index + 1] : null,
             nextInType, sameCveArticles: same };
  }
  // Time-range key -> {from, to} (both 'YYYY-MM-DD', inclusive). Keys: 'today', '7d' / '30d' / '90d',
  // 'year' (newest's year so far), 'all', 'y<YYYY>', 'd<YYYY-MM-DD>', 'c<from>_<to>' (swapped if
  // reversed); anything else behaves as '30d'. `newest` is the newest date present; a malformed one
  // falls back to 1970-01-01 so the arithmetic never throws. Pure: no clock.
  function rangeOf(key, newest) {
    const nw = /^\d{4}-\d{2}-\d{2}$/.test(String(newest)) ? String(newest) : '1970-01-01';
    const k = (key === undefined || key === null) ? '' : String(key);
    let m;
    if (k === 'today') return { from: nw, to: nw };

    const st = (hubPlat.size || !mb) ? hubStats(items, today) : mb;
    const hl = hubHitList(st.hits);
    const on = hubPick === ty.id;
    if (on) picked = { ty: ty, items: items };
    const tile = whBtn('wh-tile' + (hl.length ? ' hot' : ''), undefined, on, () => {
      hubPick = (hubPick === ty.id) ? null : ty.id;
      renderWatchHub(() => [...document.querySelectorAll('.wh-tile')].find(x => x.dataset.sec === ty.id));
    });
    tile.dataset.sec = ty.id;
    const tp = whEl('span', 'wh-tile-top');
    tp.appendChild(whEl('span', 'wh-tile-name', hubTypeName(ty)));

    const sp = whEl('span', 'wh-spark');

    const mx = Math.max.apply(null, st.series14.concat([1]));
    st.series14.forEach((v, i) => {
      const bar = whEl('span', 'wh-bar' + (i >= st.series14.length - 3 ? ' hot' : ''));
      bar.style.height = Math.max(2, Math.round(34 * v / mx)) + 'px';
      sp.appendChild(bar);
    });

    tile.appendChild(tw);

  });
  if (!grid.children.length) {

  }
  dash.appendChild(grid);
  const dr = whEl('div', 'wh-drill');
  if (picked) {
    const dh = whEl('div', 'wh-drill-head');
    dh.appendChild(whEl('span', 'k', t('hubDrill')));
    dh.appendChild(whEl('h3', '', hubTypeName(picked.ty)));
    dh.appendChild(whEl('span', 'n', t('hubCount')(picked.items.length)));
    dr.appendChild(dh);
    const rl = whEl('div', 'river-list');
    const shown = picked.items.slice(0, 30);
    shown.forEach(a => rl.appendChild(buildRiverRow(a)));
    dr.appendChild(rl);
    if (picked.items.length > shown.length) dr.appendChild(hubShownNote(shown.length));

    dr.appendChild(whEl('div', 'wh-note', t('hubPick')));

}
// Rebuilds the whole view from window.TRACKER_DAYS (cheap; the day files are already loaded).
// `focusFn` returns the control to re-focus after the rebuild.
function renderWatchHub(focusFn) {
  if (!state.hubActive) return;
  const main = document.getElementById('main-content');
  const keepTop = main.scrollTop;
  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('no-data').classList.add('hidden');
  Array.from(main.children).forEach(c => {
    if (c.id !== 'loading-msg' && c.id !== 'no-data' && c.id !== 'search-row') c.remove();
  });
  const root = whEl('div', 'wh');
  root.appendChild(hubHeaderEl());
  if (!hubReady) {
    const ld = whEl('div', 'wh-note wh-loading', t('hubLoading')(hubPrefs.hw));
    ld.setAttribute('role', 'status');
    root.appendChild(ld);
    main.appendChild(root);
    syncHash();
    return;
  }
  const col = hubCollect(hubPrefs.hw);
  if (state.searchQuery) {   // search replaces the sections / tiles until it is cleared
    const hits = hubSearch(col.list, state.searchQuery);
    root.appendChild(whEl('div', 'wh-sub', t('hubSearchCount')(hits.length)));
    if (hits.length) {
      const rl = whEl('div', 'river-list');
      hits.forEach(a => rl.appendChild(buildRiverRow(a)));
      root.appendChild(rl);
    } else {
      root.appendChild(whEl('div', 'wh-note', t('noResults')(state.searchQuery)));
    }
    main.appendChild(root);
    document.getElementById('article-count').textContent = hits.length;
    syncHash();
    main.scrollTop = keepTop;
    if (typeof focusFn === 'function') { const el = focusFn(); if (el) el.focus(); }
    return;
  }
  const model = buildHubModel(hubPrefs.hw, watchPrefs);
  root.appendChild(hubBriefEl(hubBrief(col.list, col.today)));
  const vis = hubPlat.size ? col.list.filter(a => articleTags(a).some(g => hubPlat.has(g))) : col.list;
  if (hubPrefs.hv === 'tiles') {
    root.appendChild(hubTilesEl(vis, model, col.today, col.list));
  } else {
    if (model.platforms.length || hubPlat.size) root.appendChild(hubPlatEl(model));
    root.appendChild(hubSectionsEl(vis, model));
  }
  main.appendChild(root);
  document.getElementById('article-count').textContent = vis.length;
  syncHash();
  main.scrollTop = keepTop;
  if (typeof focusFn === 'function') { const el = focusFn(); if (el) el.focus(); }
  if (hubSeenDue) hubFlushSeen();
}

// Recompute which dates (and how many articles) match the query, honouring the
// current tracker + category filter. This is what the date menu is rebuilt from.
function buildSearchIndex() {
  const q = state.searchQuery.toLowerCase();
  const counts = {}; const years = new Set();
  const days = window.TRACKER_DAYS || {};
  for (const date in days) {
    let n = 0;
    for (const a of days[date]) {
      if (!itemBelongsToTracker(a, state.currentTracker)) continue;
      if (state.filterCats.size &&
          !state.filterCats.has(effectiveCat(a, state.currentTracker))) continue;
      if (matchesQuery(a, q)) n++;
    }
    if (n > 0) { counts[date] = n; years.add(date.slice(0, 4)); }
  }
  state.search = { countByDate: counts, years: [...years].sort().reverse() };
}

function searchDatesInYear(year) {
  return Object.keys(state.search.countByDate)
    .filter(d => d.slice(0, 4) === year).sort().reverse();
}

async function runSearch() {
  const box = document.getElementById('search-box');
  const q = (box.value || '').trim();
  document.getElementById('search-clear').style.display = q ? 'inline' : 'none';
  if (!q) { clearSearch(); return; }
  state.searchQuery = q;
  if (state.hubActive) { renderWatchHub(); return; }   // hub: search the loaded window of all trackers
  if (state.wsActive) { renderWorkspace(); return; }   // workspace: filter the current range
  showMsg(t('searching'));
  await ensureAllLoaded();
  if (state.searchQuery !== q) return;   // superseded by a newer keystroke
  buildSearchIndex();
  const years = state.search.years;
  buildYearPills(years);
  if (!years.length) {
    document.getElementById('month-grid').innerHTML = '';
    hideDateList();
    state.currentYear = null;
    renderArticles([]);
    return;
  }
  selectYear(years[0]);   // search-aware: month grid + this year's matches
}

function clearSearch() {
  if (!state.searchQuery && !state.search) {  // already idle: just restore box
    document.getElementById('search-clear').style.display = 'none';
  }
  state.searchQuery = '';
  state.search = null;
  const box = document.getElementById('search-box');
  if (box) box.value = '';
  document.getElementById('search-clear').style.display = 'none';
  if (state.hubActive) { renderWatchHub(); return; }
  if (state.wsActive) { renderWorkspace(); return; }
  const mf = currentManifest();
  if (!mf) return;
  buildYearPills(mf.years || []);
  if (mf.years && mf.years[0]) selectYear(mf.years[0]);
}

// Cat-filter changed while searching → recompute matches + refresh the menu.
function refreshSearchView() {
  buildSearchIndex();
  const years = state.search.years;
  buildYearPills(years);
  if (!years.length) {
    document.getElementById('month-grid').innerHTML = '';
    hideDateList(); renderArticles([]); return;
  }
  selectYear(years.includes(state.currentYear) ? state.currentYear : years[0]);
}

// ── Multi-tracker helpers ─────────────────────────────
function getTrackers() {
  if (typeof TRACKER_MANIFESTS !== 'undefined') return TRACKER_MANIFESTS;
  // Back-compat: synthesize a single tracker from legacy TRACKER_MANIFEST.
  if (typeof TRACKER_MANIFEST !== 'undefined') {
    return { security: TRACKER_MANIFEST };
  }
  return null;
}
function currentManifest() {
  const all = getTrackers();
  return all ? all[state.currentTracker] : null;
}
function itemBelongsToTracker(item, tracker) {
  if (item.trackers && Array.isArray(item.trackers) && item.trackers.length) {
    return item.trackers.includes(tracker);
  }
  // Legacy items without trackers field are implicitly "security".
  return tracker === 'security';
}

// Cross-belonging articles keep their *home* tracker's category (a single
// `category` field). When viewed under a different tracker that category is
// not one of that tracker's pills, so it would only ever surface under 全部.
// CAT_MAP remaps a foreign category onto the nearest local subcategory so the
// item is findable (and colour-coded) under a real pill of the viewing tracker.
const CAT_MAP = {
  security: {
    // os platforms keep their own category here: they surface in the second
    // pill row (SECONDARY_PILLS.security) instead of folding into 漏洞與威脅情報
    '重點關注':'前瞻技術',
    // eu_cra → security
    '法令更新':'法規與標準', '調和標準':'法規與標準', '合規指引':'法規與標準',
    '亞太對應':'法規與標準', '開源影響':'供應鏈與開源安全',
    '產業動態':'重大事件', '研討活動':'前瞻技術',
  },
  eu_cra: {
    // security → eu_cra
    '法規與標準':'法令更新', '供應鏈與開源安全':'開源影響', '漏洞與威脅情報':'合規指引',
    '前瞻技術':'產業動態', '重大事件':'產業動態',
    // os → eu_cra
    'Linux':'開源影響', 'Windows':'產業動態', 'Apple':'產業動態',
    'Android':'產業動態', '重點關注':'產業動態',
  },
  os: {
    // no platform signal from a foreign article → cross-platform watchlist
    // 漏洞與威脅情報 keeps its own category here (second pill row, SECONDARY_PILLS.os)
    '法規與標準':'重點關注', '供應鏈與開源安全':'重點關注',
    '前瞻技術':'重點關注', '重大事件':'重點關注',
    '法令更新':'重點關注', '調和標準':'重點關注', '合規指引':'重點關注',
    '開源影響':'重點關注', '產業動態':'重點關注', '亞太對應':'重點關注', '研討活動':'重點關注',
  },
};

// Second pill row per tracker: categories that are not in the tracker's manifest
// `categories` (first row) but are kept as their own category via CAT_MAP above.
// They share state.filterCats with the first row (OR semantics). eu_cra has none.
const SECONDARY_PILLS = {
  security: { label: '平台', cats: ['Linux','Windows','Apple','Android'] },
  os: { label: '類型', cats: ['漏洞與威脅情報'] },
};

// The category an article should display/filter under for the given tracker.
function effectiveCat(a, tracker) {
  const cat = a.category;
  const mf = (getTrackers() || {})[tracker];
  const own = (mf && mf.categories) || [];
  if (own.includes(cat)) return cat;      // native category → unchanged
  const m = CAT_MAP[tracker];
  return (m && m[cat]) || cat;            // remap foreign; else leave as-is
}

// ── Sidebar toggle ────────────────────────────────────
// ── Floating navigation drawer (all widths) ───────────────────────────
// The sidebar floats over the content and collapses off-canvas, leaving the

// ── Boot ─────────────────────────────────────────────
function init() {
  // Load persisted preferences (lang, theme, skin)
  try {
    const saved_lang = prefGet('tracker_lang');
    if (saved_lang === 'en' || saved_lang === 'zh') state.lang = saved_lang;
  } catch (e) {}
  try {
    const saved_theme = prefGet('tracker_theme');
    if (saved_theme === 'light' || saved_theme === 'dark') {
      document.documentElement.dataset.theme = saved_theme;
    } else if (matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.dataset.theme = 'dark';
    } else {
      document.documentElement.dataset.theme = 'light';
    }
    // Initialize theme icon display (dark mode → show dark icon)
    const isDark = document.documentElement.dataset.theme === 'dark';
    const lightIcon = document.getElementById('theme-icon-light');
    const darkIcon = document.getElementById('theme-icon-dark');
    if (lightIcon && darkIcon) {
      lightIcon.style.display = isDark ? 'none' : 'inline-block';
      darkIcon.style.display = isDark ? 'inline-block' : 'none';
    }
  } catch (e) {}
  try {
    // One theme system: the page always runs md3; the stored tracker_skin is no longer applied.
    // (A hash s=classic is still honoured for that page view in applyHashRestore.)
    document.documentElement.dataset.skin = 'md3';
  } catch (e) {}
  // Floating nav: default open on desktop, collapsed on compact; persisted.
  // Set the class directly (no openNav — avoid stealing focus on boot).
  try {
    const navPref = prefGet('tracker_nav');
    const startOpen = navPref !== 'collapsed' && !isCompact();
    const sb = document.getElementById('sidebar');
    const ham = document.getElementById('drawer-toggle');
    if (sb && startOpen) sb.classList.add('nav-open');
    if (ham) ham.setAttribute('aria-expanded', String(!!startOpen));
  } catch (e) {}
  const all = getTrackers();
  if (!all) {
    showMsg(t('noManifest'));
    return;
  }
  const names = Object.keys(all);
  if (!names.length) {
    showMsg(t('noTracker')); return;
  }
  buildTrackerPills(names);
  initWatch();  // localStorage tracker_watch → watchPrefs
  initView();   // localStorage tracker_view → viewPrefs; the hash (below) may override it
  initPalette();   // localStorage tracker_palette → data-palette; a hash pal= (below) may override it
  initHubPrefs();  // localStorage tracker_watch_hub → hubPrefs; a hash hv= / hw= (below) may override it
  if (!applyHashRestore()) selectWorkspace();   // deep-link wins; no / unknown hash → the news workspace (the home view; it was the 總覽 hub, which replaced the old default tracker wall)
  applyLang();   // sync all static labels + lang button to the active language
}

// ── Tracker selection ─────────────────────────────────
function selectTracker(name) {
  const all = getTrackers();
  if (!all || !all[name]) return;
  state.libActive = false;   // leaving the CRA library mode
  leaveWorkspace();          // leaving the news workspace (no-op otherwise)
  leaveHub();                // leaving the 我的關注 hub (restores the search row)
  if (document.documentElement.dataset.mode === 'lib') delete document.documentElement.dataset.mode;
  const _srow = document.getElementById('search-row'); if (_srow) _srow.style.display = '';
  state.currentTracker = name;
  state.currentYear = null;
  state.currentMonth = null;
  state.currentDate = null;
  state.currentMode = null;
  state.filterCats = new Set();
  state.searchQuery = '';        // a fresh tracker starts unsearched
  state.search = null;
  const _sb = document.getElementById('search-box'); if (_sb) _sb.value = '';
  const _sc = document.getElementById('search-clear'); if (_sc) _sc.style.display = 'none';
  setActivePill('#tracker-pills', '[data-tracker="' + name + '"]');
  const mf = all[name];
  document.getElementById('tracker-title').textContent = trackerTitle(name, mf);
  buildYearPills(mf.years || []);
  buildCatPills(mf.categories || []);
  // Preset default filters; skipped during a hash restore (a `c=` in the URL wins,
  // and a link without `c=` means "all").
  if (!restoring) applyPresetFilters();
  // During a hash restore, applyHashRestore drives year/month/date itself.
  if (!restoring && mf.years && mf.years[0]) selectYear(mf.years[0]);
}

function buildTrackerPills(names) {
  const el = document.getElementById('tracker-pills');
  el.innerHTML = '';
  el.setAttribute('role', 'tablist');
  // Two top-level tabs: 新聞 (the news workspace, home view; 依來源瀏覽 is now its source filter) and the
  // CRA reference library (a special mode, not a real tracker). The 總覽 hub and the per-tracker
  // archive views stay reachable by their old links (#hub=1, #t=...), not from the header.
  // The library data (data/cra_library.js) loads on first click.
  const tabs = [
    ['__ws', t('wsTab'), t('wsTab'), selectWorkspace],
    ['__cra', t('craTab'), 'CRA reference library', selectLibrary]
  ];
  tabs.forEach(([id, label, title, fn]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pill';
    b.dataset.tracker = id;
    b.setAttribute('role', 'tab');
    b.textContent = label;
    b.title = title;
    b.onclick = () => fn();
    el.appendChild(b);
  });
  syncTabs();
}
// Tabs show the current top-level view (aria-selected + .active).
function syncTabs() {
  const cur = { __ws: !!state.wsActive, __cra: !!state.libActive };
  document.querySelectorAll('#tracker-pills [role="tab"]').forEach(b => {
    const on = !!cur[b.dataset.tracker];
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.removeAttribute('aria-pressed');
  });
}
// The menu button shows the current tracker's name (and is active) while in a tracker view.
function syncSrcBtn() {
  const sb = document.getElementById('src-btn');
  if (!sb) return;
  const inTracker = !!(state.currentTracker && !state.hubActive && !state.libActive);
  sb.textContent = inTracker ? trackerLabel(state.currentTracker) + ' ▾' : t('srcMenu');
  sb.classList.toggle('active', inTracker);
  sb.setAttribute('aria-pressed', inTracker ? 'true' : 'false');
  document.querySelectorAll('#src-menu [data-src]').forEach(b => {
    if (inTracker && b.dataset.src === state.currentTracker) b.setAttribute('aria-current', 'true');
    else b.removeAttribute('aria-current');
  });
}
function openSrcMenu() {
  const sb = document.getElementById('src-btn'), menu = document.getElementById('src-menu');
  if (!sb || !menu) return;
  menu.hidden = false;
  const r = sb.getBoundingClientRect();
  menu.style.top = Math.round(r.bottom + 4) + 'px';
  menu.style.left = Math.max(8, Math.min(Math.round(r.left), window.innerWidth - menu.offsetWidth - 8)) + 'px';
  sb.setAttribute('aria-expanded', 'true');
  const first = menu.querySelector('button');
  if (first) first.focus();
}
function closeSrcMenu(refocus) {
  const sb = document.getElementById('src-btn'), menu = document.getElementById('src-menu');
  if (!menu || menu.hidden) return;
  menu.hidden = true;
  if (sb) { sb.setAttribute('aria-expanded', 'false'); if (refocus) sb.focus(); }
}
document.addEventListener('click', (e) => { if (!e.target.closest || !e.target.closest('#src-menu')) closeSrcMenu(); });
document.addEventListener('keydown', (e) => {
  const menu = document.getElementById('src-menu');
  if (!menu || menu.hidden) return;
  if (e.key === 'Escape') { e.stopPropagation(); closeSrcMenu(true); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const items = [...menu.querySelectorAll('button')];

  }
}, true);
window.addEventListener('resize', () => closeSrcMenu());

// ── News workspace (the home view) ────────────────────
// ONE workspace over every tracker: a time range (chip in the header + collapsible #ws-time-panel),
// a left rail of news types / watch rules / platforms with counts (#ws-rail), a source filter
// (#ws-src; replaces the old 依來源瀏覽 menu) and the search box. Entered by the 新聞 tab
// (selectWorkspace) and left through selectHub / selectLibrary / selectTracker (leaveWorkspace).
// INVARIANT: while the workspace is active state.currentTracker is null (as in the hub), so
// buildCard / watch badges show the raw category and tracker-less watch matches.
// Hash: #ws=1 [&r=<range key, 30d omitted>] [&src=] [&ty=] [&w=] [&pl=] [&q=] [&a=<article id>].
// Range keys are TrackerStore.rangeOf's: today 7d 30d 90d year all y<YYYY> d<date> c<from>_<to>.
const WS_QUICK = { today: 1, '7d': 7, '30d': 30, '90d': 90 };   // ranges served by ensureHubLoaded(N)
const WS_PICKS = [['today', 'wsToday'], ['7d', 'ws7d'], ['30d', 'ws30d'], ['90d', 'ws90d'], ['year', 'wsYear'], ['all', 'wsAll']];
const ws = {
  range: '30d',     // current range key
  prev: null,       // range to return to when the selected chart day is clicked again
  src: '', ty: '', w: '', pl: '',   // source tracker id / type id / watch rule id / platform ('' = no filter)
  seq: 0,           // bumps on every render and on leave, so a late load never draws over another view
  loads: new Map(), // range key -> { p: promise, done: bool }
  allMonths: null,  // promise: every month manifest loaded (for the year archive day counts)
  panelOpen: false, railCollapsed: false, railInit: false,
  newest: '', focusKey: null
};
function wsIsDay(k) { return /^d\d{4}-\d{2}-\d{2}$/.test(String(k)); }
function wsNormRange(k) {
  k = String(k || '');
  return (/^(today|7d|30d|90d|year|all)$/.test(k) || /^y\d{4}$/.test(k) || wsIsDay(k) ||
          /^c\d{4}-\d{2}-\d{2}_\d{4}-\d{2}-\d{2}$/.test(k)) ? k : '30d';
}
function wsRangeLabel(key) {
  const k = wsNormRange(key);
  const pick = WS_PICKS.find(p => p[0] === k);
  if (pick) return t(pick[1]);
  if (k.charAt(0) === 'y') return t('wsYearName')(k.slice(1));
  if (wsIsDay(k)) return k.slice(1);
  const r = TrackerStore.rangeOf(k, '');
  return r.from + ' – ' + r.to;
}
function wsEl(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function wsTrackerNames() { return Object.keys(getTrackers() || {}).filter(k => k !== '__cra'); }

// ── loading ──
// Year manifests of every tracker; → { tks, monthsOf: {tracker: ['YYYY-MM', ...] sorted} }.
async function wsLoadManifests() {
  const all = getTrackers() || {};
  const tks = wsTrackerNames();
  const monthsOf = {};
  for (const tk of tks) {
    const ms = [];
    for (const y of (all[tk].years || [])) {
      await new Promise(r => loadYearManifest(y, r, tk));
      const ym = getYearManifest(y, tk);
      ((ym && ym.months) || []).forEach(m => ms.push(m));
    }
    monthsOf[tk] = ms.sort();
  }
  return { tks, monthsOf };
}
// Load the data a range needs. today / 7d / 30d / 90d: ensureHubLoaded(N). Any other range: the
// year + month manifests and the day files of every tracker whose dates fall in the range.
async function wsLoadRange(key) {
  if (WS_QUICK[key]) { await ensureHubLoaded(WS_QUICK[key]); return; }
  const { tks, monthsOf } = await wsLoadManifests();
  let newest = '';
  for (const tk of tks) {
    const ms = monthsOf[tk];
    if (!ms.length) continue;
    await new Promise(r => loadMonthManifest(ms[ms.length - 1], r, tk));
    for (const d of manifestDatesForMonth(ms[ms.length - 1], tk)) if (d.date > newest) newest = d.date;
  }
  if (!newest) return;
  const rg = TrackerStore.rangeOf(key, newest);
  const files = new Set();
  for (const tk of tks) {
    for (const m of monthsOf[tk]) {
      if (m < rg.from.slice(0, 7) || m > rg.to.slice(0, 7)) continue;
      await new Promise(r => loadMonthManifest(m, r, tk));
      for (const d of manifestDatesForMonth(m, tk)) if (d.date >= rg.from && d.date <= rg.to) files.add(d.file);
    }
  }
  await Promise.all([...files].map(f => new Promise(r => loadDayFile(f, r))));
}
function wsEnsure(key) {
  let e = ws.loads.get(key);
  if (e) return e.p;
  e = { done: false };
  e.p = Promise.resolve().then(() => wsLoadRange(key)).catch(() => {}).then(() => { e.done = true; });
  ws.loads.set(key, e);
  return e.p;
}
// Every month manifest (cheap) so the year archive can show day counts.
function wsLoadAllMonths() {
  if (!ws.allMonths) {
    ws.allMonths = (async () => {
      const { tks, monthsOf } = await wsLoadManifests();
      for (const tk of tks) for (const m of monthsOf[tk]) await new Promise(r => loadMonthManifest(m, r, tk));
    })().catch(() => {});
  }
  return ws.allMonths;
}
function wsYears() {
  const all = getTrackers() || {};
  const ys = new Set();
  wsTrackerNames().forEach(tk => (all[tk].years || []).forEach(y => ys.add(String(y))));
  return [...ys].sort().reverse();
}
// Distinct dates of a year known from the loaded month manifests of all trackers.
function wsYearDays(y) {
  const s = new Set();
  wsTrackerNames().forEach(tk => {
    const ym = getYearManifest(y, tk);
    ((ym && ym.months) || []).forEach(m => manifestDatesForMonth(m, tk).forEach(d => s.add(d.date)));
  });
  return s.size;
}

// ── filters ──
// range is applied by the caller; here: source + search (the base every count is taken over) ...
function wsBase(list) {
  const q = state.searchQuery;
  return list.filter(a => (!ws.src || itemBelongsToTracker(a, ws.src)) && (!q || matchesQuery(a, q)));
}
// ... and type / watch rule / platform on top.
function wsFacet(items) {
  return items.filter(a => (!ws.ty || hubTypeId(a) === ws.ty) &&
    (!ws.w || watchRuleIds(a, watchPrefs).includes(ws.w)) && (!ws.pl || a.category === ws.pl));
}
function wsActiveRules() {
  const on = Array.isArray(watchPrefs.on) ? watchPrefs.on : [];
  const ids = WATCH_RULES.filter(r => on.includes(r.id)).map(r => r.id);
  (Array.isArray(watchPrefs.kw) ? watchPrefs.kw : []).forEach(k => { if (typeof k === 'string' && k) ids.push('kw:' + k); });
  if (ws.w && !ids.includes(ws.w)) ids.push(ws.w);   // a linked rule stays visible (and pressed) even if switched off
  return ids;
}
function wsSet(patch, focusKey) {
  Object.assign(ws, patch);
  ws.focusKey = focusKey || null;
  renderWorkspace();
}
function wsToggle(field, val, focusKey) {
  wsSet({ [field]: ws[field] === val ? '' : val }, focusKey);
}
function wsSetRange(key, focusKey) { wsSet({ range: wsNormRange(key), prev: null }, focusKey); }
// Chart click: a day narrows the list to that day; the same day again returns to the previous range.
function wsPickDay(d) {
  if (ws.range === 'd' + d) wsSet({ range: ws.prev || '30d', prev: null }, 'd:' + d);
  else wsSet({ prev: wsIsDay(ws.range) ? ws.prev : ws.range, range: 'd' + d }, 'd:' + d);
}
function wsRefocus() {
  const key = ws.focusKey; ws.focusKey = null;
  if (!key) return;
  const el = [...document.querySelectorAll('[data-ws]')].find(x => x.dataset.ws === key && x.offsetParent !== null && !x.disabled);
  if (el) el.focus();
}

// ── time panel: quick picks, custom range, year archive, per-day chart ──
function wsBuildPanel(newest) {
  const panel = document.getElementById('ws-time-panel');
  if (!panel) return;
  const oldF = panel.querySelector('#ws-from'), oldT = panel.querySelector('#ws-to');
  const keepF = oldF && oldF.dataset.dirty ? oldF.value : null;
  const keepT = oldT && oldT.dataset.dirty ? oldT.value : null;
  panel.innerHTML = '';
  const row = (label) => {
    const r = wsEl('div', 'ws-tp-row');
    if (label) r.appendChild(wsEl('span', 'ws-tp-label', label));
    panel.appendChild(r);
    return r;
  };
  const btn = (text, pressed, key, fn) => {
    const b = wsEl('button', 'ws-tp-btn', text);
    b.type = 'button';
    b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    b.dataset.ws = key;
    b.onclick = fn;
    return b;
  };
  // quick picks
  const q = row(t('wsQuick'));
  WS_PICKS.forEach(([k, lk]) => q.appendChild(btn(t(lk), ws.range === k, 'r:' + k, () => wsSetRange(k, 'r:' + k))));
  // custom from / to
  const c = row(t('wsCustom'));
  const cur = ws.range === 'all' ? { from: '', to: '' } : TrackerStore.rangeOf(ws.range, newest);
  const mk = (id, label, val, keep) => {
    const lb = wsEl('label', 'ws-tp-label', label + ' ');
    const inp = wsEl('input');
    inp.type = 'date'; inp.id = id;
    inp.setAttribute('aria-label', label);
    inp.value = keep !== null ? keep : val;
    if (keep !== null) inp.dataset.dirty = '1';
    inp.addEventListener('input', () => { inp.dataset.dirty = '1'; });
    lb.appendChild(inp);
    c.appendChild(lb);
    return inp;
  };
  const fi = mk('ws-from', t('wsFrom'), cur.from, keepF);
  const ti = mk('ws-to', t('wsTo'), cur.to, keepT);
  const ap = btn(t('wsApply'), false, 'apply', () => {
    const iso = /^\d{4}-\d{2}-\d{2}$/;
    if (!iso.test(fi.value) || !iso.test(ti.value)) return;
    const a = fi.value <= ti.value ? fi.value : ti.value, b = fi.value <= ti.value ? ti.value : fi.value;
    wsSetRange('c' + a + '_' + b, 'apply');
  });
  ap.removeAttribute('aria-pressed');
  c.appendChild(ap);
  // year archive
  const ys = wsYears();
  if (ys.length) {
    const yr = row(t('wsArchive'));
    ys.forEach(y => {
      const n = wsYearDays(y);
      yr.appendChild(btn(t('wsYearName')(y) + ' · ' + t('wsDays')(n), ws.range === 'y' + y, 'y:' + y, () => wsSetRange('y' + y, 'y:' + y)));
    });
  }
  // per-day chart over the selected range (the last 90 days of it at most); while one day is selected
  // the chart keeps showing the range it was picked from, so the day can be un-picked
  const chartKey = (wsIsDay(ws.range) && ws.prev) ? ws.prev : ws.range;
  const cr = TrackerStore.rangeOf(chartKey, newest);
  const end = (newest && cr.to > newest) ? newest : cr.to;
  const start = cr.from > TrackerStore.shiftDate(end, -89) ? cr.from : TrackerStore.shiftDate(end, -89);
  row(t('wsChart'));
  if (!newest || start > end) return;
  const counts = TrackerStore.dateCounts(wsFacet(wsBase(
    TrackerStore.collect(window.TRACKER_DAYS || {}, { fromDate: start, toDate: end }))));
  let max = 1;
  Object.keys(counts).forEach(d => { if (counts[d] > max) max = counts[d]; });
  const chart = wsEl('div', 'ws-chart');
  chart.setAttribute('role', 'group');
  chart.setAttribute('aria-label', t('wsChart'));
  for (let d = start; d <= end; d = TrackerStore.shiftDate(d, 1)) {
    const n = counts[d] || 0;
    const sel = ws.range === 'd' + d;
    const b = wsEl('button', 'ws-bar');
    b.type = 'button';
    b.dataset.date = d;
    b.dataset.ws = 'd:' + d;
    b.setAttribute('aria-label', t('wsBar')(d, n));
    b.title = t('wsBar')(d, n);
    b.setAttribute('aria-pressed', sel ? 'true' : 'false');
    b.style.height = n ? Math.max(4, Math.round(n / max * 100)) + '%' : '2px';
    if (!n && !sel) b.disabled = true;
    b.onclick = () => wsPickDay(d);
    chart.appendChild(b);
  }
  panel.appendChild(chart);
  const ax = wsEl('div', 'ws-chart-axis');
  ax.appendChild(wsEl('span', '', start));
  ax.appendChild(wsEl('span', '', 'max ' + max));
  ax.appendChild(wsEl('span', '', end));
  panel.appendChild(ax);
}

// ── left rail: news types / watch rules / platforms, with counts over range + source + search ──
function wsBuildRail(base) {
  const body = document.getElementById('ws-rail-body'), strip = document.getElementById('ws-rail-strip');
  if (!body || !strip) return;
  body.innerHTML = ''; strip.innerHTML = '';
  const tc = {}, rc = {}, pc = {};
  base.forEach(a => {
    const ty = hubTypeId(a);
    tc[ty] = (tc[ty] || 0) + 1;
    watchRuleIds(a, watchPrefs).forEach(id => { rc[id] = (rc[id] || 0) + 1; });
    if (HUB_PLATFORMS.includes(a.category)) pc[a.category] = (pc[a.category] || 0) + 1;
  });
  const item = (name, n, pressed, key, tyId, fn) => {
    const b = wsEl('button', 'ws-item' + (tyId ? ' ws-ty-' + tyId : ''));
    b.type = 'button';
    b.dataset.ws = key;
    b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    if (tyId) b.appendChild(wsEl('span', 'ws-dot'));
    b.appendChild(wsEl('span', 'ws-name', name));
    b.appendChild(wsEl('span', 'ws-n', String(n)));
    b.onclick = fn;
    body.appendChild(b);
  };
  body.appendChild(wsEl('div', 'ws-sec-h', t('wsTypes')));
  item(t('all'), base.length, !ws.ty, 'ty:', 'all', () => wsSet({ ty: '' }, 'ty:'));
  NEWS_TYPES.forEach(ty => {
    const n = tc[ty.id] || 0, name = hubTypeName(ty);
    item(name, n, ws.ty === ty.id, 'ty:' + ty.id, ty.id, () => wsToggle('ty', ty.id, 'ty:' + ty.id));
    const chip = wsEl('button', 'ws-strip-chip ws-ty-' + ty.id);
    chip.type = 'button';
    chip.title = name;
    chip.setAttribute('aria-label', name + ' ' + n);
    chip.dataset.ws = 'ty:' + ty.id;
    chip.setAttribute('aria-pressed', ws.ty === ty.id ? 'true' : 'false');
    chip.onclick = () => wsToggle('ty', ty.id, 'ty:' + ty.id);
    strip.appendChild(chip);
  });
  const rules = wsActiveRules();
  if (rules.length) {
    body.appendChild(wsEl('div', 'ws-sec-h', t('wsWatch')));
    rules.forEach(id => item(hubRuleLabel(id), rc[id] || 0, ws.w === id, 'w:' + id, '', () => wsToggle('w', id, 'w:' + id)));
  }
  body.appendChild(wsEl('div', 'ws-sec-h', t('wsPlat')));
  HUB_PLATFORMS.forEach(p => item(p, pc[p] || 0, ws.pl === p, 'pl:' + p, '', () => wsToggle('pl', p, 'pl:' + p)));
}

// ── view ──
function wsDraw() {
  if (!state.wsActive) return;
  const main = document.getElementById('main-content');
  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('no-data').classList.add('hidden');
  Array.from(main.children).forEach(c => {
    if (c.id !== 'loading-msg' && c.id !== 'no-data' && c.id !== 'search-row') c.remove();
  });
  const days = window.TRACKER_DAYS || {};
  const newest = TrackerStore.newestDate(days);
  ws.newest = newest;
  const rg = TrackerStore.rangeOf(ws.range, newest);
  const base = wsBase(TrackerStore.collect(days, { fromDate: rg.from, toDate: rg.to }));
  const shown = TrackerStore.sortNewest(wsFacet(base));
  document.getElementById('article-count').textContent = shown.length;
  wsSyncChrome();
  wsBuildRail(base);
  wsBuildPanel(newest);
  syncHash();   // keep the URL in step with the current view
  if (pendingOpenId !== null) setTimeout(openPendingArticle, 0);   // `a=` permalink: open once this render has finished
  if (!shown.length) {
    const nd = document.getElementById('no-data');
    nd.classList.remove('hidden');
    nd.textContent = state.searchQuery ? L().ui.noResults(state.searchQuery) : t('noData');
    wsRefocus();
    return;
  }
  const frag = document.createDocumentFragment();
  const head = wsEl('h2', 'ws-head');
  head.appendChild(wsEl('span', '', wsRangeLabel(ws.range)));
  head.appendChild(wsEl('span', 'ws-sub', '· ' + t('tlCount')(shown.length)));
  frag.appendChild(head);
  const groups = new Map();
  shown.forEach(a => { if (!groups.has(a._date)) groups.set(a._date, []); groups.get(a._date).push(a); });
  groups.forEach((items, date) => {
    frag.appendChild(wsEl('div', 'date-divider', date + ' · ' + t('tlCount')(items.length)));
    const grid = wsEl('div', 'cards-grid');
    items.forEach(a => grid.appendChild(buildCard(a)));
    frag.appendChild(grid);
  });
  main.appendChild(frag);
  wsRefocus();
}
function renderWorkspace() {
  if (!state.wsActive) return;
  const seq = ++ws.seq;
  wsSyncChrome();
  const key = ws.range;
  const hit = ws.loads.get(key);
  if (hit && hit.done) { wsDraw(); return; }
  showMsg(t('wsLoading')(wsRangeLabel(key)));
  wsEnsure(key).then(() => {
    if (seq !== ws.seq || !state.wsActive) return;   // a late load must not draw over another view (or a newer range)
    wsDraw();
  });
}
// patch (from a hash restore) replaces every workspace filter; without it the filters of the last
// visit are kept (the search is always cleared on entry, as in the hub).
function selectWorkspace(patch) {
  const was = state.wsActive;
  leaveHub();
  state.wsActive = true;
  state.libActive = false;
  state.currentTracker = null; state.currentYear = null; state.currentMonth = null;
  state.currentDate = null; state.currentMode = null; state.pendingDates = [];
  state.filterCats = new Set();
  state.search = null;
  if (patch) {
    const names = wsTrackerNames();
    ws.range = wsNormRange(patch.range);
    ws.prev = null;
    ws.src = names.includes(patch.src) ? patch.src : '';
    ws.ty = NEWS_TYPES.some(x => x.id === patch.ty) ? patch.ty : '';
    ws.w = patch.w || '';
    ws.pl = HUB_PLATFORMS.includes(patch.pl) ? patch.pl : '';
    state.searchQuery = patch.q || '';
  } else if (!was) {
    state.searchQuery = '';
  }
  if (!ws.railInit) {
    ws.railInit = true;

    try { pref = prefGet('tracker_nav'); } catch (e) {}

  document.documentElement.dataset.mode = 'ws';   // hides the date sidebar / second header row, shows the rail + time chip

  document.getElementById('year-pills').innerHTML = '';
  document.getElementById('month-grid').innerHTML = '';
  document.getElementById('cat-pills').innerHTML = '';

function leaveWorkspace() {
  if (!state.wsActive) return;

function daysBetween(a, b) {

function renderLibrary() {
  if (state.wsActive) return;   // a late library load must not draw over the news workspace
  const main = document.getElementById('main-content');
  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('no-data').classList.add('hidden');
  Array.from(main.children).forEach(c => {
    if (c.id !== 'loading-msg' && c.id !== 'no-data' && c.id !== 'search-row') c.remove();
  });
  const lib = libData();
  const active = lib.topics.filter(t => t.status !== 'gone');
  // Decided over the whole catalogue, not the filtered view, so the chip does
  // not appear and disappear as clusters are picked.
  LIB_SHOW_NEW = libNewChipUseful(active, lib.generated);
  let topics = active;
  if (state.libCluster) topics = topics.filter(t => t.cluster === state.libCluster);
  document.getElementById('article-count').textContent = topics.length;
  syncHash();   // keep the URL shareable (#lib=1&c=…)
  if (!topics.length) {
    const nd = document.getElementById('no-data');
    nd.classList.remove('hidden');
    nd.textContent = state.lang === 'en' ? 'No CRA topics.' : '沒有 CRA 主題';
