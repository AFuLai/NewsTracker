<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark" data-skin="md3">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資安新聞追蹤系統</title>
<script src="manifest.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Design tokens — Material 3 role names.
   Two orthogonal axes: data-theme (dark|light) × data-skin (md3|classic).
   Skin differences live ENTIRELY in this token layer (audit B6): no rule
   may target a component behind [data-skin]; only [data-skin]{--token:v}.
   ═══════════════════════════════════════════════════════════════════ */

/* ── Skin/theme-independent scales ──────────────────────────────── */
:root {
  /* shape scale (5 steps) */
  --shape-xs: 4px;
  --shape-s: 8px;
  --shape-m: 12px;
  --shape-l: 16px;
  --shape-full: 9999px;
  /* type */
  --font: "Noto Sans TC", "Segoe UI", system-ui, -apple-system, sans-serif;
  /* motion */
  --motion-short: 200ms;
  --motion-medium: 300ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-emphasized: cubic-bezier(0.05, 0.7, 0.1, 1);
  /* state-layer opacities */
  --state-hover: 0.08;
  --state-press: 0.10;
}

/* ── md3 skin · dark ─────────────────────────────────────────────── */
[data-skin="md3"][data-theme="dark"] {
  --surface: #0f172a;
  --surface-container-lowest: #0b1120;
  --surface-container-low: #151f35;
  --surface-container: #1b2740;
  --surface-container-high: #22304c;
  --surface-container-highest: #2a3a59;
  --on-surface: #e8eef7;
  --on-surface-variant: #a8b6cc;
  --outline: #8492ab;
  --outline-variant: #3c4a68;
  --primary: #a8c7fa;
  --on-primary: #0b2f66;
  --primary-container: #1f4788;
  --on-primary-container: #d6e3ff;
  --elev-1: none; --elev-2: none; --elev-3: none;
  --cat-law-fill:#172c4f;      --cat-law-on:#97bbf7;
  --cat-vuln-fill:#4f1717;     --cat-vuln-on:#f7a1a1;
  --cat-supply-fill:#4f3a17;   --cat-supply-on:#f5cb84;
  --cat-incident-fill:#28174f; --cat-incident-on:#bba1f7;
  --cat-tech-fill:#174f3c;     --cat-tech-on:#7cf4cc;
  --cra-legis-fill:#17184f;    --cra-legis-on:#a1a3f7;
  --cra-std-fill:#173e4f;      --cra-std-on:#8ed6f6;
  --cra-comply-fill:#174f49;   --cra-comply-on:#87f2e6;
  --cra-oss-fill:#1a4c2c;      --cra-oss-on:#92ecb3;
  --cra-apac-fill:#4f4117;     --cra-apac-on:#f4d77b;
  --cra-industry-fill:#4f1733; --cra-industry-on:#f59ec9;
  --cra-event-fill:#34174f;    --cra-event-on:#cda1f7;
  --os-linux-fill:#4f3e17;     --os-linux-on:#f5d080;
  --os-windows-fill:#17374f;   --os-windows-on:#92cbf6;
  --os-apple-fill:#263140;     --os-apple-on:#babec4;
  --os-android-fill:#1a4c30;   --os-android-on:#93ecbb;
  --os-focus-fill:#4f1717;     --os-focus-on:#f7a1a1;
}
/* ── md3 skin · light ────────────────────────────────────────────── */
[data-skin="md3"][data-theme="light"] {
  --surface: #fbfcfe;
  --surface-container-lowest: #ffffff;
  --surface-container-low: #f4f6fa;
  --surface-container: #eceff5;
  --surface-container-high: #e5e9f1;
  --surface-container-highest: #dee3ed;
  --on-surface: #111827;
  --on-surface-variant: #454f68;
  --outline: #6f7b95;
  --outline-variant: #c4ccdb;
  --primary: #1d4ed8;
  --on-primary: #ffffff;
  --primary-container: #dbe6fe;
  --on-primary-container: #0d2f7a;
  --elev-1: 0 1px 2px rgba(0,0,0,.10), 0 1px 3px 1px rgba(0,0,0,.06);
  --elev-2: 0 1px 2px rgba(0,0,0,.10), 0 2px 6px 2px rgba(0,0,0,.06);
  --elev-3: 0 1px 3px rgba(0,0,0,.10), 0 4px 8px 3px rgba(0,0,0,.06);
  --cat-law-fill:#d1e0fa;      --cat-law-on:#08409b;
  --cat-vuln-fill:#f9d2d2;     --cat-vuln-on:#880c0c;
  --cat-supply-fill:#fbebd0;   --cat-supply-on:#6b4506;
  --cat-incident-fill:#ddd1fa; --cat-incident-on:#420bc1;
  --cat-tech-fill:#d2f9ec;     --cat-tech-on:#08593e;
  --cra-legis-fill:#d2d3f9;    --cra-legis-on:#1216ce;
  --cra-std-fill:#d1edfa;      --cra-std-on:#075273;
  --cra-comply-fill:#d3f8f4;   --cra-comply-on:#0a574f;
  --cra-oss-fill:#d5f6e1;      --cra-oss-on:#105b2c;
  --cra-apac-fill:#fbf1d0;     --cra-apac-on:#614b05;
  --cra-industry-fill:#f8d3e5; --cra-industry-on:#860e49;
  --cra-event-fill:#e6d1fa;    --cra-event-on:#5b09aa;
  --os-linux-fill:#fbeed0;     --os-linux-on:#664805;
  --os-windows-fill:#d0e8fb;   --os-windows-on:#074a7e;
  --os-apple-fill:#e4e5e7;     --os-apple-on:#444950;
  --os-android-fill:#d6f5e4;   --os-android-on:#105b32;
  --os-focus-fill:#f9d2d2;     --os-focus-on:#880c0c;
}

/* ── classic skin · saturated badges preserved (WCAG AA) ─────────── */
/* category fills are theme-independent for classic */
[data-skin="classic"] {
  --cat-law-fill:#1a6df4;      --cat-law-on:#ffffff;
  --cat-vuln-fill:#e61414;     --cat-vuln-on:#ffffff;
  --cat-supply-fill:#f59e0b;   --cat-supply-on:#5c3b02;
  --cat-incident-fill:#753ef4; --cat-incident-on:#ffffff;
  --cat-tech-fill:#10b981;     --cat-tech-on:#02402b;
  --cra-legis-fill:#4447ee;    --cra-legis-on:#ffffff;
  --cra-std-fill:#0ea5e9;      --cra-std-on:#02364d;
  --cra-comply-fill:#14b8a6;   --cra-comply-on:#04413a;
  --cra-oss-fill:#22c55e;      --cra-oss-on:#094820;
  --cra-apac-fill:#eab308;     --cra-apac-on:#5c4602;
  --cra-industry-fill:#de1779; --cra-industry-on:#ffffff;
  --cra-event-fill:#9b3cf6;    --cra-event-on:#ffffff;
  --os-linux-fill:#f0a500;     --os-linux-on:#5c4002;
  --os-windows-fill:#0076d1;   --os-windows-on:#ffffff;
  --os-apple-fill:#6c747f;     --os-apple-on:#ffffff;
  --os-android-fill:#3ddc84;   --os-android-on:#0c5a2f;
  --os-focus-fill:#e61414;     --os-focus-on:#ffffff;
}
[data-skin="classic"][data-theme="dark"] {
  --surface: #0f172a;
  --surface-container-lowest: #0b1120;
  --surface-container-low: #172136;
  --surface-container: #1e293b;
  --surface-container-high: #334155;
  --surface-container-highest: #3d4c63;
  --on-surface: #e2e8f0;
  /* brightened from the legacy #94a3b8 so secondary text clears AA on every
     surface level (the old value was 4.04 on --surface-container-high) */
  --on-surface-variant: #b5c0ce;
  --outline: #647996;
  --outline-variant: #334155;
  --primary: #60a5fa;
  --on-primary: #0b2f66;
  --primary-container: #1e3a5f;
  --on-primary-container: #dbeafe;
  --elev-1: none; --elev-2: none; --elev-3: none;
}
[data-skin="classic"][data-theme="light"] {
  --surface: #f8fafc;
  --surface-container-lowest: #ffffff;
  --surface-container-low: #ffffff;
  --surface-container: #ffffff;
  --surface-container-high: #e2e8f0;
  --surface-container-highest: #dbe2ea;
  --on-surface: #0f172a;
  --on-surface-variant: #475569;
  --outline: #7e90a9;
  --outline-variant: #cbd5e1;
  --primary: #2563eb;
  --on-primary: #ffffff;
  --primary-container: #dbe6fe;
  --on-primary-container: #0d2f7a;
  --elev-1: 0 1px 2px rgba(0,0,0,.08), 0 1px 3px 1px rgba(0,0,0,.04);
  --elev-2: 0 1px 2px rgba(0,0,0,.10), 0 2px 6px 2px rgba(0,0,0,.06);
  --elev-3: 0 1px 3px rgba(0,0,0,.10), 0 4px 8px 3px rgba(0,0,0,.06);
}

/* ── card-model tokens (skin-varied; attribute-only, B6-safe) ────── */
[data-skin="md3"]     { --card-bg: var(--surface-container-low); --card-border-width: 0; }
[data-skin="classic"] { --card-bg: var(--surface-container);     --card-border-width: 1px; }
[data-skin="md3"][data-theme="dark"]  { --card-shadow: none; }
[data-skin="md3"][data-theme="light"] { --card-shadow: var(--elev-1); }
[data-skin="classic"] { --card-shadow: none; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--surface);
  color: var(--on-surface);
  font-family: var(--font);
  font-size: 14px;            /* body-medium base */
  line-height: 1.5;
  height: 100vh;
  height: 100dvh;            /* app-shell: viewport-bounded, inner regions scroll */
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────── */
header {
  background: var(--surface-container);
  border-bottom: 1px solid var(--outline-variant);
  flex-shrink: 0;
  z-index: 100;
}
.hd-row1 {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  row-gap: 0.3rem;
  padding: 0.3rem 1.25rem;
  flex-wrap: wrap;      /* WHY: at every width the pills + title + stats + buttons can exceed the row; wrap instead of clipping the right-hand buttons */
  height: auto;
  min-height: 50px;
}
.hd-icon { font-size: 22px; line-height: 1; display: inline-flex; }
#tracker-title {
  font-size: 16px;
  font-weight: 500;
  color: var(--primary);
  min-width: 0;
  overflow-wrap: anywhere;
}
.hd-spacer { flex: 1; }
.hd-stats {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
  min-width: 0;
  gap: 0.6rem;
  row-gap: 0.1rem;
  font-size: 12px;
  color: var(--on-surface-variant);
  white-space: nowrap;
}
/* compact count / updated line, kept under the header buttons */
.hd-meta { order: 2; flex-basis: 100%; text-align: right; font-size: 11px; line-height: 1.2; }
.hd-meta strong { font-size: 12px; }
.hd-stats strong { color: var(--on-surface); font-size: 14px; font-weight: 600; }
#last-updated { font-size: 12px; }
#theme-btn, #lang-btn {
  position: relative;
  background: none;
  border: 1px solid var(--outline);
  color: var(--on-surface);
  cursor: pointer;
  padding: 0.3rem 0.55rem;
  border-radius: var(--shape-full);
  font-size: 14px;
}
.hamburger-btn {
  position: relative;
  display: inline-flex;   /* always visible: it IS the collapsed sidebar */
  align-items: center;
  justify-content: center;
  background: none;
  border: 1px solid var(--outline);
  color: var(--on-surface);
  cursor: pointer;
  padding: 0.3rem 0.55rem;
  border-radius: var(--shape-full);
  font-size: 16px;
  flex-shrink: 0;
}
#lang-btn { white-space: nowrap; }
.hd-row2 {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 1.25rem;
  border-top: 1px solid var(--outline-variant);
  flex-wrap: wrap;
}
.hd-sep {
  width: 1px;
  height: 18px;
  background: var(--outline-variant);
  margin: 0 0.25rem;
  flex-shrink: 0;
}
/* Search row — first row of the news area, sticky within #main-content.
   #main-content has no top padding so this pins flush under the header
   (no gap for content to peek through); its own top padding gives spacing. */
#search-row {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--surface);
  padding-top: 1rem;
  padding-bottom: 0.7rem;
  margin-bottom: 0.5rem;
  border-bottom: 1px solid var(--outline-variant);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
#search-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface-container);
  border: 1px solid var(--outline);
  border-radius: var(--shape-full);
  padding: 6px 14px;
  flex: 1 1 300px;
  max-width: 520px;
  transition: border-color var(--motion-short) var(--ease-standard);
}
#search-scope {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.scope-label { font-size: 12px; color: var(--on-surface-variant); margin-right: 2px; }
.scope-pill {
  position: relative;
  padding: 0.25rem 0.65rem;
  border-radius: var(--shape-full);
  border: 1px solid var(--outline);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: background-color var(--motion-short) var(--ease-standard),
              color var(--motion-short) var(--ease-standard),
              border-color var(--motion-short) var(--ease-standard);
}
.scope-pill.active { background: var(--primary); color: var(--on-primary); border-color: transparent; font-weight: 600; }
#search-wrap:focus-within { border-color: var(--primary); }
.search-ico { font-size: 14px; opacity: 0.7; display: inline-flex; }
#search-box {
  background: none;
  border: none;
  color: var(--on-surface);
  font-size: 14px;
  outline: none;   /* replaced by an explicit :focus-visible ring below (D8) */
  flex: 1;
  min-width: 0;
}
#search-box:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: var(--shape-xs);
}
#search-box::placeholder { color: var(--on-surface-variant); }
#search-box::-webkit-search-cancel-button { -webkit-appearance: none; }
#search-clear {
  position: relative;
  display: none;
  background: none;
  border: none;
  color: var(--on-surface-variant);
  cursor: pointer;
  font-size: 14px;
  padding: 0 2px;
  line-height: 1;
}
#search-clear:hover { color: var(--on-surface); }
/* year & cat pills */
#tracker-pills {
  display: inline-flex;
  flex-wrap: wrap;
  min-width: 0;
  max-width: 100%;
  gap: 4px;
  margin-right: 8px;
}
/* 依來源瀏覽 menu: a fixed-position popup (placed from JS) so it can never widen the page */
.src-wrap { display: inline-flex; }
#src-menu {
  position: fixed;
  z-index: 300;
  min-width: 11rem;
  max-width: calc(100vw - 16px);
  background: var(--surface-container);
  color: var(--on-surface);
  border: 1px solid var(--outline);
  border-radius: 12px;
  padding: 4px;
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
}
#src-menu[hidden] { display: none; }
#src-menu button {
  display: block; width: 100%; text-align: left;
  background: none; border: none; color: inherit; cursor: pointer;
  padding: 0.5rem 0.8rem; border-radius: 8px; font-size: 14px;
}
#src-menu button:hover, #src-menu button:focus-visible { background: var(--surface-variant, rgba(128,128,128,.18)); }
#src-menu button[aria-current="true"] { font-weight: 600; color: var(--primary); }
#tracker-pills .pill {
  font-weight: 600;
  border-color: var(--outline);
}
#tracker-pills .pill.active {
  background: var(--primary);
  color: var(--on-primary);
}
#year-pills, #cat-pills {
  display: flex;
  gap: 0.3rem;
  flex-wrap: wrap;
}
#cat-pills .cat-row-2 {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.3rem;
  flex-basis: 100%;   /* own line under the first row */
}
.cat-row-label {
  font-size: 12px;
  color: var(--on-surface-variant);
  opacity: 0.8;
  white-space: nowrap;
  margin-right: 0.1rem;
}
.pill {
  position: relative;
  padding: 0.3rem 0.7rem;
  border-radius: var(--shape-full);
  border: 1px solid var(--outline);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: background-color var(--motion-short) var(--ease-standard),
              color var(--motion-short) var(--ease-standard),
              border-color var(--motion-short) var(--ease-standard);
}
.pill.active { color: var(--on-primary); border-color: transparent; font-weight: 600; }
.pill.year-pill.active { background: var(--primary); }
.pill.sort-pill.active { background: var(--primary); color: var(--on-primary); }
/* Fallback + 全部 (All): neutral primary chip. */
.pill.cat-pill.active { background: var(--primary); color: var(--on-primary); }
.pill.cat-pill[data-cat="全部"].active { background: var(--primary); color: var(--on-primary); }
/* Category pills adopt their own tonal fill/on when active. */
.pill.cat-pill[data-cat="法規與標準"].active { background: var(--cat-law-fill); color: var(--cat-law-on); }
.pill.cat-pill[data-cat="漏洞與威脅情報"].active { background: var(--cat-vuln-fill); color: var(--cat-vuln-on); }
.pill.cat-pill[data-cat="供應鏈與開源安全"].active { background: var(--cat-supply-fill); color: var(--cat-supply-on); }
.pill.cat-pill[data-cat="重大事件"].active { background: var(--cat-incident-fill); color: var(--cat-incident-on); }
.pill.cat-pill[data-cat="前瞻技術"].active { background: var(--cat-tech-fill); color: var(--cat-tech-on); }
.pill.cat-pill[data-cat="法令更新"].active { background: var(--cra-legis-fill); color: var(--cra-legis-on); }
.pill.cat-pill[data-cat="調和標準"].active { background: var(--cra-std-fill); color: var(--cra-std-on); }
.pill.cat-pill[data-cat="合規指引"].active { background: var(--cra-comply-fill); color: var(--cra-comply-on); }
.pill.cat-pill[data-cat="開源影響"].active { background: var(--cra-oss-fill); color: var(--cra-oss-on); }
.pill.cat-pill[data-cat="亞太對應"].active { background: var(--cra-apac-fill); color: var(--cra-apac-on); }
.pill.cat-pill[data-cat="產業動態"].active { background: var(--cra-industry-fill); color: var(--cra-industry-on); }
.pill.cat-pill[data-cat="研討活動"].active { background: var(--cra-event-fill); color: var(--cra-event-on); }
.pill.cat-pill[data-cat="Linux"].active { background: var(--os-linux-fill); color: var(--os-linux-on); }
.pill.cat-pill[data-cat="Windows"].active { background: var(--os-windows-fill); color: var(--os-windows-on); }
.pill.cat-pill[data-cat="Apple"].active { background: var(--os-apple-fill); color: var(--os-apple-on); }
.pill.cat-pill[data-cat="Android"].active { background: var(--os-android-fill); color: var(--os-android-on); }
.pill.cat-pill[data-cat="重點關注"].active { background: var(--os-focus-fill); color: var(--os-focus-on); }

/* ── App body ─────────────────────────────────────── */
.app-body {
  display: flex;
  flex: 1 1 0;
  min-height: 0;           /* let children scroll instead of growing the body */
  overflow: hidden;
  position: relative;      /* anchor for the floating #sidebar + scrim */
}

/* ── Sidebar — floating overlay panel that collapses to the header's
   small hamburger button. Never reserves layout space (main content is
   full-width underneath); slides off-canvas when collapsed. ── */
#sidebar {
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: 8px;
  z-index: 60;
  width: 200px;
  background: var(--surface-container);
  border: 1px solid var(--outline-variant);
  border-radius: var(--shape-l);
  box-shadow: var(--elev-3, 0 8px 24px rgba(0,0,0,.4));
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0.4rem 0.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  /* collapsed (default): off-canvas + hidden from tab order / AT */
  transform: translateX(calc(-100% - 16px));
  visibility: hidden;
  transition: transform var(--motion-medium) var(--ease-emphasized),
              visibility 0s linear var(--motion-medium);
}
#sidebar.nav-open {
  transform: translateX(0);
  visibility: visible;
  transition: transform var(--motion-medium) var(--ease-emphasized),
              visibility 0s;
}
/* Scrim: shown (JS adds .open) only on the compact breakpoint, where the
   drawer is modal. On wider screens the drawer is dismissible and leaves
   the content interactive, so no scrim is applied. */
#sidebar-scrim {
  position: absolute;
  inset: 0;
  z-index: 55;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--motion-medium) var(--ease-standard),
              visibility var(--motion-medium) var(--ease-standard);
}
#sidebar-scrim.open { opacity: 1; visibility: visible; }
/* CRA library mode has no date nav — hide the floating sidebar entirely */
html[data-mode="lib"] #sidebar,
html[data-mode="lib"] #sidebar-scrim,
html[data-mode="lib"] #drawer-toggle { display: none !important; }

/* ── Sidebar toggle button ───────────────────────── */
#sidebar-toggle {
  position: relative;
  width: 100%;
  background: none;
  border: none;
  border-bottom: 1px solid var(--outline-variant);
  color: var(--on-surface-variant);
  cursor: pointer;
  padding: 0.3rem 0;
  font-size: 14px;
  text-align: center;
  flex-shrink: 0;
  margin-bottom: 0.3rem;
}
#sidebar-toggle:hover { color: var(--on-surface); background: var(--surface-container-high); }

.sb-section { margin-bottom: 0.5rem; }
#btn-full-year {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  width: 100%;
  padding: 0.45rem 0.3rem;
  background: var(--surface-container-high);
  border: none;
  border-radius: var(--shape-s);
  color: var(--on-surface);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 0.4rem;
  transition: background-color var(--motion-short) var(--ease-standard);
}
/* label lives in its own span (a flex sibling of the icon) so applyLang can set
   its text without wiping the SVG, and it still ellipses on overflow */
#btn-full-year .btn-label {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#month-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.2rem;
}
.month-btn {
  position: relative;
  padding: 0.35rem 0.1rem;
  border-radius: var(--shape-s);
  border: 1px solid var(--outline);
  background: transparent;
  color: var(--on-surface-variant);
  font-size: 14px;
  cursor: pointer;
  text-align: center;
  transition: background-color var(--motion-short) var(--ease-standard),
              color var(--motion-short) var(--ease-standard),
              border-color var(--motion-short) var(--ease-standard);
}
.month-btn.active { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.month-btn.empty { opacity: 0.35; cursor: default; }
.month-btn.empty:hover { background: transparent; color: var(--on-surface-variant); }
#date-section {
  border-top: 1px solid var(--outline-variant);
  padding-top: 0.4rem;
  margin-top: 0.2rem;
}
.sb-label {
  font-size: 12px;
  color: var(--on-surface-variant);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0 0.2rem;
  margin-bottom: 0.3rem;
}
.date-btn {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 0.4rem 0.3rem;
  border-radius: var(--shape-s);
  border: none;
  background: transparent;
  color: var(--on-surface-variant);
  font-size: 14px;
  cursor: pointer;
  transition: background-color var(--motion-short) var(--ease-standard),
              color var(--motion-short) var(--ease-standard);
}
.date-btn.active { background: var(--primary); color: var(--on-primary); }
.date-btn .badge {
  background: var(--surface-container-high);
  border-radius: var(--shape-full);
  padding: 0 0.35rem;
  font-size: 11px;
  font-weight: 600;
  color: var(--on-surface-variant);
  flex-shrink: 0;
}
.date-btn.active .badge { background: rgba(255,255,255,0.2); color: var(--on-primary); }

/* ── Main content ────────────────────────────────── */
#main-content {
  flex: 1 1 0;
  min-width: 0;
  overflow-y: auto;
  padding: 0 1rem 1rem;   /* no top padding: #search-row owns the top spacing */
}
#loading-msg {
  text-align: center;
  color: var(--on-surface-variant);
  padding: 3rem;
  font-size: 14px;
}
#no-data {
  text-align: center;
  color: var(--on-surface-variant);
  padding: 3rem;
  font-size: 14px;
}
.date-divider {
  font-size: 14px;
  font-weight: 700;
  color: var(--on-surface-variant);
  letter-spacing: 0.03em;
  padding: 0.5rem 0 0.35rem;
  border-bottom: 1px solid var(--outline-variant);
  margin-bottom: 0.6rem;
  margin-top: 0.5rem;
}
.date-divider:first-child { margin-top: 0; }
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
}

/* ── View presets: html[data-layout] / html[data-density] (modelled on [data-skin]) ──
   The default preset (grid + comfortable) deliberately has NO rules here: it
   must render exactly as before presets existed. */
#view-select {
  background: none;
  border: 1px solid var(--outline);
  color: var(--on-surface);
  cursor: pointer;
  padding: 0.3rem 0.55rem;
  border-radius: var(--shape-full);
  font-size: 14px;
  max-width: 9.5rem;
}
#view-select option { background: var(--surface-container); color: var(--on-surface); }
/* ── Watch (關注): button, panel, badge, accent ── */
#watch-btn {
  background: none;
  border: 1px solid var(--outline);
  color: var(--on-surface);
  cursor: pointer;
  padding: 0.3rem 0.7rem;
  border-radius: var(--shape-full);
  font-size: 14px;
}
#watch-btn[aria-expanded="true"] { background: var(--primary-container); color: var(--on-primary-container); }
#watch-btn:focus-visible, .pill.watch-pill:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
#watch-panel {
  position: fixed;
  top: 3.5rem;
  right: 0.75rem;
  z-index: 110;   /* above the sticky header (z-index 100), which otherwise hides the top rows */
  width: min(22rem, calc(100vw - 1.5rem));
  max-height: 80vh;
  overflow-y: auto;
  background: var(--surface-container-high);
  color: var(--on-surface);
  border: 1px solid var(--outline-variant);
  border-radius: var(--shape-m);
  box-shadow: var(--elev-3);
  padding: 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  font-size: 14px;
}
#watch-panel.hidden { display: none; }
#watch-panel h4 { font-size: 14px; margin: 0; }
#watch-panel h5.watch-grp, #watch-panel #watch-grp-pkg { font-size: 13px; font-weight: 600; margin: 0.25rem 0 0; }
#watch-panel #watch-grp-pkg { cursor: pointer; }
#watch-panel #watch-grp-pkg:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
#watch-panel .watch-grid { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; margin-top: 0.4rem; }
#watch-panel label.watch-rule { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
#watch-panel input[type="checkbox"] { accent-color: var(--primary); width: 1rem; height: 1rem; }
#watch-panel .watch-add { display: flex; gap: 0.4rem; }
#watch-panel input[type="text"] {
  flex: 1; min-width: 0;
  background: var(--surface-container);
  color: var(--on-surface);
  border: 1px solid var(--outline);
  border-radius: var(--shape-full);
  padding: 0.3rem 0.7rem;
  font-size: 14px;
}
#watch-panel button {
  background: none;
  border: 1px solid var(--outline);
  color: var(--on-surface);
  cursor: pointer;
  border-radius: var(--shape-full);
  padding: 0.3rem 0.7rem;
  font-size: 14px;
}
#watch-panel button:focus-visible, #watch-panel input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
#watch-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
#watch-chips .watch-chip {
  display: inline-flex; align-items: center; gap: 0.25rem;
  background: var(--primary-container);
  color: var(--on-primary-container);
  border-color: transparent;
  padding: 0.15rem 0.3rem 0.15rem 0.6rem;
}
.pill.watch-pill.active { background: var(--primary); color: var(--on-primary); border-color: transparent; font-weight: 600; }
.watch-badge {
  display: inline-block;
  width: fit-content;
  padding: 0.1rem 0.5rem;
  border-radius: var(--shape-full);
  font-size: 13px;
  font-weight: 600;
  background: var(--primary-container);
  color: var(--on-primary-container);
  border: 1px solid var(--primary);
  margin-left: 0.4rem;
  white-space: nowrap;
}
.card.watched, .river-row.watched { border-left: 4px solid var(--primary); }
.river-row .watch-badge { margin-left: 0; margin-right: 0.4rem; }
/* ── Palettes (配色): html[data-palette="<id>"] ──
   INVARIANT: with no data-palette attribute NONE of these rules match, so the
   default look (data-skin x data-theme) is untouched. A palette only sets --pal-*
   tokens and remaps the site's existing variables; the selector carries
   [data-skin][data-theme] so it outranks both skins' own [data-skin][data-theme]
   token blocks. Category fill/on pairs are left alone: every use pairs a fill with
   its own on-colour, so they stay legible on any palette background. */
html[data-palette="deepsea"] {
  color-scheme: dark;
  --pal-bg: #070B12; --pal-card: rgba(13,20,32,0.92); --pal-text: #E6EEF7; --pal-muted: #8EA2BB; --pal-line: #1F2F45;
  --pal-accent: #5FE1FF; --pal-dim: #2A6F8A; --pal-warn: #FFB547; --pal-warn-text: #070B12;
  --pal-on-accent: #070B12;
  --pal-pattern: linear-gradient(rgba(95,225,255,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(95,225,255,0.07) 1px, transparent 1px);
  --pal-size: 28px 28px;
}
html[data-palette="terminal"] {
  color-scheme: dark;
  --pal-bg: #040A06; --pal-card: rgba(8,20,12,0.92); --pal-text: #DDF7E6; --pal-muted: #87B597; --pal-line: #1A3A24;
  --pal-accent: #39FF88; --pal-dim: #1E7A46; --pal-warn: #FFD23F; --pal-warn-text: #040A06;
  --pal-on-accent: #040A06;
  --pal-pattern: repeating-linear-gradient(0deg, rgba(57,255,136,0.06) 0 1px, transparent 1px 4px);
  --pal-size: auto;
}
html[data-palette="neon"] {
  color-scheme: dark;
  --pal-bg: #0C0716; --pal-card: rgba(22,12,38,0.92); --pal-text: #EFE7FF; --pal-muted: #A898C8; --pal-line: #2E2050;
  --pal-accent: #B98CFF; --pal-dim: #5B3E99; --pal-warn: #FF6FB1; --pal-warn-text: #0C0716;
  --pal-on-accent: #0C0716;
  --pal-pattern: radial-gradient(rgba(185,140,255,0.22) 1px, transparent 1.5px);
  --pal-size: 16px 16px;
}
html[data-palette="amber"] {
  color-scheme: dark;
  --pal-bg: #100C05; --pal-card: rgba(28,20,8,0.92); --pal-text: #FBF1DD; --pal-muted: #BFA77E; --pal-line: #3A2C12;
  --pal-accent: #FFB000; --pal-dim: #7A5A10; --pal-warn: #FF5C5C; --pal-warn-text: #100C05;
  --pal-on-accent: #100C05;
  --pal-pattern: repeating-linear-gradient(45deg, rgba(255,176,0,0.06) 0 2px, transparent 2px 12px);
  --pal-size: auto;
}
html[data-palette="steel"] {
  color-scheme: light;
  --pal-bg: #EEF3F8; --pal-card: rgba(255,255,255,0.9); --pal-text: #0F1A2A; --pal-muted: #4D5D73; --pal-line: #C9D5E3;
  --pal-accent: #0B5CD5; --pal-dim: #8FB1E6; --pal-warn: #C2410C; --pal-warn-text: #FFFFFF;
  --pal-on-accent: #FFFFFF;
  --pal-pattern: linear-gradient(rgba(11,92,213,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(11,92,213,0.08) 1px, transparent 1px), linear-gradient(rgba(11,92,213,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(11,92,213,0.04) 1px, transparent 1px);
  --pal-size: 64px 64px, 64px 64px, 16px 16px, 16px 16px;
}
html[data-palette="arctic"] {
  color-scheme: light;
  --pal-bg: #FAFBFC; --pal-card: #FFFFFF; --pal-text: #14181F; --pal-muted: #5B6472; --pal-line: #DFE3E9;
  --pal-accent: #0F766E; --pal-dim: #8CC7C1; --pal-warn: #B4460C; --pal-warn-text: #FFFFFF;
  --pal-on-accent: #FFFFFF;
  --pal-pattern: none;
  --pal-size: auto;
}
html[data-palette="paper"] {
  color-scheme: light;
  --pal-bg: #F4ECD8; --pal-card: rgba(251,246,234,0.92); --pal-text: #3B2F1E; --pal-muted: #6B583B; --pal-line: #E0D2B4;
  --pal-accent: #A3541A; --pal-dim: #D9B98C; --pal-warn: #9C2F1F; --pal-warn-text: #FFFFFF;
  --pal-on-accent: #FFFFFF;
  --pal-pattern: repeating-linear-gradient(0deg, rgba(120,90,40,0.05) 0 1px, transparent 1px 6px);
  --pal-size: auto;
}
html[data-palette="warmnight"] {
  color-scheme: dark;
  --pal-bg: #1A140D; --pal-card: rgba(36,27,18,0.94); --pal-text: #EBDCC3; --pal-muted: #B39E7E; --pal-line: #3A2D1E;
  --pal-accent: #E0A458; --pal-dim: #7A5A33; --pal-warn: #E8735A; --pal-warn-text: #1A140D;
  --pal-on-accent: #1A140D;
  --pal-pattern: radial-gradient(rgba(224,164,88,0.10) 1px, transparent 1.5px);
  --pal-size: 20px 20px;
}
html[data-palette="redlight"] {
  color-scheme: dark;
  --pal-bg: #120807; --pal-card: rgba(27,13,11,0.94); --pal-text: #E8BFAF; --pal-muted: #B88A7A; --pal-line: #3A1E19;
  --pal-accent: #E06A4E; --pal-dim: #7A3428; --pal-warn: #F2B33D; --pal-warn-text: #120807;
  --pal-on-accent: #120807;
  --pal-pattern: none;
  --pal-size: auto;
}
html[data-palette="graphite"] {
  color-scheme: dark;
  --pal-bg: #1C1D1F; --pal-card: rgba(35,36,39,0.95); --pal-text: #C9C6C0; --pal-muted: #9A968F; --pal-line: #34363A;
  --pal-accent: #A8B3A0; --pal-dim: #5C6358; --pal-warn: #D49A6A; --pal-warn-text: #1C1D1F;
  --pal-on-accent: #1C1D1F;
  --pal-pattern: linear-gradient(rgba(200,198,192,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(200,198,192,0.035) 1px, transparent 1px);
  --pal-size: 32px 32px;
}
html[data-palette][data-skin][data-theme] {
  --surface: var(--pal-bg);
  --surface-container-lowest: var(--pal-bg);
  /* opaque steps (sticky header / popovers must not show content through) */
  --surface-container-low: color-mix(in srgb, var(--pal-bg), var(--pal-text) 4%);
  --surface-container: color-mix(in srgb, var(--pal-bg), var(--pal-text) 6%);
  --surface-container-high: color-mix(in srgb, var(--pal-bg), var(--pal-text) 10%);
  --surface-container-highest: color-mix(in srgb, var(--pal-bg), var(--pal-text) 14%);
  --on-surface: var(--pal-text);
  --on-surface-variant: var(--pal-muted);
  --outline: color-mix(in srgb, var(--pal-line), var(--pal-muted) 55%);
  --outline-variant: var(--pal-line);
  --primary: var(--pal-accent);
  --on-primary: var(--pal-on-accent);
  --primary-container: color-mix(in srgb, var(--pal-dim) 40%, var(--pal-bg));
  --on-primary-container: var(--pal-text);
  --card-bg: var(--pal-card);
  --card-border-width: 1px;
  --card-shadow: none;
  --elev-1: none; --elev-2: none; --elev-3: none;
}
html[data-palette] body { background-image: var(--pal-pattern); background-size: var(--pal-size); }
html[data-palette] .watch-badge { background: var(--pal-warn); color: var(--pal-warn-text); border-color: var(--pal-warn); }
html[data-palette] .card.watched, html[data-palette] .river-row.watched { border-left-color: var(--pal-warn); }
#theme-btn:disabled { opacity: 0.45; cursor: not-allowed; }
/* palette picker: modelled on #watch-panel */
#palette-btn {
  background: none;
  border: 1px solid var(--outline);
  color: var(--on-surface);
  cursor: pointer;
  padding: 0.3rem 0.7rem;
  border-radius: var(--shape-full);
  font-size: 14px;
}
#palette-btn[aria-expanded="true"] { background: var(--primary-container); color: var(--on-primary-container); }
#palette-btn:focus-visible, #palette-panel button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
#palette-panel {
  position: fixed;
  top: 3.5rem;
  right: 0.75rem;
  z-index: 110;   /* above the sticky header (z-index 100), like #watch-panel */
  width: min(26rem, calc(100vw - 1.5rem));
  max-height: 80vh;
  overflow-y: auto;
  background: var(--surface-container-high);
  color: var(--on-surface);
  border: 1px solid var(--outline-variant);
  border-radius: var(--shape-m);
  box-shadow: var(--elev-3);
  padding: 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  font-size: 14px;
}
#palette-panel.hidden { display: none; }
#palette-panel h4 { font-size: 14px; margin: 0; }
#palette-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
#palette-panel button {
  background: var(--surface-container);
  border: 1px solid var(--outline);
  color: var(--on-surface);
  cursor: pointer;
  border-radius: var(--shape-m);
  padding: 0.45rem 0.55rem;
  font-size: 13px;
  text-align: left;
  display: flex;
  flex-direction: column;

}
#palette-panel button[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
#palette-panel .pal-default { text-align: center; border-radius: var(--shape-full); }
.pal-sw { display: flex; height: 1.1rem; border-radius: var(--shape-xs); overflow: hidden; border: 1px solid rgba(128,128,128,0.45); }
.pal-sw span { flex: 1; }
.pal-name { font-weight: 600; }
.pal-pname { color: var(--on-surface-variant); font-size: 12px; }
html[data-density="compact"] .cards-grid { gap: 0.5rem; margin-bottom: 0.6rem; }
html[data-density="compact"] .card { padding: 0.6rem; gap: 0.3rem; }
html[data-density="compact"] .date-divider { padding: 0.3rem 0 0.2rem; margin-bottom: 0.4rem; }
html[data-layout="timeline"] .river-list,
html[data-layout="river"] .river-list { display: flex; flex-direction: column; margin-bottom: 0.6rem; }
html[data-layout="timeline"] .river-row,
html[data-layout="river"] .river-row {
  padding: 0.35rem 0.5rem;
  border-bottom: 1px solid var(--outline-variant);
  cursor: pointer;
}
html[data-layout="timeline"] .river-row:hover,
html[data-layout="river"] .river-row:hover { background: var(--surface-container-high); }
html[data-layout="timeline"] .river-row:focus-visible,
html[data-layout="river"] .river-row:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
html[data-layout="timeline"] .river-row .card-title,
html[data-layout="river"] .river-row .card-title { margin: 0; }
html[data-layout="timeline"] .river-row .card-meta,
html[data-layout="river"] .river-row .card-meta {
  font-size: 12px;
  color: var(--on-surface-variant);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
html[data-layout="hero"] .cards-grid .card-hero { grid-column: 1 / -1; padding: 1.25rem; }
html[data-layout="hero"] .card-hero .card-title { font-size: 20px; }
html[data-layout="hero"] .card-hero .card-summary-preview { -webkit-line-clamp: 5; }

/* ── Cards ───────────────────────────────────────── */
.card {
  position: relative;
  background: var(--card-bg);
  border: var(--card-border-width) solid var(--outline-variant);
  border-radius: var(--shape-m);
  box-shadow: var(--card-shadow);
  padding: 0.9rem;
  cursor: pointer;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  transition: box-shadow var(--motion-short) var(--ease-standard),
              transform var(--motion-short) var(--ease-standard);
}
.card:hover {
  transform: translateY(-1px);
  box-shadow: var(--elev-2);
}
.cat-badge {
  display: inline-block;
  padding: 0.2rem 0.6rem;
  border-radius: var(--shape-full);
  font-size: 14px;
  font-weight: 600;
  width: fit-content;
  /* default (uncategorized); specific .cat-* rules override */
  background: var(--surface-container-highest);
  color: var(--on-surface);
}
/* Security categories */
.cat-法規與標準 { background: var(--cat-law-fill); color: var(--cat-law-on); }
.cat-漏洞與威脅情報 { background: var(--cat-vuln-fill); color: var(--cat-vuln-on); }
.cat-供應鏈與開源安全 { background: var(--cat-supply-fill); color: var(--cat-supply-on); }
.cat-重大事件 { background: var(--cat-incident-fill); color: var(--cat-incident-on); }
.cat-前瞻技術 { background: var(--cat-tech-fill); color: var(--cat-tech-on); }
/* EU CRA categories */
.cat-法令更新 { background: var(--cra-legis-fill); color: var(--cra-legis-on); }
.cat-調和標準 { background: var(--cra-std-fill); color: var(--cra-std-on); }
.cat-合規指引 { background: var(--cra-comply-fill); color: var(--cra-comply-on); }
.cat-開源影響 { background: var(--cra-oss-fill); color: var(--cra-oss-on); }
.cat-亞太對應 { background: var(--cra-apac-fill); color: var(--cra-apac-on); }
.cat-產業動態 { background: var(--cra-industry-fill); color: var(--cra-industry-on); }
.cat-研討活動 { background: var(--cra-event-fill); color: var(--cra-event-on); }
/* OS categories */
.cat-Linux { background: var(--os-linux-fill); color: var(--os-linux-on); }
.cat-Windows { background: var(--os-windows-fill); color: var(--os-windows-on); }
.cat-Apple { background: var(--os-apple-fill); color: var(--os-apple-on); }
.cat-Android { background: var(--os-android-fill); color: var(--os-android-on); }
.cat-重點關注 { background: var(--os-focus-fill); color: var(--os-focus-on); }
.card-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.45;
  color: var(--on-surface);
}
.card-title a.cve-link, .card-summary a.cve-link {
  color: var(--primary);
  text-decoration: none;
  font-weight: 700;
}
.card-title a.cve-link:hover, .card-summary a.cve-link:hover { text-decoration: underline; }
.card-summary-preview {
  font-size: 14px;
  color: var(--on-surface-variant);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
}
.card-tag {
  background: var(--surface-container-high);
  color: var(--on-surface);
  border-radius: var(--shape-xs);
  padding: 0.15rem 0.45rem;
  font-size: 12px;
  text-decoration: none;
}
a.card-tag { color: var(--primary); font-weight: 500; }
a.card-tag:hover { text-decoration: underline; }
.card-meta {
  font-size: 12px;
  color: var(--on-surface-variant);
  margin-top: auto;
}

/* ★ 必須定義，否則 #no-data 會產生頂部空白 */
.hidden { display: none; }

/* ── CRA reference-library view ─────────────────────────
   A library entry is a title, a date and a source — there is no summary to
   read. Rendered as cards, the badge and the repeated cluster label outweighed
   the one thing worth reading, so the view is a dense list: the title carries
   the weight, everything else is muted, and whichever attribute is already the
   group heading is not repeated on every row. */
.lib-sort {
  display: none;                 /* news mode has no grouping control */
  align-items: center;
  gap: 0.4rem;
  padding: 0 0 0.15rem;
  flex-wrap: wrap;
}
html[data-mode="lib"] .lib-sort { display: flex; }
.lib-sort-label {
  font-size: 12px;
  color: var(--on-surface-variant);
  margin-right: 0.15rem;
  white-space: nowrap;
}
.lib-list { display: flex; flex-direction: column; margin-bottom: 1rem; }
.lib-row {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) max-content;
  gap: 0.85rem;
  align-items: baseline;
  padding: 0.4rem 0.55rem;
  border-radius: var(--shape-xs);
  text-decoration: none;
  color: inherit;
  transition: background var(--motion-short) var(--ease-standard);
}
.lib-row:nth-child(even) { background: var(--surface-container-low); }
.lib-row:hover { background: var(--surface-container-high); }
.lib-row:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.lib-name { font-size: 14px; font-weight: 500; color: var(--on-surface); line-height: 1.45; }
.lib-row:hover .lib-name { text-decoration: underline; }
.lib-side {
  font-size: 12px;
  color: var(--on-surface-variant);
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 24rem;
}
/* Kept as filled chips: the fill/on pairs are the only colour combinations
   already validated for contrast across all four theme × skin combinations. */
.lib-chip {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 0 0.35rem;
  border-radius: var(--shape-full);
  margin-left: 0.4rem;
  vertical-align: 1px;
}
.lib-chip.new { background: var(--cra-oss-fill);  color: var(--cra-oss-on); }   /* green */
.lib-chip.upd { background: var(--cra-apac-fill); color: var(--cra-apac-on); }  /* amber */
/* The date the page itself states it was revised — the one that orders the
   official updates. `.weak` = only a site-wide build stamp was available. */
.lib-date {
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  color: var(--on-surface-variant);
}
.lib-date.weak { opacity: 0.72; text-decoration: underline dotted; }
@media (max-width: 700px) {
  .lib-row {
    grid-template-columns: max-content minmax(0, 1fr);
    row-gap: 0.15rem;
  }
  .lib-name { grid-column: 1 / -1; }
  .lib-side { text-align: left; max-width: none; }
}

/* ── Overlay ─────────────────────────────────────── */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
#overlay.hidden { display: none; }
.overlay-box {
  background: var(--surface-container-high);
  border: 1px solid var(--outline-variant);
  border-radius: var(--shape-l);
  box-shadow: var(--elev-3);
  padding: 1.5rem;
  max-width: 680px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
#overlay-close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: var(--surface-container-highest);
  border: none;
  color: var(--on-surface);
  cursor: pointer;
  border-radius: var(--shape-s);
  padding: 0.3rem 0.6rem;
  font-size: 14px;
}
.overlay-box h2 { font-size: 22px; line-height: 1.35; font-weight: 400; padding-right: 2.5rem; }
.overlay-box .card-summary {
  font-size: 16px;
  color: var(--on-surface-variant);
  line-height: 1.7;
}
.overlay-box hr { border: none; border-top: 1px solid var(--outline-variant); }
.overlay-box h4 { font-size: 12px; color: var(--on-surface-variant); }
.overlay-box ul { padding-left: 1.2rem; }
.overlay-box ul li { font-size: 16px; margin-bottom: 0.35rem; }
.overlay-box ul li a { color: var(--primary); text-decoration: none; }
.overlay-box ul li a:hover { text-decoration: underline; }

/* ── State layers (MD3): faint currentColor overlay on interaction ── */
.pill::before, .scope-pill::before, .month-btn::before, .date-btn::before,
.card::before, #btn-full-year::before, #theme-btn::before, #lang-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: currentColor;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--motion-short) var(--ease-standard);
}
.pill:hover::before, .scope-pill:hover::before, .month-btn:not(.empty):hover::before,
.date-btn:hover::before, .card:hover::before, #btn-full-year:hover::before,
#theme-btn:hover::before, #lang-btn:hover::before { opacity: var(--state-hover); }
.pill:active::before, .scope-pill:active::before, .month-btn:not(.empty):active::before,
.date-btn:active::before, .card:active::before, #btn-full-year:active::before,
#theme-btn:active::before, #lang-btn:active::before { opacity: var(--state-press); }

/* ── 48dp hit targets (C4/D9): an invisible ::after centred on the element's
   own box, expanding the clickable/tappable region to >=48x48 without
   changing the visible (compact) size. Requires the element to NOT clip its
   own overflow — see the overflow:hidden removals above. ── */
.pill::after, .scope-pill::after, .month-btn:not(.empty)::after, .date-btn::after,
#btn-full-year::after, #theme-btn::after, #lang-btn::after, #sidebar-toggle::after,
#search-clear::after, #overlay-close::after, .hamburger-btn::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 48px;
  height: 48px;
  transform: translate(-50%, -50%);
}

/* ── Focus-visible ring (C3/D8): keyboard-only focus indicator. Outlines
   automatically conform to the element's own border-radius in modern
   browsers, so one rule covers pills, buttons and cards alike. ── */
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* ── Responsive — MD3 window size classes ──────────────────────────
   Default rules above = expanded (840–1239px). */
@media (min-width: 1600px) {                      /* extra-large */
  .cards-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
}
@media (max-width: 1239px) {
  .cards-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
}
@media (max-width: 839px) {                       /* medium */
  #sidebar { width: 80px; min-width: 80px; }
  .cards-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}
@media (max-width: 599px) {                       /* compact */
  /* Sidebar is already a floating drawer at all widths; compact just widens
     it a touch and makes it modal (scrim + inert applied from JS). */
  #sidebar { width: min(280px, 82vw); }
  .cards-grid { grid-template-columns: minmax(0, 1fr); }
  /* row2 becomes one horizontally-scrolling strip instead of wrapping */
  .hd-row2 { flex-wrap: nowrap; overflow-x: auto; min-width: 0; max-width: 100%; }   /* without min-width/max-width the strip grows with its pills and widens the whole page instead of scrolling */
  #year-pills, #cat-pills, .lib-sort { flex-wrap: nowrap; }
  /* second row joins the same horizontally-scrolling strip */
  #cat-pills .cat-row-2 { flex-wrap: nowrap; flex-basis: auto; flex-shrink: 0; }
  .hd-row1 { gap: 0.5rem; flex-wrap: wrap; height: auto; min-height: 50px; padding-block: 0.4rem; }   /* tracker tabs + stats + header buttons do not fit 375px on one line */
  .hd-stats { flex-wrap: wrap; min-width: 0; row-gap: 0.3rem; }
  /* Mobile has room to spare — enlarge the actual box instead of relying on
     the invisible ::after hit-slop (which is more prone to overlap in the
     dense month/date lists at this width). */
  .pill, .scope-pill, .month-btn {
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .date-btn { min-height: 48px; }
  #theme-btn, #lang-btn, #sidebar-toggle, #search-clear, #overlay-close {
    min-width: 48px;
    min-height: 48px;
  }
}

/* ── 我的關注 (watch hub) ─────────────────────────────────
   html[data-mode="hub"] hides the date sidebar the way data-mode="lib" does. Every
   other selector here is prefixed .wh, so no other view is touched. The 儀表 panel
   (.wh-dash) takes its defaults from the active theme tokens (HubTiles.dc.html layout); with a
   palette active (html[data-palette]) it takes that palette's --pal-* tokens instead. */
html[data-mode="hub"] #sidebar,
html[data-mode="hub"] #sidebar-scrim,
html[data-mode="hub"] #drawer-toggle,
html[data-mode="hub"] .hd-row2 { display: none !important; }
.wh { display: flex; flex-direction: column; gap: 1rem; padding-top: 1rem; min-width: 0; }
.wh { --wh-hit: #B4460C; }
html[data-theme="dark"] .wh { --wh-hit: #FFB547; }
html[data-palette] .wh { --wh-hit: var(--pal-warn); }
.wh-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; min-width: 0; }
.wh-head h2 { font-size: 18px; font-weight: 600; color: var(--on-surface); }
.wh-sub { color: var(--on-surface-variant); font-size: 13px; }
.wh-spacer { flex: 1 1 auto; }
.wh-ctl { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 13px; color: var(--on-surface-variant); }
.wh-seg { display: inline-flex; border: 1px solid var(--outline); border-radius: var(--shape-full); overflow: hidden; }
.wh-seg button, .wh-btn, .wh-select {
  font: inherit; font-size: 14px; min-height: 36px; padding: 0.3rem 0.8rem;
  background: none; color: var(--on-surface); border: 0; cursor: pointer;
}
.wh-seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); font-weight: 600; }
.wh-btn { border: 1px solid var(--outline); border-radius: var(--shape-full); }
.wh-select { border: 1px solid var(--outline); border-radius: var(--shape-full); background: var(--surface-container); }
.wh-select option { background: var(--surface-container); color: var(--on-surface); }
.wh-brief {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 1rem;
  padding: 0.6rem 0.9rem; min-width: 0;
  background: var(--surface-container); border: 1px solid var(--outline-variant); border-radius: var(--shape-m);
}
.wh-brief .wh-num { font-weight: 700; color: var(--wh-hit); }
.wh-plat { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; min-width: 0; }
.wh-plat-label { font-size: 12px; color: var(--on-surface-variant); }
.wh-chip {
  font: inherit; font-size: 12px; min-height: 32px; padding: 0.2rem 0.7rem; cursor: pointer;
  background: transparent; color: var(--on-surface-variant);
  border: 1px solid var(--outline); border-radius: var(--shape-full);
}
.wh-chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: transparent; font-weight: 600; }
.wh-sec { display: flex; flex-direction: column; gap: 0.6rem; min-width: 0; }
.wh-sec-head {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.9rem;
  border-bottom: 2px solid var(--on-surface); padding-bottom: 0.3rem;
}
.wh-sec-head h3 { font-size: 17px; font-weight: 600; color: var(--on-surface); }
.wh-total { color: var(--on-surface-variant); }
.wh-hits { color: var(--wh-hit); font-size: 12px; }
.wh-more {
  margin-left: auto; font: inherit; font-size: 13px; cursor: pointer; padding: 0.2rem 0.3rem;
  background: none; border: 0; color: var(--primary);
}
.wh-more:hover { text-decoration: underline; }
.wh-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.wh-note { color: var(--on-surface-variant); padding: 1.5rem 0; text-align: center; }
.wh-loading::before {   /* visible spinner while ensureHubLoaded runs */
  content: ''; display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
  border: 2px solid var(--outline); border-top-color: var(--primary); border-radius: 50%;
  animation: wh-spin 0.8s linear infinite;
}
@keyframes wh-spin { to { transform: rotate(360deg); } }
html[data-mode="hub"] .river-list { display: flex; flex-direction: column; margin-bottom: 0.4rem; min-width: 0; }
html[data-mode="hub"] .river-row { padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--outline-variant); cursor: pointer; min-width: 0; }
html[data-mode="hub"] .river-row:hover { background: var(--surface-container-high); }
html[data-mode="hub"] .river-row:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
html[data-mode="hub"] .river-row .card-title { margin: 0; overflow-wrap: anywhere; }
html[data-mode="hub"] .river-row .card-meta {
  font-size: 12px; color: var(--on-surface-variant);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
html[data-mode="hub"] .wh .card { min-width: 0; }
html[data-mode="hub"] .wh .card-title { overflow-wrap: anywhere; }
/* 儀表 */
.wh-dash {
  --wh-bg: var(--surface-container-low); --wh-card: var(--surface-container); --wh-text: var(--on-surface); --wh-muted: var(--on-surface-variant);
  --wh-line: var(--outline-variant); --wh-accent: var(--primary); --wh-dim: var(--outline); --wh-warn: var(--wh-hit); --wh-warn-text: var(--surface);
  --wh-sel: color-mix(in srgb, var(--surface-container-low), var(--primary) 14%); --wh-grid: color-mix(in srgb, var(--primary) 5%, transparent);
  display: flex; flex-direction: column; gap: 0.8rem; min-width: 0;
  padding: 0.8rem; border: 1px solid var(--wh-line); border-radius: var(--shape-m);
  color: var(--wh-text); background-color: var(--wh-bg);
  background-image: linear-gradient(var(--wh-grid) 1px, transparent 1px), linear-gradient(90deg, var(--wh-grid) 1px, transparent 1px);
  background-size: 32px 32px;
}
html[data-palette] .wh-dash {
  --wh-bg: var(--pal-bg); --wh-card: var(--pal-card); --wh-text: var(--pal-text); --wh-muted: var(--pal-muted);
  --wh-line: var(--pal-line); --wh-accent: var(--pal-accent); --wh-dim: var(--pal-dim);
  --wh-warn: var(--pal-warn); --wh-warn-text: var(--pal-warn-text);
  --wh-sel: color-mix(in srgb, var(--pal-bg), var(--pal-accent) 14%);
  --wh-grid: color-mix(in srgb, var(--pal-accent) 7%, transparent);
}
.wh-dash .wh-plat-label, .wh-dash .wh-legend { color: var(--wh-muted); font-family: ui-monospace, "IBM Plex Mono", monospace; }
.wh-dash .wh-chip { color: var(--wh-muted); border-color: var(--wh-line); font-family: ui-monospace, "IBM Plex Mono", monospace; }
.wh-dash .wh-chip[aria-pressed="true"] { background: var(--wh-sel); color: var(--wh-accent); border-color: var(--wh-accent); }
.wh-legend { display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; font-size: 11px; margin-left: auto; }
.wh-legend .hit { color: var(--wh-warn); }
.wh-legend .bar { color: var(--wh-accent); }
.wh-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.6rem; }
.wh-tile {
  font: inherit; text-align: left; cursor: pointer; min-width: 0; min-height: 180px;
  display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem;
  border-radius: var(--shape-m); border: 1px solid var(--wh-line);
  background: var(--wh-card); color: var(--wh-text);
}
.wh-tile.hot { border-color: color-mix(in srgb, var(--wh-warn) 35%, var(--wh-line)); }
.wh-tile[aria-pressed="true"] {
  border-color: var(--wh-accent); background: var(--wh-sel);
  box-shadow: 0 0 0 1px var(--wh-accent), 0 0 18px color-mix(in srgb, var(--wh-accent) 25%, transparent);
}
.wh-tile:focus-visible { outline: 2px solid var(--wh-accent); outline-offset: 2px; }
.wh-tile-top { display: flex; align-items: baseline; gap: 0.5rem; width: 100%; min-width: 0; }
.wh-tile-name { font-size: 14px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.wh-tile-n { margin-left: auto; font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 26px; font-weight: 600; line-height: 1.1; }
.wh-spark { display: flex; align-items: flex-end; gap: 2px; height: 34px; width: 100%; }
.wh-bar { flex: 1 1 0; background: var(--wh-dim); border-radius: 1px; }
.wh-bar.hot { background: var(--wh-accent); }
.wh-tile-hits, .wh-tile-tags { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.wh-tile-hits { min-height: 22px; }
.wh-hit {
  font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 11px;
  background: var(--wh-warn); color: var(--wh-warn-text); border-radius: 3px; padding: 2px 6px;
}
.wh-tag { font-size: 11px; color: var(--wh-muted); border: 1px solid var(--wh-line); border-radius: 3px; padding: 1px 6px; }
.wh-drill {
  border: 1px solid var(--wh-line); border-radius: var(--shape-m); background: var(--wh-card);
  padding: 0.6rem 0.9rem; display: flex; flex-direction: column; gap: 0.5rem; min-width: 0;
}
.wh-drill-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.7rem; }
.wh-drill-head .k { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .1em; color: var(--wh-accent); }
.wh-drill-head h3 { font-size: 16px; font-weight: 600; color: var(--wh-text); }
.wh-drill-head .n { font-family: ui-monospace, "IBM Plex Mono", monospace; color: var(--wh-muted); }
.wh-dash .river-row { border-bottom-color: var(--wh-line); }
.wh-dash .river-row:hover { background: var(--wh-sel); }
.wh-dash .river-row .card-title { color: var(--wh-text); }
.wh-dash .river-row .card-meta { color: var(--wh-muted); }
.wh-dash .river-row.watched { border-left-color: var(--wh-warn); }
.wh-dash .watch-badge { background: var(--wh-warn); color: var(--wh-warn-text); border-color: var(--wh-warn); }
.wh-dash a.cve-link { color: var(--wh-accent); }
@media (max-width: 999px) { .wh-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 599px) {
  .wh-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wh-tile { min-height: 0; }
  .wh-tile-n { font-size: 22px; }
  .wh-dash { padding: 0.5rem; }
  .wh-legend { margin-left: 0; }
}
@media (max-width: 339px) { .wh-tiles { grid-template-columns: minmax(0, 1fr); } }
/* WHY: the 我的關注 pill is a fifth pill; on a phone the row would no longer fit and would
   widen the page sideways, so it wraps (identical to before whenever the pills already fit). */
@media (max-width: 599px) { #tracker-pills { flex-wrap: wrap; min-width: 0; max-width: 100%; } }

/* Respect prefers-reduced-motion: disable animations and transitions */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
/* ── News workspace (html[data-mode="ws"]) ───────────────────────────────
   The home view: time chip + collapsible time panel, left type rail, source filter. Every
   element is hidden outside ws mode; colours come from the theme tokens only (the type chips
   reuse the --cat-* / --cra-* / --os-* pairs, so light, dark and the palettes all apply). */
#ws-rail, #ws-time-chip, #ws-time-panel, #ws-src { display: none; }
html[data-mode="ws"] #sidebar,
html[data-mode="ws"] #sidebar-scrim,
html[data-mode="ws"] #drawer-toggle,
html[data-mode="ws"] .hd-row2 { display: none !important; }
html[data-mode="ws"] #ws-time-chip { display: inline-flex; align-items: center; font-weight: 600; max-width: 100%; }
html[data-mode="ws"] #ws-src { display: inline-block; }
html[data-mode="ws"] #ws-rail { display: flex; }
html[data-mode="ws"] #ws-time-panel:not([hidden]) { display: block; }
#ws-time-chip[aria-expanded="true"] { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }
#ws-src {
  background: var(--surface-container); color: var(--on-surface);
  border: 1px solid var(--outline); border-radius: var(--shape-full);
  padding: 0.3rem 0.7rem; font: inherit; font-size: 13px; min-width: 0; max-width: 100%;
}
.ws-ty-all   { --ws-fill: var(--surface-container-highest); --ws-on: var(--on-surface); }
.ws-ty-vuln  { --ws-fill: var(--cat-vuln-fill);     --ws-on: var(--cat-vuln-on); }
.ws-ty-incident { --ws-fill: var(--cat-incident-fill); --ws-on: var(--cat-incident-on); }
.ws-ty-regulation { --ws-fill: var(--cat-law-fill);  --ws-on: var(--cat-law-on); }
.ws-ty-supply { --ws-fill: var(--cat-supply-fill);  --ws-on: var(--cat-supply-on); }
.ws-ty-focus { --ws-fill: var(--os-focus-fill);     --ws-on: var(--os-focus-on); }
.ws-ty-industry { --ws-fill: var(--cra-industry-fill); --ws-on: var(--cra-industry-on); }
.ws-ty-emerging { --ws-fill: var(--cat-tech-fill);  --ws-on: var(--cat-tech-on); }
.ws-ty-events { --ws-fill: var(--cra-event-fill);   --ws-on: var(--cra-event-on); }
.ws-ty-other { --ws-fill: var(--os-apple-fill);     --ws-on: var(--os-apple-on); }
.ws-ty-platform { --ws-fill: var(--os-apple-fill);     --ws-on: var(--os-apple-on); }
/* time panel */
#ws-time-panel {
  background: var(--surface-container-low); border-bottom: 1px solid var(--outline-variant);
  padding: 0.6rem 1.25rem; max-height: 50vh; overflow-y: auto; overflow-x: hidden;
  min-width: 0; max-width: 100%; box-sizing: border-box; flex-shrink: 0;
}
.ws-tp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-bottom: 0.5rem; min-width: 0; }
.ws-tp-label { font-size: 12px; color: var(--on-surface-variant); margin-right: 0.25rem; }
.ws-tp-btn {
  padding: 0.25rem 0.7rem; border-radius: var(--shape-full); border: 1px solid var(--outline);
  background: transparent; color: var(--on-surface-variant); font: inherit; font-size: 13px; cursor: pointer;
}
.ws-tp-btn:hover { background: var(--surface-container-high); }
.ws-tp-btn[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: transparent; font-weight: 600; }
#ws-time-panel input[type="date"] {
  background: var(--surface-container); color: var(--on-surface); border: 1px solid var(--outline);
  border-radius: var(--shape-s); padding: 0.2rem 0.4rem; font: inherit; font-size: 13px; min-width: 0; max-width: 100%;
}
html[data-theme="dark"] #ws-time-panel input[type="date"] { color-scheme: dark; }
.ws-chart {
  display: flex; align-items: flex-end; gap: 1px; height: 72px; width: 100%; overflow: hidden;
  border-bottom: 1px solid var(--outline); box-sizing: border-box;
}
.ws-bar {
  flex: 1 1 0; min-width: 0; padding: 0; border: none; border-radius: 2px 2px 0 0;
  background: var(--primary); opacity: 0.55; cursor: pointer;
}
.ws-bar:hover { opacity: 0.85; }
.ws-bar[aria-pressed="true"] { opacity: 1; outline: 2px solid var(--on-surface); outline-offset: 1px; }
.ws-bar:disabled { background: var(--outline-variant); opacity: 1; cursor: default; }
.ws-bar:focus-visible, .ws-tp-btn:focus-visible, .ws-item:focus-visible, .ws-strip-chip:focus-visible,
#ws-rail-toggle:focus-visible, #ws-time-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ws-chart-axis { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 11px; color: var(--on-surface-variant); }
/* left rail */
#ws-rail {
  flex: 0 0 176px; width: 176px; flex-direction: column; gap: 0.3rem; padding: 0.5rem;
  overflow-y: auto; overflow-x: hidden; min-width: 0; box-sizing: border-box;
  background: var(--surface-container-low); border-right: 1px solid var(--outline-variant);
}
@media (min-width: 1360px) {
  #ws-rail { flex: 0 0 200px; width: 200px; }
}
#ws-rail.collapsed { flex-basis: 48px; width: 48px; align-items: center; padding: 0.5rem 0.2rem; }
#ws-rail.collapsed #ws-rail-body, #ws-rail:not(.collapsed) #ws-rail-strip { display: none; }
#ws-rail-strip { display: flex; flex-direction: column; align-items: center; gap: 6px; }
#ws-rail-toggle {
  align-self: stretch; background: none; border: 1px solid var(--outline-variant); color: var(--on-surface-variant);
  border-radius: var(--shape-s); padding: 0.25rem 0.5rem; font: inherit; font-size: 13px; cursor: pointer; text-align: left;
}
#ws-rail.collapsed #ws-rail-toggle { align-self: center; text-align: center; padding: 0.25rem 0.4rem; }
#ws-rail-toggle:hover { background: var(--surface-container-high); }
.ws-sec-h { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); padding: 0.5rem 0.4rem 0.15rem; }
.ws-item {
  display: flex; align-items: center; gap: 0.5rem; width: 100%; min-width: 0; text-align: left;
  background: none; border: none; color: var(--on-surface); font: inherit; font-size: 13px;
  padding: 0.35rem 0.5rem; border-radius: var(--shape-s); cursor: pointer;
}
.ws-item:hover { background: var(--surface-container-high); }
.ws-item[aria-pressed="true"] { background: var(--primary-container); color: var(--on-primary-container); font-weight: 600; }
.ws-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--ws-fill); border: 1px solid var(--ws-on); }
.ws-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.ws-n { flex: none; font-variant-numeric: tabular-nums; color: var(--on-surface-variant); }
.ws-item[aria-pressed="true"] .ws-n { color: inherit; }
.ws-strip-chip {
  width: 32px; height: 32px; padding: 0; border-radius: var(--shape-s); cursor: pointer;
  border: 2px solid transparent; background: var(--ws-fill); box-shadow: inset 0 0 0 1px var(--ws-on);
}
.ws-strip-chip[aria-pressed="true"] { border-color: var(--on-surface); }
@media (max-width: 767px) {
  /* expanded rail floats over the list instead of squeezing it: no horizontal scroll at 375px */
  #ws-rail:not(.collapsed) {
    position: absolute; top: 0; bottom: 0; left: 0; z-index: 55; flex-basis: auto; width: min(260px, 80vw);
    background: var(--surface-container); box-shadow: var(--elev-3, 0 8px 24px rgba(0,0,0,.4));
  }
  #ws-time-panel { padding: 0.5rem 0.75rem; }
}
/* list & M5 dense cards / titles */
:root {
  --ws-ty-vuln: var(--cat-vuln-fill);         --ws-ty-vuln-on: var(--cat-vuln-on);
  --ws-ty-incident: var(--cat-incident-fill); --ws-ty-incident-on: var(--cat-incident-on);
  --ws-ty-regulation: var(--cat-law-fill);    --ws-ty-regulation-on: var(--cat-law-on);
  --ws-ty-supply: var(--cat-supply-fill);     --ws-ty-supply-on: var(--cat-supply-on);
  --ws-ty-focus: var(--os-focus-fill);        --ws-ty-focus-on: var(--os-focus-on);
  --ws-ty-industry: var(--cra-industry-fill); --ws-ty-industry-on: var(--cra-industry-on);
  --ws-ty-emerging: var(--cat-tech-fill);     --ws-ty-emerging-on: var(--cat-tech-on);
  --ws-ty-events: var(--cra-event-fill);       --ws-ty-events-on: var(--cra-event-on);
  --ws-ty-other: var(--os-apple-fill);        --ws-ty-other-on: var(--os-apple-on);
  --ws-type-vuln: var(--ws-ty-vuln);         --ws-chip-vuln: var(--ws-ty-vuln);
  --ws-type-incident: var(--ws-ty-incident); --ws-chip-incident: var(--ws-ty-incident);
  --ws-type-regulation: var(--ws-ty-regulation); --ws-chip-regulation: var(--ws-ty-regulation);
  --ws-type-supply: var(--ws-ty-supply);     --ws-chip-supply: var(--ws-ty-supply);
  --ws-type-focus: var(--ws-ty-focus);       --ws-chip-focus: var(--ws-ty-focus);
  --ws-type-industry: var(--ws-ty-industry); --ws-chip-industry: var(--ws-ty-industry);
  --ws-type-emerging: var(--ws-ty-emerging); --ws-chip-emerging: var(--ws-ty-emerging);
  --ws-type-events: var(--ws-ty-events);     --ws-chip-events: var(--ws-ty-events);
  --ws-type-other: var(--ws-ty-other);       --ws-chip-other: var(--ws-ty-other);
}
html[data-mode="ws"] #search-row { position: static; }
html[data-mode="ws"] .date-divider {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--surface);
  padding: 0.5rem 0 0.35rem;
  border-bottom: 1px solid var(--outline-variant);
  margin-top: 0.5rem;
  margin-bottom: 0.6rem;
}
.ws-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.4rem 0; font-size: 16px; font-weight: 600; }
.ws-head .ws-sub { font-weight: 400; color: var(--on-surface-variant); }
.ws-head .ws-partial { font-size: .8em; opacity: .8; }
.ws-sentinel { height: 1px; }
.ws-mode-toggle {
  margin-left: auto;
  display: inline-flex;
  border: 1px solid var(--outline-variant);
  border-radius: var(--shape-s, 6px);
  overflow: hidden;
  font-size: 13px;
  background: var(--surface-container-low);
}
.ws-mode-btn {
  border: none;
  background: none;
  color: var(--on-surface-variant);
  padding: 4px 12px;
  min-height: 28px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: background-color var(--motion-short, 0.15s), color var(--motion-short, 0.15s);
}
.ws-mode-btn:hover { background: var(--surface-container-high); color: var(--on-surface); }
.ws-mode-btn[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); font-weight: 600; }
.ws-mode-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.ws-date-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.ws-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 10px;
  margin-bottom: 0.5rem;
}
.ws-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  min-height: 140px;
  min-width: 0;
  box-sizing: border-box;
  background: var(--surface-container-lowest);
  border: 1px solid var(--outline-variant);
  border-radius: var(--shape-m, 8px);
  cursor: pointer;
  text-align: left;
  transition: transform var(--motion-short, 0.15s), box-shadow var(--motion-short, 0.15s);
}
.ws-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--elev-1);
}
.ws-card:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.ws-card.watched {
  border-left: 3px solid var(--primary);
}
.ws-card-top {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
}
.ws-type-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  padding: 1px 7px;
  border-radius: var(--shape-full, 999px);
  white-space: nowrap;
  flex-shrink: 0;
}
.ws-type-chip.ws-ty-vuln        { background: var(--ws-ty-vuln); color: var(--ws-ty-vuln-on); }
.ws-type-chip.ws-ty-incident    { background: var(--ws-ty-incident); color: var(--ws-ty-incident-on); }
.ws-type-chip.ws-ty-regulation  { background: var(--ws-ty-regulation); color: var(--ws-ty-regulation-on); }
.ws-type-chip.ws-ty-supply      { background: var(--ws-ty-supply); color: var(--ws-ty-supply-on); }
.ws-type-chip.ws-ty-focus       { background: var(--ws-ty-focus); color: var(--ws-ty-focus-on); }
.ws-type-chip.ws-ty-industry    { background: var(--ws-ty-industry); color: var(--ws-ty-industry-on); }
.ws-type-chip.ws-ty-emerging    { background: var(--ws-ty-emerging); color: var(--ws-ty-emerging-on); }
.ws-type-chip.ws-ty-events      { background: var(--ws-ty-events); color: var(--ws-ty-events-on); }
.ws-type-chip.ws-ty-other       { background: var(--ws-ty-other); color: var(--ws-ty-other-on); }
.ws-type-chip.ws-ty-platform    { background: var(--ws-ty-other); color: var(--ws-ty-other-on); }
.ws-star {
  color: var(--pal-warn, #b45309);
  font-size: 13px;
  line-height: 1;
  font-weight: bold;
}
html[data-theme="dark"] .ws-star {
  color: var(--pal-warn, #fbbf24);
}
.ws-card-title {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.45;
  color: var(--on-surface);
  margin: 0;
  overflow-wrap: anywhere;
}
.ws-card-summary {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--on-surface-variant);
  margin: 0;
  overflow-wrap: anywhere;
}
.ws-card-footer {
  margin-top: auto;
  font-size: 11px;
  color: var(--on-surface-variant);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ws-titles {
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
  border: 1px solid var(--outline-variant);
  border-radius: var(--shape-m, 8px);
  overflow: hidden;
  margin-bottom: 0.5rem;
}
.ws-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 36px;
  height: 36px;
  box-sizing: border-box;
  padding: 0 12px;
  border-bottom: 1px solid var(--outline-variant);
  background: none;
  color: var(--on-surface);
  cursor: pointer;
  text-align: left;
  font-size: 13px;
  min-width: 0;
  transition: background-color var(--motion-short, 0.15s);
}
.ws-title-row:last-child {
  border-bottom: none;
}
.ws-title-row:hover {
  background: var(--surface-container-high);
}
.ws-title-row:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}
.ws-title-row.watched {
  border-left: 3px solid var(--primary);
}
.ws-title-row .ws-type-chip {
  flex-shrink: 0;
}
.ws-title-row .ws-star {
  flex-shrink: 0;
  margin-left: -4px;
}
.ws-title-row .ws-title-text {
  flex: 1 1 0;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
  color: var(--on-surface);
}
.ws-title-row .ws-title-src {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--on-surface-variant);
  white-space: nowrap;
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ws-title-row .ws-title-date {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--on-surface-variant);
  white-space: nowrap;
}
@media (max-width: 599px) {
  .ws-title-row {
    padding: 0 8px;
    gap: 6px;
  }
  .ws-title-row .ws-title-src {
    max-width: 70px;
  }
}
html[data-mode="ws"] .card { min-width: 0; }
html[data-mode="ws"] .card-title { overflow-wrap: anywhere; }

/* ── Reader dialog (workspace immersive reader) ── */
.reader-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  box-sizing: border-box;
}
.reader-backdrop.hidden, #reader.hidden {
  display: none !important;
}
#reader {
  position: relative;
  width: 100%;
  max-width: 760px;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  border: 1px solid var(--outline-variant);
  border-radius: var(--shape-l, 12px);
  box-shadow: var(--elev-3, 0 20px 60px rgba(0,0,0,0.25));
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  max-height: 90vh;
  margin: auto;
  overflow: hidden;
  outline: none;
}
@media (max-width: 767px) {
  .reader-backdrop {
    padding: 0;
  }
  #reader {
    max-width: 100%;
    width: 100%;
    height: 100%;
    max-height: 100%;
    border-radius: 0;
    border: none;
  }
}
.reader-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--outline-variant);
  font-size: 13px;
  color: var(--on-surface-variant);
  background: var(--surface-container-low);
  flex-shrink: 0;
}
.reader-nav-btn {
  background: var(--surface-container);
  color: var(--on-surface);
  border: 1px solid var(--outline-variant);
  border-radius: var(--shape-s, 6px);
  padding: 4px 10px;
  min-height: 32px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background-color var(--motion-short, 0.15s);
}
.reader-nav-btn:hover:not(:disabled) {
  background: var(--surface-container-high);
}
.reader-nav-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.reader-pos-text {
  font-size: 13px;
  white-space: nowrap;
}
.reader-hint {
  font-size: 12px;
  color: var(--on-surface-variant);
  margin-left: 4px;
}
@media (max-width: 480px) {
  .reader-hint {
    display: none;
  }
  .reader-toolbar {
    padding: 8px 12px;
    gap: 6px;
  }
  .reader-nav-btn {
    padding: 4px 8px;
    font-size: 12px;
  }
}
.reader-spacer {
  flex: 1 1 0;
}
.reader-close-btn {
  background: none;
  border: none;
  color: var(--on-surface);
  cursor: pointer;
  font-size: 22px;
  line-height: 1;
  min-width: 36px;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--shape-s, 6px);
  padding: 0;
}
.reader-close-btn:hover {
  background: var(--surface-container-high);
}
.reader-body {
  padding: 24px 28px 28px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-sizing: border-box;
}
@media (max-width: 767px) {
  .reader-body {
    padding: 16px 16px 24px;
  }
}
.reader-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  font-size: 12px;
  color: var(--on-surface-variant);
}
.reader-title {
  margin: 0;
  font-size: 22px;
  line-height: 1.4;
  font-weight: 600;
  color: var(--on-surface);
  overflow-wrap: anywhere;
}
.reader-summary {
  margin: 0;
  font-size: 16px;
  line-height: 1.85;
  max-width: 65ch;
  color: var(--on-surface);
  overflow-wrap: anywhere;
}
.reader-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.reader-tag {
  font-size: 12px;
  padding: 2px 9px;
  border-radius: var(--shape-full, 999px);
  border: 1px solid var(--outline-variant);
  background: var(--surface-container);
  color: var(--on-surface-variant);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
.reader-tag:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.reader-orig {
  margin-top: 4px;
}
.reader-orig-link {
  font-size: 14px;
  color: var(--primary);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.reader-orig-link:hover {
  text-decoration: underline;
}
.reader-same {
  border-top: 1px solid var(--outline-variant);
  padding-top: 14px;
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.reader-same-h {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--on-surface-variant);
}
.reader-same-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.reader-same-item {
  font-size: 13px;
  color: var(--on-surface);
  background: none;
  border: none;
  padding: 6px 8px;
  border-radius: var(--shape-s, 4px);
  text-align: left;
  cursor: pointer;
  display: block;
  text-decoration: none;
  line-height: 1.45;
  font-family: inherit;
  transition: background-color var(--motion-short, 0.15s);
  overflow-wrap: anywhere;
}
.reader-same-item:hover, .reader-same-item:focus-visible {
  background: var(--surface-container-high);
  color: var(--primary);
}

/* ── Read mark for cards and title rows ── */
.ws-card.is-read .ws-card-title,
.ws-title-row.is-read .ws-title-text {
  color: var(--on-surface-variant);
}

/* ── My pages (版面分頁), toolbar, filter panel, layouts, pager, tour ── */
#pg-bar { display: none; align-items: center; gap: 6px; margin: 0 0 8px; border-bottom: 1px solid var(--outline-variant); }
html[data-mode="ws"] #pg-bar { display: flex; }
.pg-tabs { display: flex; flex: 1; min-width: 0; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.pg-tab, .pg-add {
  flex: none; border: none; background: none; cursor: pointer; font: inherit; font-size: 14px;
  padding: 8px 12px; color: var(--on-surface-variant); border-bottom: 2px solid transparent; white-space: nowrap;
}
.pg-tab:hover, .pg-add:hover { color: var(--on-surface); background: var(--surface-container-high); }
.pg-tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.pg-tab.pg-transient { font-style: normal; cursor: default; }
.pg-add { color: var(--primary); }
.pg-tab:focus-visible, .pg-add:focus-visible, .pg-menu-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.pg-menu-btn {
  flex: none; border: 1px solid var(--outline-variant); background: none; color: var(--on-surface); cursor: pointer;
