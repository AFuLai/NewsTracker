<script>
/* TRACKER-PREFS:BEGIN */
// Pure prefs layer: ONE storage key `tracker_prefs` = {"v":2,"values":{<legacy key>: <string>}}, migrated
// from the ten legacy keys. No DOM, no storage global: the storage object (getItem/setItem, may throw)
// is passed in as an argument.
const TrackerPrefs = (() => {
  const LEGACY_KEYS = ['tracker_lang', 'tracker_theme', 'tracker_skin', 'tracker_palette', 'tracker_nav',
    'tracker_view', 'tracker_watch', 'tracker_watch_hub', 'tracker_watch_seen', 'tracker_lib_group'];
  const EXTRA_KEYS = ['tracker_ws', 'tracker_read', 'tracker_pages', 'tracker_tour'];
  const KEY = 'tracker_prefs';
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  function load(storage) {
    const values = {};
    let parsed = null;
    try {
      const raw = storage.getItem(KEY);
      if (typeof raw === 'string') parsed = JSON.parse(raw);
    } catch (e) { parsed = null; }
    if (parsed && typeof parsed === 'object' && parsed.v === 2 &&
        parsed.values && typeof parsed.values === 'object' && !Array.isArray(parsed.values)) {
      LEGACY_KEYS.concat(EXTRA_KEYS).forEach(k => {
        if (has(parsed.values, k) && typeof parsed.values[k] === 'string') values[k] = parsed.values[k];
      });
      return { v: 2, values };
    }
    LEGACY_KEYS.forEach(k => {
      try {
        const x = storage.getItem(k);
        if (typeof x === 'string') values[k] = x;
      } catch (e) {}
    });
    return { v: 2, values };
  }
  function get(prefs, key) {
    if (LEGACY_KEYS.indexOf(key) < 0 && EXTRA_KEYS.indexOf(key) < 0) return null;
    const vs = prefs && prefs.values;
    return (vs && has(vs, key) && typeof vs[key] === 'string') ? vs[key] : null;

      const s = new Set(watchPrefs.on);
      if (cb.checked) s.add(r.id); else s.delete(r.id);
      watchPrefs = { v: 1, on: cleanWatchOn([...s]), kw: watchPrefs.kw };
      watchChanged();
    });
    const sp = document.createElement('span');
    lab.appendChild(cb); lab.appendChild(sp);
    box.appendChild(lab);
  });
  const input = document.getElementById('watch-kw-input');

    const v = input.value.trim();
    if (!v) return;
    watchPrefs = { v: 1, on: watchPrefs.on, kw: cleanWatchKw(watchPrefs.kw.concat([v])) };
    input.value = '';
    watchChanged();
    input.focus();
  };
  document.getElementById('watch-kw-add').addEventListener('click', addKw);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addKw(); } });
  document.getElementById('watch-reset').addEventListener('click', () => {
    watchPrefs = defaultWatch();
    watchChanged();
  });
  panel.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const f = [...panel.querySelectorAll('button, input, summary')].filter(el => el.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }

function renderWatchChips() {

      watchPrefs = { v: 1, on: watchPrefs.on, kw: watchPrefs.kw.filter(z => z !== k) };

function parsePalette(str) {
  return (typeof str === 'string' && PALETTES.some(p => p.id === str)) ? str : null;
}
let palettePref = null;   // the applied palette id (in-memory; authoritative if localStorage throws)
function applyPalette(id) {
  palettePref = parsePalette(id);
  const root = document.documentElement;
  if (palettePref) root.dataset.palette = palettePref; else delete root.dataset.palette;
  updatePaletteUI();
}
// Reader's choice: apply + persist (default option removes the key).
function setPalette(id) {
  applyPalette(id);
  if (!isPreviewMode()) {
    try {
      if (palettePref) prefSet('tracker_palette', palettePref);
      else prefSet('tracker_palette', null);
    } catch (e) {}
  }
  syncHash();
}
// Default dark / light option: clears the palette, sets data-theme, persists tracker_theme.
function setDefaultTheme(mode) {
  const m = mode === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = m;
  if (!isPreviewMode()) { try { prefSet('tracker_theme', m); } catch (e) {} }
  setPalette('');
}
function initPalette() {
  let raw = null;
  try { raw = prefGet('tracker_palette'); } catch (e) {}
  applyPalette(parsePalette(raw));
}

// Matches across title/summary/tags in BOTH languages so a query works
// regardless of the display language. Space-separated terms are ANDed.
function searchHaystack(a) {
  // Search only what is DISPLAYED in the current language — artTitle/artSummary/
  // artTags return the en fields in EN mode, the zh fields in 中文 mode (with
  // fallback). So a 中文 search never matches a hidden English title, and vice-versa.
  const sc = state.searchScope;
  const parts = [];
  if (sc.title) parts.push(artTitle(a));
  if (sc.body)  parts.push(artSummary(a));
  if (sc.tags)  parts.push(artTags(a).join(' '));
  return parts.join(' ').toLowerCase();
}
// Match one term against the haystack on a WORD boundary (alphanumeric edges),
// so a short acronym like "CRA" matches "EU CRA"/"(CRA)" but NOT a fragment
// inside a word like "crash". CJK has no a-z0-9 neighbours, so CJK terms still
// match as substrings (e.g. 資安 inside 網路資安). Boundary chars are [a-z0-9];
// the haystack is already lower-cased.
function termMatches(hay, term) {
  const esc = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(?:^|[^a-z0-9])' + esc + '(?:[^a-z0-9]|$)');
  return re.test(hay);
}
function matchesQuery(a, q) {
  if (!q) return true;
  const hay = searchHaystack(a);
  return q.toLowerCase().split(/\s+/).filter(Boolean)
          .every(term => termMatches(hay, term));
}

// Toggle a search-scope field (標題/內文/標籤). Keeps at least one active.
function toggleScope(name, btn) {
  const sc = state.searchScope;

  if (sc[name] && activeCount === 1) return;   // never leave all scopes off
  sc[name] = !sc[name];
  btn.classList.toggle('active', sc[name]);
  btn.setAttribute('aria-pressed', sc[name] ? 'true' : 'false');
  if (state.searchQuery && state.search) refreshSearchView();
  else if (state.wsActive && state.searchQuery) renderWorkspace();
}

// Load every year/month manifest + every day file for the current tracker, so
// search can see the whole site. Cached via the loaded* sets → instant after 1st.
async function ensureAllLoaded() {
  const mf = currentManifest();
  if (!mf) return;
  for (const y of (mf.years || [])) {
    await pLoadYear(y);
    const ym = getYearManifest(y);
    for (const m of ((ym && ym.months) || [])) await pLoadMonth(m);
  }
  const files = new Set();
  for (const y of (mf.years || [])) {
    const ym = getYearManifest(y);
    for (const m of ((ym && ym.months) || []))
      for (const d of manifestDatesForMonth(m)) files.add(d.file);
  }
  await Promise.all([...files].map(f => pLoadDay(f)));
}

// Rebuilds the whole view from window.TRACKER_DAYS (cheap; the day files are already loaded).
// `focusFn` returns the control to re-focus after the rebuild.
function renderWatchHub(focusFn) {
  if (!state.hubActive) return;
  const main = document.getElementById('main-content');
  const keepTop = main.scrollTop;
  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('no-data').classList.add('hidden');
  Array.from(main.children).forEach(c => {
    if (c.id !== 'loading-msg' && c.id !== 'no-data' && c.id !== 'search-row' && c.id !== 'pg-bar') c.remove();
  });
  const root = whEl('div', 'wh');
  root.appendChild(hubHeaderEl());
  if (!hubReady) {
    const ld = whEl('div', 'wh-note wh-loading', t('hubLoading')(hubPrefs.hw));
    ld.setAttribute('role', 'status');
    root.appendChild(ld);
    main.appendChild(root);
    syncHash();
    return;
  }
  const col = hubCollect(hubPrefs.hw);
  if (state.searchQuery) {   // search replaces the sections / tiles until it is cleared
    const hits = hubSearch(col.list, state.searchQuery);
    root.appendChild(whEl('div', 'wh-sub', t('hubSearchCount')(hits.length)));
    if (hits.length) {
      const rl = whEl('div', 'river-list');
      hits.forEach(a => rl.appendChild(buildRiverRow(a)));
      root.appendChild(rl);
    } else {
      root.appendChild(whEl('div', 'wh-note', t('noResults')(state.searchQuery)));
    }
    main.appendChild(root);
    document.getElementById('article-count').textContent = hits.length;
    syncHash();
    main.scrollTop = keepTop;
    if (typeof focusFn === 'function') { const el = focusFn(); if (el) el.focus(); }
    return;
  }
  const model = buildHubModel(hubPrefs.hw, watchPrefs);
  root.appendChild(hubBriefEl(hubBrief(col.list, col.today)));
  const vis = hubPlat.size ? col.list.filter(a => articleTags(a).some(g => hubPlat.has(g))) : col.list;
  if (hubPrefs.hv === 'tiles') {
    root.appendChild(hubTilesEl(vis, model, col.today, col.list));
  } else {
    if (model.platforms.length || hubPlat.size) root.appendChild(hubPlatEl(model));
    root.appendChild(hubSectionsEl(vis, model));
  }
  main.appendChild(root);
  document.getElementById('article-count').textContent = vis.length;
  syncHash();
  main.scrollTop = keepTop;
  if (typeof focusFn === 'function') { const el = focusFn(); if (el) el.focus(); }
  if (hubSeenDue) hubFlushSeen();
}

// Recompute which dates (and how many articles) match the query, honouring the
// current tracker + category filter. This is what the date menu is rebuilt from.
function buildSearchIndex() {
  const q = state.searchQuery.toLowerCase();
  const counts = {}; const years = new Set();
  const days = window.TRACKER_DAYS || {};
  for (const date in days) {
    let n = 0;
    for (const a of days[date]) {
      if (!itemBelongsToTracker(a, state.currentTracker)) continue;
      if (state.filterCats.size &&
          !state.filterCats.has(effectiveCat(a, state.currentTracker))) continue;
      if (matchesQuery(a, q)) n++;
    }
    if (n > 0) { counts[date] = n; years.add(date.slice(0, 4)); }
  }
  state.search = { countByDate: counts, years: [...years].sort().reverse() };
}

function searchDatesInYear(year) {
  return Object.keys(state.search.countByDate)
    .filter(d => d.slice(0, 4) === year).sort().reverse();
}

async function runSearch() {
  const box = document.getElementById('search-box');
  const q = (box.value || '').trim();
  document.getElementById('search-clear').style.display = q ? 'inline' : 'none';
  if (!q) { clearSearch(); return; }
  state.searchQuery = q;
  if (state.hubActive) { renderWatchHub(); return; }   // hub: search the loaded window of all trackers
  if (state.wsActive) { renderWorkspace(); return; }   // workspace: filter the current range
  showMsg(t('searching'));
  await ensureAllLoaded();
  if (state.searchQuery !== q) return;   // superseded by a newer keystroke
  buildSearchIndex();
  const years = state.search.years;
  buildYearPills(years);
  if (!years.length) {
    document.getElementById('month-grid').innerHTML = '';
    hideDateList();
    state.currentYear = null;
    renderArticles([]);
    return;
  }
  selectYear(years[0]);   // search-aware: month grid + this year's matches
}

function clearSearch() {
  if (!state.searchQuery && !state.search) {  // already idle: just restore box
    document.getElementById('search-clear').style.display = 'none';
  }
  state.searchQuery = '';
  state.search = null;
  const box = document.getElementById('search-box');
  if (box) box.value = '';
  document.getElementById('search-clear').style.display = 'none';
  if (state.hubActive) { renderWatchHub(); return; }
  if (state.wsActive) { renderWorkspace(); return; }
  const mf = currentManifest();
  if (!mf) return;
  buildYearPills(mf.years || []);
  if (mf.years && mf.years[0]) selectYear(mf.years[0]);
}

// Cat-filter changed while searching → recompute matches + refresh the menu.
function refreshSearchView() {
  buildSearchIndex();
  const years = state.search.years;
  buildYearPills(years);
  if (!years.length) {
    document.getElementById('month-grid').innerHTML = '';
    hideDateList(); renderArticles([]); return;
  }
  selectYear(years.includes(state.currentYear) ? state.currentYear : years[0]);
}

// ── Multi-tracker helpers ─────────────────────────────
function getTrackers() {
  if (typeof TRACKER_MANIFESTS !== 'undefined') return TRACKER_MANIFESTS;
  // Back-compat: synthesize a single tracker from legacy TRACKER_MANIFEST.
  if (typeof TRACKER_MANIFEST !== 'undefined') {
    return { security: TRACKER_MANIFEST };
  }
  return null;
}
function currentManifest() {
  const all = getTrackers();
  return all ? all[state.currentTracker] : null;
}
function itemBelongsToTracker(item, tracker) {
  if (item.trackers && Array.isArray(item.trackers) && item.trackers.length) {
    return item.trackers.includes(tracker);
  }
  // Legacy items without trackers field are implicitly "security".
  return tracker === 'security';
}

// Cross-belonging articles keep their *home* tracker's category (a single
// `category` field). When viewed under a different tracker that category is
// not one of that tracker's pills, so it would only ever surface under 全部.
// CAT_MAP remaps a foreign category onto the nearest local subcategory so the
// item is findable (and colour-coded) under a real pill of the viewing tracker.
const CAT_MAP = {
  security: {
    // os platforms keep their own category here: they surface in the second
    // pill row (SECONDARY_PILLS.security) instead of folding into 漏洞與威脅情報
    '重點關注':'前瞻技術',
    // eu_cra → security
    '法令更新':'法規與標準', '調和標準':'法規與標準', '合規指引':'法規與標準',
    '亞太對應':'法規與標準', '開源影響':'供應鏈與開源安全',
    '產業動態':'重大事件', '研討活動':'前瞻技術',
  },
  eu_cra: {
    // security → eu_cra
    '法規與標準':'法令更新', '供應鏈與開源安全':'開源影響', '漏洞與威脅情報':'合規指引',
    '前瞻技術':'產業動態', '重大事件':'產業動態',
    // os → eu_cra
    'Linux':'開源影響', 'Windows':'產業動態', 'Apple':'產業動態',
    'Android':'產業動態', '重點關注':'產業動態',
  },
  os: {
    // no platform signal from a foreign article → cross-platform watchlist
    // 漏洞與威脅情報 keeps its own category here (second pill row, SECONDARY_PILLS.os)
    '法規與標準':'重點關注', '供應鏈與開源安全':'重點關注',
    '前瞻技術':'重點關注', '重大事件':'重點關注',
    '法令更新':'重點關注', '調和標準':'重點關注', '合規指引':'重點關注',
    '開源影響':'重點關注', '產業動態':'重點關注', '亞太對應':'重點關注', '研討活動':'重點關注',
  },
};

// Second pill row per tracker: categories that are not in the tracker's manifest
// `categories` (first row) but are kept as their own category via CAT_MAP above.
// They share state.filterCats with the first row (OR semantics). eu_cra has none.
const SECONDARY_PILLS = {
  security: { label: '平台', cats: ['Linux','Windows','Apple','Android'] },
  os: { label: '類型', cats: ['漏洞與威脅情報'] },
};

// The category an article should display/filter under for the given tracker.
function effectiveCat(a, tracker) {
  const cat = a.category;
  const mf = (getTrackers() || {})[tracker];
  const own = (mf && mf.categories) || [];
  if (own.includes(cat)) return cat;      // native category → unchanged
  const m = CAT_MAP[tracker];
  return (m && m[cat]) || cat;            // remap foreign; else leave as-is
}

// ── Sidebar toggle ────────────────────────────────────
// ── Floating navigation drawer (all widths) ───────────────────────────
// The sidebar floats over the content and collapses off-canvas, leaving the
// header hamburger as the "small button". Modal (scrim + inert) only on the
// compact breakpoint; dismissible elsewhere so content stays interactive.
function isCompact() { return matchMedia('(max-width: 599px)').matches; }
let navReturnFocus = null;
function navFocusables() {
  const sidebar = document.getElementById('sidebar');
  return [...sidebar.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
}
function openNav(persist) {
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('sidebar-scrim');
  const ham = document.getElementById('drawer-toggle');
  const main = document.getElementById('main-content');
  navReturnFocus = document.activeElement;
  sidebar.classList.add('nav-open');
  if (ham) ham.setAttribute('aria-expanded', 'true');
  if (isCompact()) { if (scrim) scrim.classList.add('open'); main.inert = true; }
  if (persist) { try { prefSet('tracker_nav', 'open'); } catch (e) {} }
  const first = navFocusables()[0];
  if (first) first.focus();
}
function closeNav(persist) {
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('sidebar-scrim');
  const ham = document.getElementById('drawer-toggle');
  const main = document.getElementById('main-content');
  const wasOpen = sidebar.classList.contains('nav-open');
  sidebar.classList.remove('nav-open');
  if (scrim) scrim.classList.remove('open');
  if (ham) ham.setAttribute('aria-expanded', 'false');
  main.inert = false;
  if (persist) { try { prefSet('tracker_nav', 'collapsed'); } catch (e) {} }
  if (wasOpen) {
    if (navReturnFocus && document.body.contains(navReturnFocus) && navReturnFocus.offsetParent !== null) navReturnFocus.focus();
    else if (ham) ham.focus();
  }
  navReturnFocus = null;
}
function toggleNav() {
  if (document.getElementById('sidebar').classList.contains('nav-open')) closeNav(true);
  else openNav(true);
}

// ── Boot ─────────────────────────────────────────────
function init() {
  // Load persisted preferences (lang, theme, skin)
  try {
    const saved_lang = prefGet('tracker_lang');
    if (saved_lang === 'en' || saved_lang === 'zh') state.lang = saved_lang;
  } catch (e) {}
  try {
    const saved_theme = prefGet('tracker_theme');
    if (saved_theme === 'light' || saved_theme === 'dark') {
      document.documentElement.dataset.theme = saved_theme;
    } else if (matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.dataset.theme = 'dark';
    } else {
      document.documentElement.dataset.theme = 'light';
    }
    // Initialize theme icon display (dark mode → show dark icon)
    const isDark = document.documentElement.dataset.theme === 'dark';
    const lightIcon = document.getElementById('theme-icon-light');
    const darkIcon = document.getElementById('theme-icon-dark');
    if (lightIcon && darkIcon) {
      lightIcon.style.display = isDark ? 'none' : 'inline-block';
      darkIcon.style.display = isDark ? 'inline-block' : 'none';
    }
  } catch (e) {}
  try {
    // One theme system: the page always runs md3; the stored tracker_skin is no longer applied.
    // (A hash s=classic is still honoured for that page view in applyHashRestore.)
    document.documentElement.dataset.skin = 'md3';
  } catch (e) {}
  // Floating nav: default open on desktop, collapsed on compact; persisted.
  // Set the class directly (no openNav — avoid stealing focus on boot).
  try {
    const navPref = prefGet('tracker_nav');
    const startOpen = navPref !== 'collapsed' && !isCompact();
    const sb = document.getElementById('sidebar');
    const ham = document.getElementById('drawer-toggle');
    if (sb && startOpen) sb.classList.add('nav-open');
    if (ham) ham.setAttribute('aria-expanded', String(!!startOpen));
  } catch (e) {}
  const all = getTrackers();
  if (!all) {
    showMsg(t('noManifest'));
    return;
  }
  const names = Object.keys(all);
  if (!names.length) {
    showMsg(t('noTracker')); return;
  }
  buildTrackerPills(names);
  initWatch();  // localStorage tracker_watch → watchPrefs
  initView();   // localStorage tracker_view → viewPrefs; the hash (below) may override it
  initPalette();   // localStorage tracker_palette → data-palette; a hash pal= (below) may override it
  initHubPrefs();  // localStorage tracker_watch_hub → hubPrefs; a hash hv= / hw= (below) may override it
  ws.mode = wsLoadMode();
  pgLoad();        // localStorage tracker_pages → pgState (the user's own pages)
  if (!applyHashRestore()) selectWorkspace();   // deep-link wins; no / unknown hash → the news workspace (the home view; it was the 總覽 hub, which replaced the old default tracker wall)
  applyLang();   // sync all static labels + lang button to the active language
}

// ── Tracker selection ─────────────────────────────────
function selectTracker(name) {
  const all = getTrackers();
  if (!all || !all[name]) return;
  state.libActive = false;   // leaving the CRA library mode
  leaveWorkspace();          // leaving the news workspace (no-op otherwise)
  leaveHub();                // leaving the 我的關注 hub (restores the search row)

// ── loading ──
// Year manifests of every tracker; → { tks, monthsOf: {tracker: ['YYYY-MM', ...] sorted} }.
async function wsLoadManifests() {
  const all = getTrackers() || {};
  const tks = wsTrackerNames();
  const monthsOf = {};
  for (const tk of tks) {
    const ms = [];
    for (const y of (all[tk].years || [])) {
      await new Promise(r => loadYearManifest(y, r, tk));
      const ym = getYearManifest(y, tk);
      ((ym && ym.months) || []).forEach(m => ms.push(m));
    }

  }

// Load the data a range needs. today / 7d / 30d / 90d: ensureHubLoaded(N). Any other range: the
// year + month manifests and the day files of every tracker whose dates fall in the range.
async function wsLoadRange(key, onProgress) {
  if (WS_QUICK[key]) { await ensureHubLoaded(WS_QUICK[key], null, onProgress); return; }
  const { tks, monthsOf } = await wsLoadManifests();
  let newest = '';
  for (const tk of tks) {
    const ms = monthsOf[tk];
    if (!ms.length) continue;
    await new Promise(r => loadMonthManifest(ms[ms.length - 1], r, tk));
    for (const d of manifestDatesForMonth(ms[ms.length - 1], tk)) if (d.date > newest) newest = d.date;
  }
  if (!newest) return;

  for (const tk of tks) {
    for (const m of monthsOf[tk]) {
      if (m < rg.from.slice(0, 7) || m > rg.to.slice(0, 7)) continue;
      await new Promise(r => loadMonthManifest(m, r, tk));
      for (const d of manifestDatesForMonth(m, tk)) if (d.date >= rg.from && d.date <= rg.to) files.add(d.file);

      e.subs.push(onProgress);
      if (e.prog) { const p = e.prog; Promise.resolve().then(() => onProgress(p)); }
    }
    return e.p;
  }
  e = { done: false, subs: [], prog: null };
  if (typeof onProgress === 'function' && WS_QUICK[key]) e.subs.push(onProgress);
  const fan = p => { e.prog = p; e.subs.slice().forEach(f => f(p)); };
  e.p = Promise.resolve().then(() => wsLoadRange(key, WS_QUICK[key] ? fan : undefined)).catch(() => {}).then(() => { e.done = true; e.subs = []; });

// ── filters ──

// ── time panel: quick picks, custom range, year archive, per-day chart ──
function wsBuildPanel(newest) {
  const panel = document.getElementById('ws-time-panel');
  if (!panel) return;
  const oldF = panel.querySelector('#ws-from'), oldT = panel.querySelector('#ws-to');
  const keepF = oldF && oldF.dataset.dirty ? oldF.value : null;
  const keepT = oldT && oldT.dataset.dirty ? oldT.value : null;

  // custom from / to

  const mk = (id, label, val, keep) => {

    const inp = wsEl('input');

    inp.value = keep !== null ? keep : val;
    if (keep !== null) inp.dataset.dirty = '1';
    inp.addEventListener('input', () => { inp.dataset.dirty = '1'; });
    lb.appendChild(inp);
    c.appendChild(lb);
    return inp;
  };
  const fi = mk('ws-from', t('wsFrom'), cur.from, keepF);
  const ti = mk('ws-to', t('wsTo'), cur.to, keepT);
  const ap = btn(t('wsApply'), false, 'apply', () => {
    const iso = /^\d{4}-\d{2}-\d{2}$/;
    if (!iso.test(fi.value) || !iso.test(ti.value)) return;
    const a = fi.value <= ti.value ? fi.value : ti.value, b = fi.value <= ti.value ? ti.value : fi.value;
    wsSetRange('c' + a + '_' + b, 'apply');
  });

    const yr = row(t('wsArchive'));

      const n = wsYearDays(y);
      yr.appendChild(btn(t('wsYearName')(y) + ' · ' + t('wsDays')(n), ws.range === 'y' + y, 'y:' + y, () => wsSetRange('y' + y, 'y:' + y)));
    });

  const start = cr.from > TrackerStore.shiftDate(end, -89) ? cr.from : TrackerStore.shiftDate(end, -89);
  row(t('wsChart'));

function wsDraw(keep) {
  if (!state.wsActive) return;
  // keep (a redraw caused by loading progress): the user must not move - scroll, focus and rendered count survive
  const keepY = keep ? window.scrollY : 0;
  if (keep && !ws.focusKey) {
    const ae = document.activeElement;
    if (ae && ae.dataset && ae.dataset.ws) ws.focusKey = ae.dataset.ws;
  }
  if (wsObserver) { wsObserver.disconnect(); wsObserver = null; }
  const main = document.getElementById('main-content');
  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('no-data').classList.add('hidden');
  Array.from(main.children).forEach(c => {
    if (c.id !== 'loading-msg' && c.id !== 'no-data' && c.id !== 'search-row' && c.id !== 'pg-bar') c.remove();
  });
  const days = window.TRACKER_DAYS || {};
  const newest = TrackerStore.newestDate(days);
  ws.newest = newest;
  const rg = TrackerStore.rangeOf(ws.range, newest);
  const base = wsBase(TrackerStore.collect(days, { fromDate: rg.from, toDate: rg.to }));
  const shown = TrackerPages.sort(TrackerStore.sortNewest(wsFacet(base)), ws.f.sort, PG_HELP);
  ws.shown = shown;
  if (!keep) pgCapture();
  pgBuildBar();
  document.getElementById('article-count').textContent = shown.length;
  wsSyncChrome();
  wsBuildRail(base);
  wsBuildPanel(newest);
  syncHash();   // keep the URL in step with the current view
  if (pendingOpenId !== null) setTimeout(openPendingArticle, 0);   // `a=` permalink: open once this render has finished
  if (!shown.length) {
    const nd = document.getElementById('no-data');
    // keep the toolbar and chips reachable, or a filter that empties the list could not be undone
    const tbFrag = document.createDocumentFragment();
    tbFrag.appendChild(pgToolbarEl());
    const ch0 = pgChipsEl(); if (ch0) tbFrag.appendChild(ch0);
    main.insertBefore(tbFrag, nd);
    nd.classList.remove('hidden');
    nd.textContent = state.searchQuery ? L().ui.noResults(state.searchQuery)
      : (TrackerPages.filterCount(ws.f) ? pt('empty') : t('noData'));
    wsRefocus();
    return;
  }
  const frag = document.createDocumentFragment();
  const head = wsEl('h2', 'ws-head');
  head.appendChild(wsEl('span', '', wsRangeLabel(ws.range)));
  head.appendChild(wsEl('span', 'ws-sub', '· ' + t('tlCount')(shown.length)));
  if (ws.partial) head.appendChild(wsEl('span', 'ws-sub ws-partial', t('wsPartial')(ws.partial.done, ws.partial.total)));

  frag.appendChild(head);
  frag.appendChild(pgToolbarEl());
  const chips = pgChipsEl(); if (chips) frag.appendChild(chips);
  // paging: size > 0 shows one page of `shown` with a pager above and below
  const paged = TrackerPages.slice(shown, ws.size, ws.pn);
  ws.pn = paged.pn;
  const list = paged.items;
  if (ws.size > 0 && paged.pages > 1) frag.appendChild(pgPagerEl(paged));
  const flat = { table: pgRenderTable, magazine: pgRenderMagazine, bytype: pgRenderBoard }[ws.mode];
  if (flat) {
    // not date-grouped; endless mode grows by WS_BATCH with a button (the table can hold thousands)
    const endless = !(ws.size > 0);
    const upto = endless ? Math.max(ws.rendered, WS_BATCH) : list.length;
    frag.appendChild(flat(endless && ws.mode !== 'bytype' ? list.slice(0, upto) : list));
    if (endless && ws.mode !== 'bytype' && list.length > upto) {
      const more = wsEl('button', 'pg-more pg-more-wide', pt('more')(Math.min(WS_BATCH, list.length - upto)));
      more.type = 'button';
      more.dataset.ws = 'more';
      more.onclick = () => { ws.rendered = upto + WS_BATCH; ws.focusKey = 'more'; wsDraw(true); };
      frag.appendChild(more);
    } else ws.rendered = upto;
    if (ws.size > 0 && paged.pages > 1) frag.appendChild(pgPagerEl(paged));
    main.appendChild(frag);
    if (keep) window.scrollTo(0, keepY);
    wsRefocus();
    return;
  }

  const counts = new Map();
  shown.forEach(a => counts.set(a._date, (counts.get(a._date) || 0) + 1));
  const isTitles = ws.mode === 'titles';
  const isCompact = ws.mode === 'compact';
  const sentinel = wsEl('div', 'ws-sentinel');
  sentinel.setAttribute('aria-hidden', 'true');
  frag.appendChild(sentinel);
  let curDate = null, curBox = null, count = 0;
  // Append shown[count .. count+n): a date group split across batches keeps appending into the same box.
  const appendBatch = n => {
    const end = Math.min(list.length, count + n);
    for (; count < end; count++) {
      const a = list[count];
      if (a._date !== curDate) {
        curDate = a._date;
        const group = wsEl('section', 'ws-date-group');
        group.appendChild(wsEl('div', 'date-divider', curDate + ' · ' + t('tlCount')(counts.get(curDate))));
        curBox = wsEl('div', isTitles ? 'ws-titles' : (isCompact ? 'ws-grid pg-compact' : 'ws-grid'));
        group.appendChild(curBox);
        sentinel.parentNode.insertBefore(group, sentinel);
      }
      curBox.appendChild(isTitles ? buildWsTitleRow(a) : buildWsCard(a));
    }
    ws.rendered = count;
  };

  appendBatch(lazy ? Math.max(ws.rendered, WS_BATCH) : list.length);
  if (ws.size > 0 && paged.pages > 1) frag.appendChild(pgPagerEl(paged));
  main.appendChild(frag);

    if (count >= list.length) sentinel.remove();
    else {
      wsObserver = new IntersectionObserver(entries => {
        if (!sentinel.isConnected) { wsObserver.disconnect(); wsObserver = null; return; }   // another view replaced the list
        if (!entries.some(e => e.isIntersecting)) return;
        appendBatch(WS_BATCH);
        if (count >= list.length) { wsObserver.disconnect(); wsObserver = null; sentinel.remove(); return; }
        wsObserver.unobserve(sentinel); wsObserver.observe(sentinel);   // re-check: still within range after the append?
      }, { rootMargin: '800px 0px' });
      wsObserver.observe(sentinel);
    }
  }

  wsRefocus();
}
function renderWorkspace() {
  if (!state.wsActive) return;
  const seq = ++ws.seq;
  ws.rendered = WS_BATCH;
  ws.partial = null;
  wsSyncChrome();
  const key = ws.range;
  const hit = ws.loads.get(key);
  if (hit && hit.done) { wsDraw(); return; }
  showMsg(t('wsLoading')(wsRangeLabel(key)));
  let drew = false;   // a progress draw happened: later draws must not move the user
  const onProg = p => {
    if (seq !== ws.seq || !state.wsActive) return;   // a late load must not draw over another view (or a newer range)
    if (p.done >= p.total) return;                   // the completion draw below covers it
    ws.partial = { done: p.done, total: p.total };
    wsDraw(drew);
    drew = true;
  };
  wsEnsure(key, onProg).then(() => {
    if (seq !== ws.seq || !state.wsActive) return;   // a late load must not draw over another view (or a newer range)
    ws.partial = null;
    wsDraw(drew);
  });
}
// patch (from a hash restore) replaces every workspace filter; without it the filters of the last
// visit are kept (the search is always cleared on entry, as in the hub).
function selectWorkspace(patch) {
  const was = state.wsActive;
  leaveHub();
  state.wsActive = true;
  state.libActive = false;
  state.currentTracker = null; state.currentYear = null; state.currentMonth = null;
  state.currentDate = null; state.currentMode = null; state.pendingDates = [];
  state.filterCats = new Set();
  state.search = null;
  if (patch) {
    // a link: with pg= it is that page (and its state is saved there); without, a transient view
    const pg = patch.pg && pgState.pages.find(x => x.id === patch.pg);
    pgTransient = !pg;
    if (pg) pgState.active = pg.id;
    ws.f = TrackerPages.normFilter(patch.f);
    ws.size = TrackerPages.SIZES.includes(Number(patch.sz)) ? Number(patch.sz) : 0;
    ws.pn = Math.max(1, parseInt(patch.pn, 10) || 1);
    const names = wsTrackerNames();
    ws.range = wsNormRange(patch.range);
    ws.prev = null;
    ws.src = names.includes(patch.src) ? patch.src : '';
    ws.ty = NEWS_TYPES.some(x => x.id === patch.ty) ? patch.ty : '';
    ws.w = patch.w || '';
    ws.pl = HUB_PLATFORMS.includes(patch.pl) ? patch.pl : '';
    ws.pk = TrackerTypes.PACKAGES.some(x => x.id === patch.pk) ? patch.pk : '';
    state.searchQuery = patch.q || '';
    if (TrackerPages.LAYOUTS.includes(patch.ly)) ws.mode = patch.ly;
    else if (patch.v === 't') ws.mode = 'titles';
    else if (patch.v === 'c' || patch.v === 'cards') ws.mode = 'cards';
    else ws.mode = pg ? 'cards' : wsLoadMode();   // page links omit ly= only for cards
  } else if (!was) {
    state.searchQuery = '';
    pgTransient = false;
    pgApply(pgActive());
  }
  if (!was) setTimeout(tourMaybeOffer, 800);
  if (!ws.railInit) {
    ws.railInit = true;
    let pref = null;
    try { pref = prefGet('tracker_nav'); } catch (e) {}
    ws.railCollapsed = (typeof matchMedia === 'function' && matchMedia('(max-width: 767px)').matches) ? true : pref === 'collapsed';
  }
  const sb = document.getElementById('search-box'); if (sb) sb.value = state.searchQuery;
  const sc = document.getElementById('search-clear'); if (sc) sc.style.display = state.searchQuery ? 'inline' : 'none';
  document.documentElement.dataset.mode = 'ws';   // hides the date sidebar / second header row, shows the rail + time chip
  const sr = document.getElementById('search-row'); if (sr) sr.style.display = '';
  setActivePill('#tracker-pills', '[data-tracker="__ws"]');
  document.getElementById('tracker-title').textContent = t('wsTitle');
  document.getElementById('year-pills').innerHTML = '';
  document.getElementById('month-grid').innerHTML = '';
  document.getElementById('cat-pills').innerHTML = '';
  hideDateList();
  renderWorkspace();
}

let pgState = TrackerPages.defaultState();

// page → workspace

    pl: ws.pl, pk: ws.pk, layout: ws.mode, size: ws.size, f: ws.f }, 0);

}

let pgMenuEl = null;
function pgCloseMenu() { if (pgMenuEl) { pgMenuEl.remove(); pgMenuEl = null; } }
function pgToggleMenu(anchor) {
  if (pgMenuEl) { pgCloseMenu(); return; }
  const p = pgActive(), i = pgState.pages.indexOf(p);
  const m = wsEl('div', 'pg-menu');
  m.setAttribute('role', 'menu');
  const item = (label, fn, dis) => {
    const b = wsEl('button', 'pg-menu-item', label);
    b.type = 'button'; b.setAttribute('role', 'menuitem');
    if (dis) b.disabled = true;
    b.onclick = () => { pgCloseMenu(); fn(); };
    m.appendChild(b);
  };
  const cur = pgTransient ? null : p;
  item(pt('rename'), () => pgRename(p.id), !cur);
  item(pt('dup'), () => pgDuplicate(p.id), !cur || !TrackerPages.canAdd(pgState));
  item(pt('left'), () => pgMove(p.id, -1), !cur || i <= 0);
  item(pt('right'), () => pgMove(p.id, 1), !cur || i >= pgState.pages.length - 1);
  item(pt('del'), () => pgDelete(p.id), !cur || pgState.pages.length <= 1);
  m.appendChild(wsEl('div', 'pg-menu-sep'));
  item(pt('exportP'), pgExport);
  item(pt('importP'), pgImport);
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.top = (r.bottom + 4) + 'px';
  m.style.left = Math.max(8, Math.min(window.innerWidth - m.offsetWidth - 8, r.right - m.offsetWidth)) + 'px';

document.addEventListener('click', e => { if (pgMenuEl && !pgMenuEl.contains(e.target)) pgCloseMenu(); });

function pgRename(id) {
  const p = pgState.pages.find(x => x.id === id); if (!p) return;
  const name = prompt(pt('renameQ'), pgName(p));
  if (name === null) return;
  p.name = String(name).trim().slice(0, 30);
  pgSave(); pgBuildBar();
}
function pgDuplicate(id) {
  const p = pgState.pages.find(x => x.id === id); if (!p || !TrackerPages.canAdd(pgState)) return;
  const copy = TrackerPages.normPage(Object.assign({}, p, { id: TrackerPages.newId(pgState), name: pgName(p) + ' 2' }), 0);
  pgState.pages.splice(pgState.pages.indexOf(p) + 1, 0, copy);
  pgSwitch(copy.id);
}
function pgMove(id, d) {
  const i = pgState.pages.findIndex(x => x.id === id), j = i + d;

  const [p] = pgState.pages.splice(i, 1);

}
function pgDelete(id) {
  const p = pgState.pages.find(x => x.id === id); if (!p || pgState.pages.length <= 1) return;
  if (!confirm(pt('delQ')(pgName(p)))) return;
  const i = pgState.pages.indexOf(p);

function pgExport() {

    { type: 'application/json' });

function pgImport() {

    const f = inp.files && inp.files[0]; if (!f) return;
    f.text().then(txt => {
      let o; try { o = JSON.parse(txt); } catch (e) { alert(pt('importBad')); return; }
      if (!o || o.v !== 1 || !Array.isArray(o.pages) || !o.pages.length) { alert(pt('importBad')); return; }
      // Imported pages are added after the existing ones (ids renumbered), never replace them.
      let n = 0;

function startTour() {

function tourShow() {

  spot.style.width = (r.width + pad * 2) + 'px'; spot.style.height = (r.height + pad * 2) + 'px';

  const end = wsEl('button', 'pg-btn pg-btn-quiet', pt('tourEnd')); end.type = 'button'; end.onclick = tourEnd;
  row.appendChild(end);
  if (tourIdx > 0) { const pv = wsEl('button', 'pg-btn', pt('tourPrev')); pv.type = 'button'; pv.onclick = () => { tourIdx--; tourShow(); }; row.appendChild(pv); }
  const last = tourIdx === tourSteps.length - 1;
  const nx = wsEl('button', 'pg-btn pg-btn-primary', last ? pt('tourDone') : pt('tourNext')); nx.type = 'button';
  nx.onclick = () => { if (last) tourEnd(); else { tourIdx++; tourShow(); } };
  row.appendChild(nx);
  card.appendChild(row);
  // place the card below the target, or above when there is no room
  const cw = Math.min(340, window.innerWidth - 24);
  card.style.width = cw + 'px';
  const left = Math.max(12, Math.min(window.innerWidth - cw - 12, r.left));
  card.style.left = left + 'px';
  const below = r.bottom + pad + 10;
  card.style.top = '0px';

function daysBetween(a, b) {

function renderLibrary() {

  const active = lib.topics.filter(t => t.status !== 'gone');

// Which date to show for a topic, and how much it is worth. `source_date` is

const LIB_DATE_LABEL = {

const LIB_NEW_MAX_SHARE = 0.5;

  // — it moves for every page at once — so it never earns the chip.

}

function selectMonth(month) {
  state.currentMode  = 'month';
  state.currentMonth = month;
  state.currentDate  = null;
  setActiveMonthBtn(month);
  showMsg(L().ui.loadMonth(month));

  loadMonthManifest(month, () => {
    buildDateList(month);
    const dates = getDatesForMonth(month);
    if (!dates.length) { renderArticles([]); pendingRestore = null; restoring = false; return; }
    // Renders the whole month, then (deep-link) jumps to a specific date once
    // its day file is present. In the normal flow jumpDate is null → no-op.
    const done = () => {
      const jumpDate = (pendingRestore && pendingRestore.date &&
        dates.some(x => x.date === pendingRestore.date)) ? pendingRestore.date : null;
      pendingRestore = null; restoring = false;
      renderArticles(dates.map(d2 => d2.date));
      if (jumpDate) selectDate(jumpDate);
    };
    const toLoad = dates.filter(d => !state.loadedFiles.has(d.file));
    if (!toLoad.length) { done(); return; }
    let pending = toLoad.length;
    toLoad.forEach(d => loadDayFile(d.file, () => { if (--pending === 0) done(); }));
  });
}

// ── Full-year ─────────────────────────────────────────
function selectFullYear() {
  state.currentMode  = 'full-year';
  state.currentMonth = null;
  state.currentDate  = null;
  clearActiveMonthBtn();
  hideDateList();
  if (state.searchQuery && state.search) {
    renderArticles(searchDatesInYear(state.currentYear));
    return;
  }
  showMsg(t('loadFullYear'));

  const ym = getYearManifest(state.currentYear);
  if (!ym || !ym.months || !ym.months.length) { renderArticles([]); return; }
  let pending = ym.months.length;
  ym.months.forEach(m => loadMonthManifest(m, () => {
    if (--pending > 0) return;
    // Use the tracker-aware helper instead of reading TRACKER_MONTH flat —
    // the new layout nests by tracker: window.TRACKER_MONTH[tracker][month].
    const allDates = ym.months.flatMap(m2 => getDatesForMonth(m2));
    const toLoad = allDates.filter(d => !state.loadedFiles.has(d.file));
    if (!toLoad.length) { renderArticles(allDates.map(d => d.date)); return; }
    let dp = toLoad.length;
    toLoad.forEach(d => loadDayFile(d.file, () => {
      if (--dp === 0) renderArticles(allDates.map(d2 => d2.date));
    }));
  }));
}

// ── Date selection ────────────────────────────────────
function selectDate(date) {
  state.currentMode = 'date';
  state.currentDate = date;
  document.querySelectorAll('.date-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
  const btn = document.querySelector('.date-btn[data-date="' + date + '"]');
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }
  renderArticles([date]);
  // On compact the drawer is modal — dismiss it after picking a date so the
  // results aren't hidden behind it. (Not during a deep-link restore.)
  if (!restoring && isCompact()) closeNav(false);
}

// ── Build UI helpers ──────────────────────────────────
function buildYearPills(years) {
  const el = document.getElementById('year-pills');
  el.innerHTML = '';
  years.forEach((y, i) => {
    const btn = document.createElement('button');
    btn.className = 'pill year-pill' + (i === 0 ? ' active' : '');
    btn.dataset.year = y;
    btn.textContent = y;
    btn.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    btn.onclick = () => selectYear(y);
    el.appendChild(btn);
  });
}

function buildCatPills(cats) {
  const el = document.getElementById('cat-pills');
  el.innerHTML = '';
  const all = ['全部', ...cats];
  const icons = { '全部':'', '法規與標準':'📋 ', '漏洞與威脅情報':'🔴 ', '供應鏈與開源安全':'🔗 ', '重大事件':'🚨 ', '前瞻技術':'🚀 ',
                  'Linux':'🐧 ', 'Windows':'🪟 ', 'Apple':'🍎 ', 'Android':'🤖 ', '重點關注':'⭐ ' };
  const mkPill = (c) => {
    const btn = document.createElement('button');
    btn.className = 'pill cat-pill';
    btn.dataset.cat = c;   // key stays Chinese; only the label is localized
    btn.dataset.icon = icons[c] || '';
    btn.onclick = () => setFilter(c);
    return btn;
  };
  all.forEach((c) => el.appendChild(mkPill(c)));
  const wp = document.createElement('button');   // 只看關注: not a category, so refreshCatPills skips it
  wp.className = 'pill watch-pill';
  wp.onclick = toggleWatchOnly;
  el.appendChild(wp);
  // Second row (rebuilt on every call, so a tracker switch removes it).
  // Skip any category already in the first row: never two pills per data-cat.
  const sec = SECONDARY_PILLS[state.currentTracker];
  const secCats = sec ? sec.cats.filter(c => !all.includes(c)) : [];
  if (secCats.length) {
    const row = document.createElement('div');
    row.className = 'cat-row-2';
    const lab = document.createElement('span');
    lab.className = 'cat-row-label';
    lab.textContent = sec.label;
    row.appendChild(lab);
    secCats.forEach((c) => row.appendChild(mkPill(c)));
    el.appendChild(row);
  }
  refreshCatPills();   // sets textContent (icon + label + selected-checkmark), active, aria-pressed
  refreshWatchPill();
}

// Multi-select: 全部 is active when nothing is picked; otherwise every picked
// category pill is highlighted (more than one can be on at once). Selected
// chips get a leading "✓ " per the MD3 filter-chip convention (background
// colour alone is not a reliable selected-state signal here, since the
// selected fill IS the category's own hue).
function refreshCatPills() {
  document.querySelectorAll('#cat-pills .cat-pill').forEach(btn => {
    const c = btn.dataset.cat;
    const on = c === '全部' ? state.filterCats.size === 0 : state.filterCats.has(c);
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    const check = (on && c !== '全部') ? '✓ ' : '';
    btn.textContent = check + (btn.dataset.icon || '') + catLabel(c);
  });
}

function buildMonthGrid(year) {
  let availMonths;
  if (state.searchQuery && state.search) {
    // Only months that contain matched dates are selectable.
    availMonths = new Set(Object.keys(state.search.countByDate)
      .filter(d => d.slice(0, 4) === year).map(d => d.slice(0, 7)));
  } else {
    const ym = getYearManifest(year);
    availMonths = new Set(ym?.months || []);
  }
  const grid = document.getElementById('month-grid');
  grid.innerHTML = '';
  const monthNames = L().months;
  for (let m = 1; m <= 12; m++) {
    const key = year + '-' + String(m).padStart(2, '0');
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (availMonths.has(key) ? '' : ' empty');
    btn.dataset.month = key;
    btn.textContent = monthNames[m - 1];
    if (availMonths.has(key)) {
      btn.setAttribute('aria-pressed', 'false');
      btn.onclick = () => selectMonth(key);
    } else {
      btn.setAttribute('aria-disabled', 'true');
    }
    grid.appendChild(btn);
  }
}

function setActiveMonthBtn(month) {
  document.querySelectorAll('.month-btn').forEach(b => { b.classList.remove('active'); if (!b.classList.contains('empty')) b.setAttribute('aria-pressed', 'false'); });
  const btn = document.querySelector('.month-btn[data-month="' + month + '"]');
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }
}
function clearActiveMonthBtn() {
  document.querySelectorAll('.month-btn').forEach(b => { b.classList.remove('active'); if (!b.classList.contains('empty')) b.setAttribute('aria-pressed', 'false'); });
}

function buildDateList(month) {
  const dates = getDatesForMonth(month);
  const section = document.getElementById('date-section');
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  if (!dates.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  dates.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'date-btn' + (i === 0 ? ' active' : '');
    btn.dataset.date = d.date;
    btn.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    btn.innerHTML = '<span>' + d.date.slice(5) + '</span><span class="badge">' + d.count + '</span>';
    btn.onclick = () => selectDate(d.date);
    list.appendChild(btn);
  });
}
function hideDateList() {
  document.getElementById('date-section').style.display = 'none';
}

// ── Filter ────────────────────────────────────────────
function setFilter(cat) {
  if (cat === '全部') {
    state.filterCats.clear();                 // 全部 resets the multi-select
  } else if (state.filterCats.has(cat)) {
    state.filterCats.delete(cat);             // toggle off
  } else {
    state.filterCats.add(cat);                // toggle on (multi-select)
  }
  refreshCatPills();
  if (state.searchQuery && state.search) {
    refreshSearchView();   // date menu + counts depend on the category too
  } else {
    renderArticles();
  }
}

// ── Render ────────────────────────────────────────────
function renderArticles(dateList) {
  if (state.hubActive || state.wsActive) return;   // a late tracker load must not draw over the 我的關注 hub or the news workspace
  if (pendingOpenId !== null) setTimeout(openPendingArticle, 0);   // `a=` permalink: open once this render has finished
  if (dateList !== undefined) state.pendingDates = dateList;
  const dates = state.pendingDates;

  const main = document.getElementById('main-content');
  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('no-data').classList.add('hidden');

  // Collect articles
  let articles = TrackerStore.collect(window.TRACKER_DAYS || {}, { dates: dates || [] });

  // Filter by current tracker (multi-belong: keep items whose `trackers`
  // includes the current tracker; legacy items default to security).
  if (state.currentTracker) {
    articles = articles.filter(a => itemBelongsToTracker(a, state.currentTracker));
  }

  if (state.filterCats.size) {
    articles = articles.filter(a =>
      state.filterCats.has(effectiveCat(a, state.currentTracker)));
  }

  // Site-wide search: keep only items matching the query (in either language).
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    articles = articles.filter(a => matchesQuery(a, q));
  }

  // 只看關注: only articles matching an active watch rule (counted below).
  if (watchOnly) articles = articles.filter(a => watchLabels(a).length);

  document.getElementById('article-count').textContent = articles.length;
  syncHash();   // keep the URL in step with the current view

  // Clear old cards (keep search row + loading/no-data divs)
  Array.from(main.children).forEach(c => {
    if (c.id !== 'loading-msg' && c.id !== 'no-data' && c.id !== 'search-row' && c.id !== 'pg-bar') c.remove();
  });

  if (!articles.length) {
    const noData = document.getElementById('no-data');
    noData.classList.remove('hidden');
    noData.textContent = state.searchQuery
      ? L().ui.noResults(state.searchQuery)
      : (watchOnly ? t('noWatch')
      : state.filterCats.size === 0
          ? t('noData')
          : L().ui.noCat([...state.filterCats].map(catLabel).join(' / ')));
    return;
  }

  // Layout dispatch (view preset). All layouts render the same `articles`
  // array, so #article-count (set above) is identical across layouts.
  const layout = resolvePreset(viewPrefs).layout;
  if (layout === 'hub') { renderHub(main, articles); return; }
  if (layout === 'timeline') { renderTimeline(main, articles); return; }

  // Group by date descending
  const grouped = {};
  articles.forEach(a => {
    const d = a._date;
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(a);
  });
  const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

  const frag = document.createDocumentFragment();
  sortedDates.forEach((date, di) => {
    const divider = document.createElement('div');
    divider.className = 'date-divider';
    divider.textContent = date;
    frag.appendChild(divider);

    if (layout === 'river') {
      const list = document.createElement('div');
      list.className = 'river-list';
      grouped[date].forEach(a => list.appendChild(buildRiverRow(a)));
      frag.appendChild(list);
      return;
    }
    // grid (default; also the stand-in for layouts not built yet) and hero
    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    grouped[date].forEach((a, i) => {
      const card = buildCard(a);
      if (layout === 'hero' && di === 0 && i === 0) card.classList.add('card-hero');
      grid.appendChild(card);
    });
    frag.appendChild(grid);
  });
  main.appendChild(frag);
}

// Wire click/keyboard activation of an article element to the overlay.
function bindOpen(el, a) {
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', artTitle(a));
  el.onclick = () => openOverlay(a, el);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); openOverlay(a, el); }
  });
}

// river: one compact row = title + a single meta line.
function buildRiverRow(a) {
  const row = document.createElement('div');
  row.className = 'river-row';
  const ecat = effectiveCat(a, state.currentTracker);
  const srcName = a.sources && a.sources[0] ? a.sources[0].name : '';
  const meta = [catLabel(ecat), srcName, a._date].filter(Boolean).join(' · ');
  const wBadge = watchBadgeHtml(a);
  if (wBadge) row.classList.add('watched');
  row.innerHTML = [
    '<h3 class="card-title">' + wBadge + linkifyCVE(escHtml(artTitle(a))) + '</h3>',
    '<div class="card-meta">' + escHtml(meta) + '</div>'
  ].join('');
  bindOpen(row, a);
  return row;
}

// timeline: one group per CVE id found in the tags (an article with several CVEs
// appears under each), groups by latest date desc, rows newest first; articles
// without a CVE follow under "其他"/"Other" in the normal river layout.
function renderTimeline(main, articles) {
  const byDate = (x, y) => (y._date || '').localeCompare(x._date || '');
  const groups = {}, other = [];
  articles.forEach(a => {
    const ids = [];
    artTags(a).forEach(tg => { if (/^CVE-\d{4}-\d{4,}$/.test(tg) && !ids.includes(tg)) ids.push(tg); });
    if (!ids.length) { other.push(a); return; }
    ids.forEach(id => (groups[id] = groups[id] || []).push(a));
  });
  const list = Object.keys(groups).map(id => {
    const arts = groups[id].slice().sort(byDate);
    return { id: id, arts: arts, latest: arts[0]._date || '', first: arts[arts.length - 1]._date || '' };
  }).sort((x, y) => y.latest.localeCompare(x.latest) || x.id.localeCompare(y.id));
  const frag = document.createDocumentFragment();
  list.forEach(g => {
    const head = document.createElement('div');
    head.className = 'date-divider timeline-head';
    const span = g.first === g.latest ? g.latest : g.first + ' ~ ' + g.latest;
    head.textContent = g.id + ' · ' + L().ui.tlCount(g.arts.length) + ' · ' + span;
    frag.appendChild(head);
    const rows = document.createElement('div');
    rows.className = 'river-list';
    g.arts.forEach(a => rows.appendChild(buildRiverRow(a)));
    frag.appendChild(rows);
  });
  if (other.length) {
    const head = document.createElement('div');
    head.className = 'date-divider timeline-head';
    head.textContent = L().ui.tlOther;
    frag.appendChild(head);
    const rows = document.createElement('div');
    rows.className = 'river-list';
    other.slice().sort(byDate).forEach(a => rows.appendChild(buildRiverRow(a)));
    frag.appendChild(rows);
  }
  main.appendChild(frag);
}

// hub: sections grouped by effective category (tracker's own order first).
function renderHub(main, articles) {
  const groups = {};
  articles.forEach(a => {
    const c = effectiveCat(a, state.currentTracker);
    (groups[c] = groups[c] || []).push(a);
  });
  const own = ((currentManifest() || {}).categories) || [];
  const keys = Object.keys(groups).sort((x, y) => {
    const ix = own.indexOf(x), iy = own.indexOf(y);
    return (ix < 0 ? 1e6 : ix) - (iy < 0 ? 1e6 : iy);
  });
  const frag = document.createDocumentFragment();
  keys.forEach(c => {
    const head = document.createElement('div');
    head.className = 'date-divider hub-title';
    head.textContent = catLabel(c) + ' (' + groups[c].length + ')';
    frag.appendChild(head);
    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    groups[c].forEach(a => grid.appendChild(buildCard(a)));
    frag.appendChild(grid);
  });
  main.appendChild(frag);
}

function wsTypeName(tyId) {
  const ty = NEWS_TYPES.find(x => x.id === tyId);
  return ty ? (state.lang === 'en' ? ty.en : ty.zh) : tyId;
}

function bindWsOpen(el, a) {
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', artTitle(a));
  el.onclick = () => openReader(a, ws.shown, el);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      openReader(a, ws.shown, el);
    }
  });
}

function buildWsCard(a) {
  const card = document.createElement('div');
  const tyId = hubTypeId(a);
  const tyName = wsTypeName(tyId);
  const wl = watchLabels(a);
  const hasStar = wl && wl.length > 0;
  const isRead = isArticleRead(a);
  const idStr = articleIdOf(a);
  card.className = 'ws-card' + (hasStar ? ' watched' : '') + (isRead ? ' is-read' : '');
  if (idStr) card.dataset.id = idStr;
  const title = artTitle(a);
  const summary = artSummary(a);
  const srcName = (a.sources && a.sources[0]) ? a.sources[0].name : (a.source || '');
  const mmdd = (a._date || a.date || '').replace(/^\d{4}-/, '');
  const footerText = [srcName, mmdd].filter(Boolean).join(' · ');

  card.innerHTML = [
    '<div class="ws-card-top">',
      '<span class="ws-type-chip ws-ty-' + escHtml(tyId) + '">' + escHtml(tyName) + '</span>',
      (hasStar ? '<span class="ws-star" title="' + escHtml(wl.join(' / ')) + '">★</span>' : ''),
    '</div>',
    '<h3 class="ws-card-title">' + escHtml(title) + '</h3>',
    '<p class="ws-card-summary">' + escHtml(summary) + '</p>',
    '<div class="ws-card-footer">' + escHtml(footerText) + '</div>'
  ].join('');

  bindWsOpen(card, a);
  return card;
}

function buildWsTitleRow(a) {
  const row = document.createElement('div');
  const tyId = hubTypeId(a);
  const tyName = wsTypeName(tyId);
  const wl = watchLabels(a);
  const hasStar = wl && wl.length > 0;
  const isRead = isArticleRead(a);
  const idStr = articleIdOf(a);

  if (idStr) row.dataset.id = idStr;
  const title = artTitle(a);
  const srcName = (a.sources && a.sources[0]) ? a.sources[0].name : (a.source || '');

function buildCard(a) {
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', artTitle(a));
  const ecat = effectiveCat(a, state.currentTracker);
  const catClass = 'cat-' + ecat;   // colour class keyed on the viewing tracker's category
  const title = artTitle(a), summary = artSummary(a);
  const preview = summary;
  const srcName = a.sources && a.sources[0] ? escHtml(a.sources[0].name) : '';
  const srcCountHtml = resolvePreset(viewPrefs).showSrcCount
    ? ' · ' + escHtml(L().ui.srcCount((a.sources || []).length)) : '';
  const tagsHtml = artTags(a).map(tg => {
    if (/^CVE-\d{4}-\d{4,}$/.test(tg)) {
      return '<a class="card-tag" href="https://www.cve.org/CVERecord?id=' + tg + '" target="_blank" rel="noopener">' + escHtml(tg) + '</a>';
    }
    return '<span class="card-tag">' + escHtml(tg) + '</span>';
  }).join('');
  const wBadge = watchBadgeHtml(a);
  if (wBadge) card.classList.add('watched');
  card.innerHTML = [
    '<span class="cat-badge ' + catClass + '">' + escHtml(catLabel(ecat)) + '</span>' + wBadge,
    '<h3 class="card-title">' + linkifyCVE(escHtml(title)) + '</h3>',
    '<p class="card-summary-preview">' + escHtml(preview) + '</p>',
    '<div class="card-tags">' + tagsHtml + '</div>',
    '<div class="card-meta">' + srcName + (srcName ? ' · ' : '') + escHtml(a._date) + srcCountHtml + '</div>'
  ].join('');
  card.onclick = () => openOverlay(a, card);
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); openOverlay(a, card); }
    else if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); openOverlay(a, card); }  // prevent page scroll
  });
  return card;
}

// Focus that gets restored to the triggering card once the dialog closes.
let overlayReturnFocus = null;
function overlayTabTrap(e) {
  if (e.key !== 'Tab') return;
  const box = document.getElementById('overlay-box');
  const focusables = [...box.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
// Article id (String(id) or _key) shown in the overlay, or null; syncHash mirrors it as `a=`.
var overlayArticleId = null;
function openOverlay(a, triggerEl) {
  overlayReturnFocus = triggerEl || document.activeElement;
  const box = document.getElementById('overlay-box');
  const ecat = effectiveCat(a, state.currentTracker);
  const catClass = 'cat-' + ecat;
  const srcHtml = (a.sources || []).map(s =>
    '<li><a href="' + escHtml(safeHref(s.url)) + '" target="_blank" rel="noopener">[' + escHtml(s.lang) + '] ' + escHtml(s.name) + '</a></li>'
  ).join('');
  const tagsHtml = artTags(a).map(tg => {
    if (/^CVE-\d{4}-\d{4,}$/.test(tg)) {
      return '<a class="card-tag" href="https://www.cve.org/CVERecord?id=' + tg + '" target="_blank" rel="noopener">' + escHtml(tg) + '</a>';
    }
    return '<span class="card-tag">' + escHtml(tg) + '</span>';
  }).join('');
  box.innerHTML = [
    '<button id="overlay-close" onclick="closeOverlay()" aria-label="' + escHtml(t('close')) + '"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>',
    '<span class="cat-badge ' + catClass + '">' + escHtml(catLabel(ecat)) + '</span>',
    '<h2 id="overlay-title">' + linkifyCVE(escHtml(artTitle(a))) + '</h2>',

}

  const monthFile = ym && ym.monthFiles && ym.monthFiles[month];
  if (!monthFile) { state.loadedMonths.add(key); cb(); return; }
  // monthFiles are relative to the year manifest's own dir (data/{tracker}/).

    resolved = 'data/' + file.slice(3);  // -> data/data-YYYYMMDD.js

  injectScript(resolved, () => { state.loadedFiles.add(resolved); cb(); });

// ── Deep-linking (URL hash ⇄ view state) ──────────────
// The hash mirrors the current view so a link restores it: tracker / year /
// month (or * for full-year) / date / category filter / search query / skin.
// Writes go through history.replaceState (no history spam, no hashchange), so

  if (restoring) return;

  if (state.wsActive) {   // news workspace: ws=1, range (30d omitted), filters, search, article
    const wp = ['ws=1'];
    if (ws.range !== '30d') wp.push('r=' + ws.range);
    if (ws.src) wp.push('src=' + encodeURIComponent(ws.src));
    if (ws.ty) wp.push('ty=' + encodeURIComponent(ws.ty));
    if (ws.w) wp.push('w=' + encodeURIComponent(ws.w));
    if (ws.pl) wp.push('pl=' + encodeURIComponent(ws.pl));
    if (ws.pk) wp.push('pk=' + encodeURIComponent(ws.pk));
    if (state.searchQuery) wp.push('q=' + encodeURIComponent(state.searchQuery));
    if (!pgTransient) wp.push('pg=' + encodeURIComponent(pgState.active));
    if (ws.mode === 'titles') wp.push('v=t');
    else if (ws.mode !== 'cards') wp.push('ly=' + ws.mode);
    if (ws.size) wp.push('sz=' + ws.size);
    if (ws.size && ws.pn > 1) wp.push('pn=' + ws.pn);
    const fc = TrackerPages.compactFilter(ws.f);
    if (Object.keys(fc).length) wp.push('f=' + encodeURIComponent(JSON.stringify(fc)));

    if (palettePref) hp.push('pal=' + palettePref);
    hp.push('p=' + encodeURIComponent(viewPrefs.preset));
    if (overlayArticleId !== null) hp.push('a=' + encodeURIComponent(overlayArticleId));
    const hh = '#' + hp.join('&');

    if (state.libGroup !== 'cluster') lp.push('g=' + state.libGroup);
    if (skinOf()) lp.push('s=' + skinOf());
    if (palettePref) lp.push('pal=' + palettePref);
    lp.push('p=' + encodeURIComponent(viewPrefs.preset));
    if (overlayArticleId !== null) lp.push('a=' + encodeURIComponent(overlayArticleId));
    const lh = '#' + lp.join('&');
    if (lh !== location.hash) {
      try { history.replaceState(null, '', lh); }
      catch (e) { suppressHashChange = true; location.hash = lh; }
    }
    return;
  }
  const p = [];
  if (state.currentTracker) p.push('t=' + state.currentTracker);
  if (state.currentYear) p.push('y=' + state.currentYear);
  if (state.currentMode === 'full-year') p.push('m=*');
  else if (state.currentMonth) p.push('m=' + state.currentMonth);
  if (state.currentDate) p.push('d=' + state.currentDate);
  if (state.filterCats.size) p.push('c=' + [...state.filterCats].map(encodeURIComponent).join(','));
  if (state.searchQuery) p.push('q=' + encodeURIComponent(state.searchQuery));
  const skin = document.documentElement.dataset.skin;
  if (skin) p.push('s=' + skin);
  if (palettePref) p.push('pal=' + palettePref);
  p.push('p=' + encodeURIComponent(viewPrefs.preset));
  if (overlayArticleId !== null) p.push('a=' + encodeURIComponent(overlayArticleId));
  const hash = '#' + p.join('&');
  if (hash === location.hash) return;
  try { history.replaceState(null, '', hash); }
  catch (e) { suppressHashChange = true; location.hash = hash; }
}

function parseHash() {
  const h = (location.hash || '').replace(/^#/, '');

  h.split('&').forEach(kv => {
    const i = kv.indexOf('=');
    if (i < 0) return;
    o[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });

  if (state.currentTracker && !state.libActive && !state.hubActive) {

  const art = list.find(x => x && (x._key === sid || String(x.id) === sid));

  if (h && h.lib) {          // CRA library deep-link
    if (h.s === 'md3' || h.s === 'classic') document.documentElement.dataset.skin = h.s;
    state.libCluster = h.c || null;
    if (h.g === 'cluster' || h.g === 'date' || h.g === 'source') state.libGroup = h.g;
    selectLibrary();
    openPendingArticle();
    return true;
  }
  if (h && h.hub) {            // 我的關注 deep-link (hv / hw override the stored choice, not persisted)
    if (h.s === 'md3' || h.s === 'classic') document.documentElement.dataset.skin = h.s;
    if (h.hv === 'sections' || h.hv === 'tiles') hubPrefs = { ...hubPrefs, hv: h.hv };
    if (HUB_WINDOWS.includes(+h.hw)) hubPrefs = { ...hubPrefs, hw: +h.hw };
    selectHub();
    openPendingArticle();
    return true;
  }
  if (!h || !h.t) {
    // preset-only hash change on an already-rendered view: re-render in place
    if (presetChanged && state.currentTracker && !restoring) renderArticles();
    return false;
  }
  const all = getTrackers();
  if (!all || !all[h.t]) return false;
  if (h.s === 'md3' || h.s === 'classic') document.documentElement.dataset.skin = h.s;
  restoring = true;
  selectTracker(h.t);          // restoring=true makes it skip its default year auto-select
  // category filter
  if (h.c) {
    state.filterCats = new Set();
    h.c.split(',').filter(Boolean).forEach(c => state.filterCats.add(c));
    refreshCatPills();
  } else if (h.p) {
    // `p=` without `c=` (e.g. the console preview link): show the preset with its default filters.
    applyPresetFilters();
  }
  // search query takes its own (search-aware) path
  if (h.q) {
    state.searchQuery = h.q;
    const sb = document.getElementById('search-box'); if (sb) sb.value = h.q;
    const sc = document.getElementById('search-clear'); if (sc) sc.style.display = 'inline';
    restoring = false; pendingRestore = null;
    runSearch();
    return true;
  }
  const years = all[h.t].years || [];
  const year = (h.y && years.includes(h.y)) ? h.y : years[0];
  if (!year) { restoring = false; return true; }
  pendingRestore = { month: h.m === '*' ? null : h.m, date: h.d, fullYear: h.m === '*' };
  selectYear(year);            // async chain consumes pendingRestore for month/date
  return true;
}

// ── Events ────────────────────────────────────────────
window.addEventListener('hashchange', () => {
  if (suppressHashChange) { suppressHashChange = false; return; }
  if (!restoring) applyHashRestore();
});
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeOverlay();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!document.getElementById('overlay').classList.contains('hidden')) closeOverlay();
  else if (document.getElementById('reader') && !document.getElementById('reader').classList.contains('hidden')) closeReader();
  else if (state.wsActive && ws.panelOpen) { wsToggleTimePanel(false); const c = document.getElementById('ws-time-chip'); if (c) c.focus(); }
  else if (document.getElementById('sidebar').classList.contains('nav-open')) closeNav(true);
});

// Floating nav drawer: hamburger toggles it, scrim (compact) click closes it.
(function wireDrawer() {
  const btn = document.getElementById('drawer-toggle');
  const scrim = document.getElementById('sidebar-scrim');
  if (btn) btn.addEventListener('click', toggleNav);
  if (scrim) scrim.addEventListener('click', () => closeNav(true));
})();

// Search box: debounced live search + Enter + Esc/clear.
(function wireSearch() {
  const box = document.getElementById('search-box');
  if (!box) return;
  let timer;
  box.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(runSearch, 300); });
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(timer); runSearch(); }
    else if (e.key === 'Escape') { box.value = ''; clearSearch(); box.blur(); }
  });
  document.getElementById('search-clear').addEventListener('click', () => {
    box.value = ''; clearSearch(); box.focus();
  });
  document.querySelectorAll('#search-scope .scope-pill').forEach(btn => {
    btn.addEventListener('click', () => toggleScope(btn.dataset.scope, btn));
  });
})();

document.addEventListener('DOMContentLoaded', init);
</script>
